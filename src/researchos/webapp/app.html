function resolveNote(answer, res) {
  const lines = [];
  if (answer === "fork") lines.push("新的项目身份：" + res.project_id + "。从现在起，这里的连线确认不会出现在原项目里。");
  if (answer === "claim") lines.push("项目的索引已按这个文件夹重新建立。");
  if (answer === "adopt") lines.push("新的项目身份：" + res.project_id + "，原有记录都保留了。");
  if (answer === "restore" && res.restored_from) lines.push("项目身份文件已从备份恢复：" + res.restored_from);
  if (res.git_tracked_identity) lines.push("注意：.researchos/project.toml 由 git 跟踪；提交它，会把新的身份带进它被合并到的分支。");
  if (res.moved_aside && res.moved_aside.length) lines.push("复制来的记录已移进 .researchos/backups/（没有删除）：" + res.moved_aside.join("、"));
  const titles = {
    fork: "已作为独立分支继续", claim: "已认领：这里是原项目", other: "已作为另一个项目打开",
    restore: "项目身份已恢复", adopt: "已沿用这些记录，建立新身份",
  };
  if (!titles[answer]) return null;
  if (res.build_error) lines.push("重新建立索引时出了错，下次打开会再试。");
  return { tone: res.build_error ? "bad" : "", title: titles[answer], lines: lines, detail: res.build_error || null };
}

async function answerSituation(answer, statusEl, buttons) {
  if (ANSWER_CONFIRM[answer] && !window.confirm(ANSWER_CONFIRM[answer])) return;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在处理…");
  let res;
  try {
    res = await apiPost("/api/project/resolve", { answer: answer });
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个选择", err);
    return;
  }
  const note = resolveNote(answer, res);
  if (note) state.sessionNotes.push(note);
  await reloadAllViews();
}

async function locateProject(projectId, path, statusEl, buttons) {
  if (!path || path.charAt(0) !== "/") {
    setStatus(statusEl, "err", "请填写文件夹的完整路径（以 / 开头）");
    return;
  }
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在确认这个文件夹是不是这个项目…");
  try {
    await apiPost("/api/projects/locate", { id: projectId, path: path });
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能使用这个位置", err);
    return;
  }
  await reloadAllViews();
}

// `opts` (DESIGN.md 10.2, the add dialog): the same question for a folder
// being added -- `answer(answer, statusEl, buttons)` and `recheck()` in place
// of the served project's resolve / reopen, and no talk of switching away.
function renderSituation(err, opts) {
  const o = opts || {};
  const answerWith = o.answer || answerSituation;
  const sit = err.situation;
  const box = mk("div", "notice bad state-note");
  noticeHead(box, SITUATION_TITLES[sit.situation] || PROJECT_STATES.project_blocked.title);
  if (sit.message && sit.message !== SITUATION_TITLES[sit.situation]) box.appendChild(mk("p", null, sit.message));
  const fact = (label, value) => { if (value) box.appendChild(mk("div", "fact-line", label + value)); };
  const status = mk("div", "notice-status");
  const buttons = [];
  if (sit.situation === "missing") {
    fact("项目列表里记的位置：", sit.path);
    if (sit.reason === "path_holds_another_project") {
      box.appendChild(mk("p", null, "这个位置现在放着另一个项目（或一个没有项目身份的文件夹），不会被当成它。"));
    }
    if (!sit.project_id) {
      box.appendChild(mk("p", null, "这个项目来自旧版本，没有项目身份，无法按身份找回；请在新位置运行 researchos serve。"));
    } else {
      box.appendChild(mk("p", null, "如果你把它移到了别处，在下面指明新位置：Research OS 只认带着这个项目身份的文件夹，不会自己去找。"));
      box.appendChild(mk("div", "notice-title", "选择新位置…"));
      const row = mk("div", "locate-row");
      const input = mk("input", "form-input");
      input.id = "locate-path";
      input.placeholder = "新位置的完整路径，例如 /Users/你/Documents/项目文件夹";
      const use = mkButton("使用这个位置", "btn", () => locateProject(sit.project_id, input.value.trim(), status, buttons));
      buttons.push(use);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") use.click(); });
      row.append(input, use);
      if (shellCan("choose-folder")) {
        const pick = mkButton("选择文件夹…", "btn", async () => {
          const chosen = await chooseFolder("locate");
          if (!chosen) return; // cancelled in the native panel
          input.value = chosen;
          locateProject(sit.project_id, chosen, status, buttons);
        });
        buttons.push(pick);
        row.appendChild(pick);
      }
      box.appendChild(row);
    }
  } else {
    fact("这个文件夹：", sit.path);
    if (sit.situation === "copy" || sit.situation === "cannot_check") fact("项目原来的位置：", sit.home);
    if (sit.situation === "lost_id") {
      if (Array.isArray(sit.records) && sit.records.length) fact("在 .researchos/ 里找到的记录：", sit.records.join("、"));
      if (sit.snapshot) fact("备份里的项目身份：", sit.snapshot.file + (sit.snapshot.created ? "（创建于 " + sit.snapshot.created + "）" : ""));
    }
    if (sit.situation === "unreadable_id") {
      if (sit.line) fact("出错的位置：", "第 " + sit.line + " 行");
      if (Array.isArray(sit.conflict_copies) && sit.conflict_copies.length) fact("旁边的同步冲突副本：", sit.conflict_copies.join("、"));
      box.appendChild(mk("p", null, "修好 .researchos/project.toml（或等它从云端取回、移走冲突副本）之后，点「重新检查」。"));
    }
    box.appendChild(mk("p", null, ((sit.answers || []).length ? "选择之前" : "修好之前") +
      "，Research OS 不会写入任何东西，包括项目列表。" + (o.inDialog ? "" : "也可以在上方切换到别的项目。")));
    (sit.answers || []).forEach((answer) => {
      const label = (sit.answer_labels && sit.answer_labels[answer]) || answer;
      const row = mk("div", "answer");
      const b = mkButton(label, "btn", () => answerWith(answer, status, buttons));
      buttons.push(b);
      row.append(b, mk("span", "answer-help", ANSWER_HELP[answer] || ""));
      box.appendChild(row);
    });
    if (!(sit.answers || []).length) {
      const actions = mk("div", "notice-actions");
      const again = mkButton("重新检查", "btn", () => (o.recheck ? o.recheck() : reopenProject(status, buttons)));
      buttons.push(again);
      actions.appendChild(again);
      box.appendChild(actions);
    }
  }
  box.appendChild(status);
  const raw = sit.detail || err.message;
  if (raw && !o.inDialog) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", raw);
    box.appendChild(d);
  }
  return box;
}

// 「选择文件夹…」 through the native shell (8.9's bridge, task V5 phase 9
// implements the Swift side): page -> native {type: "choose-folder",
// request, purpose}; native -> page window.RCE.folderChosen(request, path |
// null). Offered only when the shell says it can (window.RCEShellFeatures),
// so a shell without it -- or a plain browser -- simply has the path field.
// `purpose` (DESIGN.md 10.7: "add" | "locate") changes only the panel's
// message; it is sent only to a shell that says it takes it
// ("choose-folder-purpose"), since a shell built before V6 ignores any
// message with a third key -- and its panel then reads as 「选择新位置」.
const folderRequests = new Map();

function shellCan(feature) {
  try {
    return Array.isArray(window.RCEShellFeatures) && window.RCEShellFeatures.indexOf(feature) >= 0 &&
      !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce);
  } catch (err) {
    return false;
  }
}

const FOLDER_PURPOSES = ["add", "locate", "create"];
// V8 U4: the shared folder and a member's new working copy -- sent only to
// a shell that says it takes them ("choose-folder-share").
const SHARE_FOLDER_PURPOSES = ["shared", "working"];
// 12.13: a member's own proposals folder -- its own panel message, sent only
// to a shell that says it takes it ("choose-folder-mine"); an older shell
// gets the shared-folder panel, as before.

function chooseFolder(purpose) {
  return new Promise((resolve) => {
    const request = "folder-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    folderRequests.set(request, resolve);
    const message = { type: "choose-folder", request: request };
    if (FOLDER_PURPOSES.indexOf(purpose) >= 0 && shellCan("choose-folder-purpose")) message.purpose = purpose;
    else if (purpose === "mine" && shellCan("choose-folder-mine")) message.purpose = "mine";
    else if (purpose === "mine" && shellCan("choose-folder-share")) message.purpose = "shared";
    else if (SHARE_FOLDER_PURPOSES.indexOf(purpose) >= 0 && shellCan("choose-folder-share")) message.purpose = purpose;
    try {
      window.webkit.messageHandlers.rce.postMessage(message);
    } catch (err) {
      folderRequests.delete(request);
      resolve(null);
    }
  });
}

// A member's public key file, for the PI (V8 U4): the shell's file panel
// ("choose-file-key"), answered through the same callback as a folder.
function chooseKeyFile() {
  return new Promise((resolve) => {
    const request = "folder-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    folderRequests.set(request, resolve);
    try {
      window.webkit.messageHandlers.rce.postMessage({ type: "choose-file", request: request, purpose: "key" });
    } catch (err) {
      folderRequests.delete(request);
      resolve(null);
    }
  });
}

function folderChosen(request, path) {
  const resolve = folderRequests.get(String(request));
  if (!resolve) return false;
  folderRequests.delete(String(request));
  resolve(typeof path === "string" && path ? path : null);
  return true;
}

// -- Add-project wording (pure; DESIGN.md 10.2, 10.3) ---------------------------
// What the add dialog and the scan chip say, as functions of the engine's
// payloads only -- tests/test_v6_page.py loads this block into node. The
// preview's numbers are the engine's (the scan's own inventory); this only
// words them.
const ADD_GROUP_WORDS = [
  ["scripts", "脚本（.py、.R、.Rmd、.do）"],
  ["data", "数据文件"],
  ["drafts", "文稿（.md、.tex、.bib）"],
  ["images", "图片"],
];
const ADD_LARGE_THRESHOLD = 5000; // researchos.addproject.LARGE_THRESHOLD
const ADD_ENTRY_CAP = 100000; // researchos.addproject.ENTRY_CAP

function groupedNumber(n) {
  return String(Math.max(0, Math.floor(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

// {head, items: [[words, n]], notes: [{text, tone}]} for a preview.
function addPreviewText(p) {
  const out = { head: "", items: [], notes: [] };
  if (!p || typeof p !== "object") return out;
  const counts = p.counts || {};
  const git = p.source === "git" && p.git ? p.git : null;
  if (git && git.tracked == null) {
    out.head = "这是一个 git 仓库，但 Research OS 没能向 git 问出它跟踪哪些文件；照现在这样，扫描会在这一步停下。";
  } else if (git) {
    out.head = "这是一个 git 仓库：Research OS 只读取 git 跟踪的文件，共 " + groupedNumber(git.tracked) + " 个。其中要扫描的有：";
  } else {
    out.head = "Research OS 会读取这个文件夹里的这些文件：";
  }
  ADD_GROUP_WORDS.forEach(([key, words]) => out.items.push([words, groupedNumber(counts[key])]));
  out.items.push(["共计要扫描", groupedNumber(p.to_scan)]);
  if (counts.other > 0) {
    out.notes.push({ text: "另有 " + groupedNumber(counts.other) + " 个文件不属于这几类，Research OS 不读它们。", tone: "" });
  }
  if (git && git.tracked != null) {
    if (git.untracked > 0) {
      out.notes.push({
        text: "另有 " + (git.untracked_truncated ? "至少 " : "") + groupedNumber(git.untracked) + " 个未被 git 跟踪的文件不会被扫描。",
        tone: "warn",
      });
    } else if (git.error) {
      out.notes.push({ text: "没能数出有多少文件未被 git 跟踪；未被跟踪的文件不会被扫描。", tone: "warn" });
    }
  }
  if (p.dataless > 0 && p.cloud && p.cloud.message) {
    // 11.1: only in the cloud and nobody can download them -- never read.
    out.notes.push({ text: "其中 " + groupedNumber(p.dataless) + " 个文件不会被读取：" + p.cloud.message + "。", tone: "warn" });
  } else if (p.dataless > 0) {
    const where = p.cloud && p.cloud.name ? p.cloud.name : "iCloud";
    out.notes.push({ text: "其中 " + groupedNumber(p.dataless) + " 个文件还在 " + where + " 云端，下载到这台电脑之后才会被读取。", tone: "" });
  }
  if (p.truncated) {
    out.notes.push({ text: "文件太多：数到 " + groupedNumber(ADD_ENTRY_CAP) + " 个就停下了，实际还有更多。", tone: "warn" });
  }
  if (p.large) {
    out.notes.push({
      text: "要扫描的文件超过 " + groupedNumber(ADD_LARGE_THRESHOLD) + " 个，第一次扫描会花一些时间；加入之前会再问你一次。",
      tone: "warn",
    });
  }
  return out;
}

// 10.2: what adding writes, per kind (and, for an Research OS project that opens,
// per what opening it does: 9.4's moved / no index on this machine).
function addWritesText(insp) {
  if (!insp) return "";
  if (insp.kind === "new_folder") {
    return "加入会写入：这个文件夹里的 .researchos/（项目身份文件 project.toml、它的一份备份 .researchos/backups/，和一份简短的 README），以及 ~/.researchos 下的索引。文件夹里别的东西都不会被创建或改动。";
  }
  if (insp.kind === "pre_v5" && insp.moves_graph) {
    return "加入会把它写进项目列表；打开时，.researchos/ 里的旧图谱 graph.db 会移到 ~/.researchos 下（先复制并核对，再删除原文件），并在 .researchos/ 里留一份简短的 README 说明去向。迁移旧记录要等你在页面上方确认之后才会进行。";
  }
  if (insp.kind === "pre_v5") {
    return "加入只会把它写进项目列表。迁移旧记录要等你在页面上方确认之后才会进行。";
  }
  if (insp.kind === "researchos_project" && insp.can_add) {
    const sit = insp.situation && insp.situation.situation;
    if (sit === "moved") return "加入会把它写进项目列表，并记下项目的新位置（更新 ~/.researchos 下的索引和 .researchos/README）。";
    if (sit === "no_index") return "这台电脑上还没有它的索引：加入后会按文件夹里的文件和 .researchos/ 里的记录在 ~/.researchos 下重新建立。";
    return "加入只会把它写进项目列表。";
  }
  return "";
}

function scanProgressText(s) {
  const label = s && s.label ? s.label : "准备中";
  const n = s && Number.isFinite(s.n) ? s.n : 0;
  const m = s && Number.isFinite(s.m) ? s.m : 0;
  return "正在扫描：" + label + "（" + n + "/" + m + "）";
}

function scanDoneText(last) {
  if (!last) return "";
  if (!last.ok) return last.message || "扫描没有完成";
  const n = unreadableFiles(last.unreadable_sources).length;
  return n ? "扫描完成，有 " + n + " 个文件暂时读不了" : "扫描完成";
}

// 10.2 / 9.6: which files the scan could not read, by name -- what the
// scan chip's 「详情」 reveals. `unreadable_sources` entries are
// "<extractor>: <file>"; a file read by two extractors is named once.
// The files of `unreadable_sources` ("<extractor>: <file>"), each once: a
// draft three extractors could not read is one file (10.2, 11.1).
function unreadableFiles(sources) {
  const files = [];
  (Array.isArray(sources) ? sources : []).forEach((s) => {
    const text = String(s);
    const at = text.indexOf(": ");
    const file = at >= 0 ? text.slice(at + 2) : text;
    if (file && !files.includes(file)) files.push(file);
  });
  return files;
}

function unreadableFilesText(sources) {
  const files = unreadableFiles(sources);
  if (!files.length) return "";
  return "读不了的文件：" + files.join("、") + "。它们恢复可读后，下次扫描会读到。";
}
// 11.1: why some of them cannot be read -- only in a synced folder's cloud,
// its client not running -- one sentence per provider.
function cloudNotesText(notes) {
  const out = [];
  (Array.isArray(notes) ? notes : []).forEach((n) => {
    if (n && typeof n.message === "string" && n.message) out.push(n.message + "。");
  });
  return out.length ? " " + out.join(" ") : "";
}
// -- end of add-project wording

// -- The add dialog (DESIGN.md 10.2: choose, look, then write; task V6) ---------
// In the side panel. Choose: the native folder panel when the shell has one
// (purpose "add"), and always a path field with 「检查这个文件夹」, so the
// page works the same in a plain browser. Look: POST /api/projects/inspect,
// which writes nothing; each kind of answer is rendered in plain Chinese --
// the preview's counts, what adding writes, the editable display name, the
// 9.4 question for an Research OS project that must be answered first, the waiting
// sentence (asked again every 2 s), a refusal with 「重新选择」. Write: POST
// /api/projects/add with the inspection's token; a folder that changed
// since is looked at again and the page says why. Nothing is written --
// the registry included -- before the researcher presses the button that
// says what will be written.

const ADD_REASK_MS = 2000;
let addDialog = null; // {subject, path, inspection, labelEdited, label, confirmLarge, busy, timer}

function openAddDialog() {
  if (window.ROWorkspace && !ROWorkspace.mayLeave()) return;
  closeProjectMenu(false);
  if (addDialog && addDialog.timer !== null) clearTimeout(addDialog.timer);
  const subject = { kind: "add-project" };
  state.panelSubject = subject;
  addDialog = {
    subject: subject, path: "", inspection: null, labelEdited: false, label: "", confirmLarge: false, busy: false,
    timer: null, why: "", whyErr: null, // why the folder is being looked at again (a refused add), and its error
  };
  panelTitle.textContent = "添加项目";
  panelTitle.title = "";
  panelSubtitle.textContent = t("选择已有的项目文件夹");
  panelBody.innerHTML = "";
  const choose = mk("div", "add-choose");
  const row = mk("div", "locate-row");
  const input = mk("input", "form-input");
  input.id = "add-path";
  input.type = "text";
  input.placeholder = "文件夹的完整路径，例如 ~/Documents/我的研究";
  input.setAttribute("aria-label", "项目文件夹的路径");
  const check = mkButton("检查这个文件夹", "btn", () => inspectForAdd(subject, input.value.trim()));
  check.id = "add-check";
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check.click(); } });
  row.append(input, check);
  if (shellCan("choose-folder")) {
    const pick = mkButton("选择文件夹…", "btn", () => pickFolderForAdd(subject));
    pick.id = "add-pick";
    choose.appendChild(pick);
  }
  choose.appendChild(row);
  const status = mk("div", "notice-status");
  status.id = "add-status";
  const result = mk("div", "add-result");
  result.id = "add-result";
  panelBody.append(choose, status, result);
  openPanel();
  if (shellCan("choose-folder")) pickFolderForAdd(subject);
  else input.focus();
}

function addDialogLive(subject) {
  return !!addDialog && addDialog.subject === subject && state.panelSubject === subject && !panel.classList.contains("hidden");
}

async function pickFolderForAdd(subject) {
  const chosen = await chooseFolder("add");
  if (!chosen || !addDialogLive(subject)) return; // cancelled in the native panel
  const input = document.getElementById("add-path");
  if (input) input.value = chosen;
  inspectForAdd(subject, chosen);
}

function addStatus(cls, text, err) {
  const el = document.getElementById("add-status");
  if (el) setStatus(el, cls, text, err);
}

async function inspectForAdd(subject, path, why, whyErr) {
  if (!addDialogLive(subject)) return;
  if (addDialog.timer !== null) { clearTimeout(addDialog.timer); addDialog.timer = null; }
  if (!path) {
    addStatus("err", "请先填写文件夹的路径（以 / 或 ~ 开头），或选择一个文件夹");
    return;
  }
  if (path !== addDialog.path) { addDialog.labelEdited = false; addDialog.confirmLarge = false; }
  addDialog.path = path;
  addDialog.why = why || "";
  addDialog.whyErr = whyErr || null;
  const check = document.getElementById("add-check");
  if (check) check.disabled = true;
  if (!addDialog.inspection || addDialog.inspection.kind !== "waiting_permission") {
    const result = document.getElementById("add-result");
    if (result) { result.innerHTML = ""; result.appendChild(mk("div", "add-busy", "正在查看这个文件夹……")); }
  }
  addStatus("", "");
  let insp;
  try {
    insp = await apiPost("/api/projects/inspect", { path: path });
  } catch (err) {
    if (!addDialogLive(subject) || addDialog.path !== path) return;
    if (check) check.disabled = false;
    const result = document.getElementById("add-result");
    if (result) result.innerHTML = "";
    addStatus("err", "没能查看这个文件夹", err);
    return;
  }
  if (!addDialogLive(subject) || addDialog.path !== path) return; // closed, or another folder chosen meanwhile
  if (check) check.disabled = false;
  showInspection(subject, insp);
}

function showInspection(subject, insp) {
  const previous = addDialog.inspection;
  if (previous && previous.root !== insp.root) addDialog.labelEdited = false;
  addDialog.inspection = insp;
  if (!addDialog.labelEdited) addDialog.label = insp.label || insp.name || "";
  if (addDialog.why) addStatus("err", addDialog.why, addDialog.whyErr);
  renderInspection(subject);
  if (insp.kind === "waiting_permission") {
    // 10.2 "Waiting for the system": asked again until the listing returns.
    addDialog.timer = setTimeout(() => {
      addDialog.timer = null;
      inspectForAdd(subject, addDialog.path, addDialog.why, addDialog.whyErr);
    }, ADD_REASK_MS);
  }
}

function addLabelField() {
  const field = mk("div", "form-field");
  const label = mk("label", null, "显示名称");
  label.setAttribute("for", "add-label");
  const input = mk("input", "form-input");
  input.id = "add-label";
  input.type = "text";
  input.value = addDialog.label;
  input.addEventListener("input", () => { addDialog.label = input.value; addDialog.labelEdited = true; });
  const help = mk("div", "add-note", "只在 Research OS 的项目列表里显示；文件夹本身不会改名。");
  field.append(label, input, help);
  return field;
}

function addPreviewBlock(insp) {
  const box = mk("div");
  const t = addPreviewText(insp.preview);
  box.appendChild(mk("p", "add-note", t.head));
  const list = mk("ul", "add-counts");
  t.items.forEach(([words, n]) => {
    const li = mk("li");
    li.append(mk("span", null, words), mk("span", "n", n + " 个"));
    list.appendChild(li);
  });
  box.appendChild(list);
  t.notes.forEach((note) => box.appendChild(mk("p", "add-note" + (note.tone ? " " + note.tone : ""), note.text)));
  const gitError = insp.preview && insp.preview.git && insp.preview.git.error;
  if (gitError) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "git 的回答", gitError);
    box.appendChild(d);
  }
  return box;
}

function renderInspection(subject) {
  const result = document.getElementById("add-result");
  if (!result) return;
  const insp = addDialog.inspection;
  result.innerHTML = "";
  if (insp.root) result.appendChild(mk("div", "add-root", insp.root));
  const asks = insp.kind === "researchos_project" && !insp.can_add && !!insp.situation;
  // A 9.4 question says its own sentence, under its own title (below).
  if (!asks) result.appendChild(mk("div", "add-lead" + (insp.kind === "refused" ? " bad" : ""), insp.message || ""));
  const actions = mk("div", "add-actions");
  const again = () => mkButton("重新选择", "btn", () => chooseAgain(subject));
  const cancel = () => mkButton("取消", "btn", closePanel);

  if (insp.kind === "waiting_permission") {
    result.appendChild(mk("p", "add-note", "Research OS 每隔两秒会再问一次，页面不会卡住；也可以换一个文件夹。"));
    actions.append(again(), cancel());
    result.appendChild(actions);
    return;
  }
  if (insp.kind === "refused") {
    if (insp.refusal && insp.refusal.detail) {
      const d = mk("div", "notice-status");
      renderBlockingError(d, "", insp.refusal.detail);
      d.firstChild.remove(); // only the 「详情」 toggle: the sentence is the lead above
      result.appendChild(d);
    }
    actions.append(again());
    result.appendChild(actions);
    return;
  }
  if (insp.kind === "already_registered") {
    const entry = insp.entry || {};
    if (entry.label) result.appendChild(mk("p", "add-note", "在列表里的名字：" + entry.label));
    const isOpen = !state.noProject && ((state.currentId && entry.id) ? entry.id === state.currentId : entry.path === state.currentPath);
    if (isOpen) {
      result.appendChild(mk("p", "add-note", "它就是现在打开的项目。"));
      actions.append(mkButton("好", "btn", closePanel));
    } else {
      const go = mkButton("切换过去", "btn", async () => {
        go.disabled = true;
        closePanel();
        await switchToProject({ path: entry.path, id: entry.id });
      });
      actions.append(go, cancel());
    }
    result.appendChild(actions);
    return;
  }
  if (asks) {
    // 9.4's question, here: nothing -- the registry included -- is written
    // until one answer is chosen (the answer adds, then resolves).
    result.appendChild(addLabelField());
    result.appendChild(renderSituation({ situation: insp.situation, message: "" }, {
      inDialog: true,
      answer: (answer, statusEl, buttons) => answerForAdd(subject, answer, statusEl, buttons),
      recheck: () => inspectForAdd(subject, addDialog.path),
    }));
    actions.append(again(), cancel());
    result.appendChild(actions);
    return;
  }
  if (insp.kind === "new_folder") result.appendChild(addPreviewBlock(insp));
  result.appendChild(addLabelField());
  const writes = addWritesText(insp);
  if (writes) result.appendChild(mk("p", "add-writes", writes));
  const verb = insp.kind === "new_folder" ? "加入并扫描" : "加入列表并打开";
  const go = mkButton(verb, "btn", () => {
    if (insp.kind === "new_folder" && insp.preview && insp.preview.large && !addDialog.confirmLarge) {
      showLargeConfirm(subject, result, actions);
      return;
    }
    writeAdd(subject, [go]);
  });
  go.id = "add-go";
  go.disabled = !insp.can_add;
  actions.append(go, cancel());
  result.appendChild(actions);
}

// 10.2: above 5,000 files to scan, the preview asks a second time.
function showLargeConfirm(subject, result, actions) {
  const insp = addDialog.inspection;
  const box = mk("div", "add-confirm");
  box.appendChild(mk("p", "add-note", "要扫描的文件有 " + groupedNumber(insp.preview.to_scan) + " 个，超过 " +
    groupedNumber(ADD_LARGE_THRESHOLD) + " 个。第一次扫描会花一些时间，扫描期间页面照常可用。确定要加入并扫描吗？"));
  const row = mk("div", "add-actions");
  const yes = mkButton("确定，加入并扫描", "btn", () => { addDialog.confirmLarge = true; writeAdd(subject, [yes, no]); });
  const no = mkButton("先不加入", "btn", () => { box.remove(); actions.classList.remove("hidden"); });
  row.append(yes, no);
  box.appendChild(row);
  actions.classList.add("hidden");
  result.appendChild(box);
  yes.focus();
}

function chooseAgain(subject) {
  if (addDialog.timer !== null) { clearTimeout(addDialog.timer); addDialog.timer = null; }
  addDialog.inspection = null;
  addDialog.path = "";
  addDialog.why = "";
  addDialog.whyErr = null;
  const result = document.getElementById("add-result");
  if (result) result.innerHTML = "";
  addStatus("", "");
  const input = document.getElementById("add-path");
  if (shellCan("choose-folder")) pickFolderForAdd(subject);
  else if (input) { input.focus(); input.select(); }
}

function addBody() {
  return { path: addDialog.path, label: addDialog.label, inspected: addDialog.inspection.inspected };
}

// A refused add: a changed folder (or one now waiting, or now refused) is
// shown as it is now, with the reason above it; anything else (a display
// name the registry will not take) is said in the dialog's status line.
function addRefused(subject, err, buttons) {
  buttons.forEach((b) => { b.disabled = false; });
  if (err.inspection && addDialogLive(subject)) {
    addDialog.why = blockingErrorText("没能加入这个文件夹", err);
    addDialog.whyErr = err;
    addDialog.confirmLarge = false;
    showInspection(subject, err.inspection);
    return;
  }
  addStatus("err", "没能加入这个文件夹", err);
}

async function writeAdd(subject, buttons) {
  if (!addDialogLive(subject) || addDialog.busy) return;
  buttons.forEach((b) => { b.disabled = true; });
  addDialog.busy = true;
  addStatus("", "正在加入…");
  let res;
  try {
    res = await apiPost("/api/projects/add", addBody());
  } catch (err) {
    addDialog.busy = false;
    addRefused(subject, err, buttons);
    return;
  }
  addDialog.busy = false;
  await addDone(res);
}

async function addDone(res) {
  if (res.kind === "already_registered") {
    // Nothing was written and nothing switched: offer the switch.
    if (addDialog && res.inspection) { addDialog.why = ""; addDialog.whyErr = null; showInspection(addDialog.subject, res.inspection); }
    return;
  }
  closePanel();
  state.sessionNotes = [];
  await reloadAllViews({ scanStarted: !!res.scanning });
  if (res.scan_error) {
    const err = new Error(res.scan_error.error || "");
    err.state = res.scan_error.state;
    showHeaderError("已加入项目，但没能开始扫描；可以在项目菜单里「重新扫描这个项目」", err);
  }
  refreshScanStatus();
}

// An answer to the 9.4 question from inside the dialog: the add (which
// serves the folder with its question open, writing nothing), then the
// answer itself -- which, for a folder added from here, registers it under
// the display name chosen above.
async function answerForAdd(subject, answer, statusEl, buttons) {
  if (ANSWER_CONFIRM[answer] && !window.confirm(ANSWER_CONFIRM[answer])) return;
  if (!addDialogLive(subject) || addDialog.busy) return;
  buttons.forEach((b) => { b.disabled = true; });
  addDialog.busy = true;
  setStatus(statusEl, "", "正在处理…");
  let added;
  try {
    added = await apiPost("/api/projects/add", addBody());
  } catch (err) {
    addDialog.busy = false;
    addRefused(subject, err, buttons);
    return;
  }
  if (!added.blocked) { // the question no longer stood: added and opened as it is
    addDialog.busy = false;
    await addDone(added);
    return;
  }
  let res;
  try {
    res = await apiPost("/api/project/resolve", { answer: answer });
  } catch (err) {
    addDialog.busy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个选择", err);
    return;
  }
  addDialog.busy = false;
  closePanel();
  const note = resolveNote(answer, res);
  state.sessionNotes = note ? [note] : [];
  await reloadAllViews();
}

// -- 停止服务 (task V3 phase 4) ----------------------------------------------
// The footer button POSTs /api/shutdown behind an explicit confirm.
// Success replaces the whole page with a plain stopped state and stops the
// generation poll -- the server is gone, and polling it would only spray
// connection errors into the console. Failure re-enables the button and
// says so in the header line (same spot a failed project switch reports),
// leaving the page fully usable.

// The stopped page in the screen's language (13.7); the command stays as
// typed, set in <code> where the sentence names {command}.
function renderStoppedState() {
  generationLive = false;
  stopGenerationPoll();
  if (window.ROWorkspace && typeof ROWorkspace.stop === "function") ROWorkspace.stop(); // 项目首页's run poll too
  closePanel();
  const command = escapeHtml(t("下次要查看时，双击 Research OS.app，或在终端运行 {command}。"))
    .replace("{command}", "<code>researchos serve</code>");
  document.getElementById("app").innerHTML =
    '<main id="main"><div class="stopped-note">' +
    "<h2>" + escapeHtml(t("服务已停止")) + "</h2>" +
    "<p>" + escapeHtml(t("本地服务已经关闭，可以关闭此页。")) + "</p>" +
    "<p>" + command + "</p>" +
    "</div></main>";
}

// What stopping the service does to the agents that are still working (DESIGN.md 21.7). The engine carries the runs out in
// its own threads and `AgentManager.shutdown` ends them with the service: the program and everything it started are ended, the
// run is recorded 已中断, and what it had changed stays changed. So the question names each run -- the task, the agent and its
// model -- and says that, before it is asked. `runs` is what GET /api/agents/going answered (every project's runs), or null when
// it could not be read: then the question does not claim there are none.
async function goingRuns() {
  try {
    const answer = await apiGet("/api/agents/going");
    return Array.isArray(answer && answer.runs) ? answer.runs : null;
  } catch (err) {
    return null;
  }
}

function goingRunLine(run) {
  const first = String(run.task || "").split("\n")[0].trim();
  const vars = {
    task: first.length > 60 ? first.slice(0, 60) + "…" : first,
    agent: run.label || [run.runner, run.model].filter(Boolean).join(" · "),
    project: run.project || "",
  };
  return run.here || !vars.project ? t("「{task}」（{agent}）", vars) : t("「{task}」（{agent}，项目 {project}）", vars);
}

function stopServiceQuestion(runs) {
  const ask = t("确定要停止本地服务吗？停止后这个页面将无法继续使用。");
  if (runs === null) return t("没能查看是否还有 AI 执行者在运行。") + "\n\n" + ask;
  if (!runs.length) return ask;
  // one run is "it", several are "they" (21.7): the sentence is chosen by the count, in both languages
  const effect = runs.length === 1
    ? t("停止服务会结束它的程序，以及程序启动的所有进程。这次运行会记为「已中断」。它已经改动的文件不会自动撤回；下次打开 Research OS 后，如果这次运行能撤回，任务那一行里有「撤回本次运行」。")
    : t("停止服务会结束它们的程序，以及程序启动的所有进程。这些运行会记为「已中断」。它们已经改动的文件不会自动撤回；下次打开 Research OS 后，能撤回的运行在任务那一行里有「撤回本次运行」。");
  return [
    t("还有 {n} 个 AI 执行者正在运行：", { n: runs.length }),
    runs.map(goingRunLine).join("\n"),
    effect,
    ask,
  ].join("\n\n");
}

document.getElementById("shutdown-btn").addEventListener("click", async () => {
  if (window.ROWorkspace && !ROWorkspace.mayLeave()) return;
  const btn = document.getElementById("shutdown-btn");
  btn.disabled = true;   // while the engine is asked who is still working
  const runs = await goingRuns();
  btn.disabled = false;
  if (!window.confirm(stopServiceQuestion(runs))) return;
  btn.disabled = true;
  try {
    await apiPost("/api/shutdown", {});
  } catch (err) {
    btn.disabled = false;
    showHeaderError("停止服务失败", err);
    return;
  }
  renderStoppedState();
});

// -- The language switch (DESIGN.md 13.2, 13.3) ------------------------------
// Named in the language it switches to (i18n.js names it on an English
// screen). One click saves the choice on this Mac, tells the shell -- which
// re-reads settings.json itself -- and reloads on the same section (the
// remembered view). A refusal leaves everything as it was and says so: in
// the header line, or where the caller (the 设置 page's own choice, 21.7) says.
// A reload drops what is not written, so it asks first (14.3); declined, it
// tells the caller (`onDeclined`), so that a choice the caller shows can go back.

// The two kinds of unsaved work a reload loses: the workspace's drafts, and the
// words half-typed in the open panel -- the 设置 page's own fields among them.
// One question when the workspace has already asked.
function mayReloadPage() {
  const workspace = window.ROWorkspace;
  if (workspace && !workspace.mayLeave()) return false;
  if (workspace && workspace.isDirty && workspace.isDirty()) return true; // that question was asked, and agreed
  return !(window.RODesk && RODesk.mayLeavePanel) || RODesk.mayLeavePanel();
}

async function switchInterfaceLanguage(language, controls, onError, onDeclined) {
  if (!mayReloadPage()) {
    if (onDeclined) onDeclined();
    return;
  }
  controls.forEach((control) => { control.disabled = true; });
  try {
    await apiPost("/api/settings/language", { language: language });
  } catch (err) {
    controls.forEach((control) => { control.disabled = false; });
    (onError || ((e) => showHeaderError(t("没能切换界面语言"), e)))(err);
    return;
  }
  postShellLanguage();
  window.location.reload();
}

document.getElementById("lang-btn").addEventListener("click", () =>
  switchInterfaceLanguage(uiLang() === "en" ? "zh" : "en", [document.getElementById("lang-btn")]));

// -- Native shell bridge (DESIGN.md section 8.9, task V4 phase 3) ----------
// Research OS.app is a native window around this same page. Its menus reach the
// page through ONE entry point, window.RCE.command(name), which the shell
// calls as the fixed string `window.RCE && RCE.command('<name>')` with a
// name from its own compiled-in whitelist; this table is the page's side
// of that whitelist. Anything not in it returns false and does nothing.
// In a plain browser nobody calls it and nothing is lost: every command
// here is something the page can already do from its own controls.
//
// The two Finder commands go through the existing POST /api/open, never a
// new endpoint: the project root is the path "." (which the server's
// resolve-then-relative_to check maps to the served root itself), and the
// map file is the one the server's own /api/summary echoes from
// .researchos/attempts.toml -- fetched fresh at command time so a project switch
// can never open the previous project's map. The server confines both
// exactly as it confines every other /api/open path.
//
// The page reports the current project's label to the shell (window
// title 「Research OS — <label>」) over webkit.messageHandlers.rce -- the only
// message shape the shell accepts -- after every loadProjects(), i.e. on
// load and on every project switch. Absent bridge: a silent no-op.

const TEXT_ZOOM_STEPS = [0.8, 0.9, 1, 1.1, 1.25, 1.5];
let textZoomIndex = TEXT_ZOOM_STEPS.indexOf(1);

// 放大/缩小/实际大小: the canvas and the desk's route map (DESIGN.md 14.1)
// zoom their own cameras; the reading views scale their own sections
// (never the canvas or the desk, whose pointer geometry must stay in
// unscaled CSS pixels).
function shellZoom(step) {
  if (currentView === "canvas") {
    if (step > 0) RCECanvas.zoomIn();
    else if (step < 0) RCECanvas.zoomOut();
    else RCECanvas.zoomReset();
    return;
  }
  if (currentView === "desk" && RODesk.mapZoom(step)) return;
  textZoomIndex = step === 0 ? TEXT_ZOOM_STEPS.indexOf(1)
    : Math.max(0, Math.min(TEXT_ZOOM_STEPS.length - 1, textZoomIndex + step));
  const z = TEXT_ZOOM_STEPS[textZoomIndex];
  Object.entries(views).forEach(([key, node]) => {
    if (key !== "canvas" && key !== "desk") node.style.zoom = z === 1 ? "" : String(z);
  });
  RODesk.listZoom(z === 1 ? "" : String(z)); // 研究路线 as a list (18.3) reads like the others
}

// A failed Finder command reports in the header line, the same spot a
// failed project switch uses; the engine's own text sits behind 「详情」.
function shellReport(message, err) {
  showHeaderError(message, err);
}

async function shellOpen(path, reveal, failure) {
  try {
    await apiPost("/api/open", { path: path, reveal: reveal });
  } catch (err) {
    shellReport(failure, err);
  }
}

async function shellOpenMap() {
  let config = null;
  try {
    config = (await apiGet("/api/summary")).attempts_config;
  } catch (err) {
    shellReport("无法打开项目地图", err);
    return;
  }
  if (!config || !config.file) {
    shellReport("这个项目还没有配置项目地图（.researchos/attempts.toml）", null);
    return;
  }
  await shellOpen(config.file, false, "无法打开项目地图");
}

// 文件 > 提交提议… / 发布 (V8 U5): the menu only takes the researcher to
// the place that says what would be written -- the 提交提议 form in 提议,
// the 公盘 block in 成员 -- scrolls it into view and puts the cursor in its
// first field. Nothing is written from a menu. The view loads on its own
// schedule, so the anchor is looked for a few times before giving up (the
// view then simply stays open at its top).
function revealShellAnchor(view, anchor) {
  activateView(view);
  let tries = 0;
  const look = () => {
    const host = views[view];
    const el = host && !host.classList.contains("hidden") ? host.querySelector('[data-anchor="' + anchor + '"]') : null;
    if (!el) {
      if (++tries < 40 && currentView === view) setTimeout(look, 75);
      return;
    }
    el.scrollIntoView({ block: "start" });
    const field = el.querySelector("textarea, input:not([type=radio]), button.btn-primary");
    if (field) field.focus({ preventScroll: true });
  };
  look();
}

ROWorkspace.onProjectCreated = async (result) => {
  ROWorkspace.reset();
  closePanel();
  state.sessionNotes = [];
  await reloadAllViews({ scanStarted: !!result.scanning });
  if (currentView === "workspace") await ROWorkspace.load(views.workspace);
  else activateView("workspace");
};

ROWorkspace.onPropose = (paths) => {
  if (!mayReplacePanel()) return;
  state.panelSubject = { kind: "workspace-proposal" };
  panelTitle.textContent = t("提交修改");
  panelSubtitle.textContent = t("PI 批准后进入正式版本");
  panelBody.replaceChildren();
  const reason = mk("textarea", "form-textarea");
  reason.placeholder = t("说明这次修改");
  reason.setAttribute("aria-label", t("说明这次修改"));
  reason.dataset.initial = "";
  const status = mk("div", "notice-status");
  const preview = mk("div");
  const compare = mkButton(t("查看修改"), "btn", async () => {
    if (!reason.value.trim()) { setStatus(status, "err", t("请先写一句修改说明")); return; }
    compare.disabled = true;
    try { await ROTeam.composeInto(preview, { kind: "files", sentence: reason.value.trim(), only: paths }, status); }
    finally { compare.disabled = false; }
  });
  panelBody.append(reason, compare, status, preview);
  openPanel();
  reason.focus();
};

const SHELL_COMMANDS = {
  "workspace": () => activateView("workspace"),
  "create-project": () => ROWorkspace.openCreateProject(),
  // 视图 ⌘1-8 (12.9): one command per sidebar section. 研究路线 is one page
  // (18.3), and its one menu item sends either name: both open it the way it
  // is kept for the project (a menu built before 18.3 sent "desk" for the map
  // and "routes" for the list, as two items; the page cannot tell them apart now).
  "desk": () => showRoutes(),
  "routes": () => showRoutes(),
  "results": () => activateView("results"),
  "variables": () => activateView("variables"),
  "literature": () => activateView("literature"),
  // 数据与代码 reopens on the list or 关系图, as the sidebar does.
  "data": () => activateView(lastDataView),
  "proposals": () => activateView("proposals"),
  "members": () => activateView("members"),
  // 文件 > 「添加项目… ⌘O」 (DESIGN.md 10.1, 10.7).
  "add-project": () => openAddDialog(),
  "propose": () => revealShellAnchor("proposals", "compose"),
  "publish": () => revealShellAnchor("members", "publish"),
  "reload": () => { if (!window.ROWorkspace || ROWorkspace.mayLeave()) window.location.reload(); },
  "zoom-in": () => shellZoom(1),
  "zoom-out": () => shellZoom(-1),
  "zoom-reset": () => shellZoom(0),
  "open-map": () => shellOpenMap(),
};

// What a Research OS.app built before V8 U5 still sends (its 视图 决策树 /
// 血缘 / 画布 / 适应全部 and 文件 新增尝试 / 在 Finder 中显示项目), until
// `researchos app` rebuilds it (the build-id changed with the shell
// source). Understood, never offered: no menu of the current shell names
// these.
const SHELL_COMMANDS_BEFORE_U5 = {
  "tree": () => showRoutes("list"), // the decision tree was 研究路线's list
  "lineage": () => activateView("lineage"),
  "canvas": () => activateView("canvas"),
  "new-attempt": () => { if (mayReplacePanel()) openAttemptForm("append"); },
  // 适应全部 is a canvas notion; from another view it brings the canvas up
  // first rather than silently doing nothing -- and when that starts the
  // canvas's first load, fits once the cards are there (fitting the empty
  // canvas was lost: entering the view then restored its saved viewport).
  "fit": () => {
    const loading = activateView("canvas");
    if (loading) loading.then(() => { if (currentView === "canvas" && views.canvas.dataset.loaded) RCECanvas.fitAll(); });
    else RCECanvas.fitAll();
  },
  "reveal-project": () => shellOpen(".", true, "无法在 Finder 中显示项目"),
};

window.RCE = Object.freeze({
  // The native shell's answer to {type: "choose-folder"} (see chooseFolder).
  folderChosen(request, path) {
    return folderChosen(request, path);
  },
  command(name) {
    if (typeof name !== "string") return false;
    const table = Object.prototype.hasOwnProperty.call(SHELL_COMMANDS, name) ? SHELL_COMMANDS
      : Object.prototype.hasOwnProperty.call(SHELL_COMMANDS_BEFORE_U5, name) ? SHELL_COMMANDS_BEFORE_U5 : null;
    if (!table) return false;
    // After 停止服务 the page is a static note; a menu click must not throw.
    if (!document.getElementById("view-desk")) return false;
    try {
      table[name]();
    } catch (err) {
      return false;
    }
    return true;
  },
});

// The open project's role for the shell's 文件 menu (V8 U5): exactly one
// of single / pi / member / none -- the only values the shell takes.
let lastShellMode = null;
function postShellMode(mode) {
  const m = ["single", "pi", "member", "none"].indexOf(mode) >= 0 ? mode : "single";
  if (m === lastShellMode) return;
  try {
    const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce;
    if (bridge) { bridge.postMessage({ type: "mode", mode: m }); lastShellMode = m; }
  } catch (err) {
    /* no shell: the page works the same */
  }
}

function postShellTitle() {
  try {
    const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce;
    if (bridge) bridge.postMessage({ type: "title", text: String(state.projectLabel || "") });
  } catch (err) {
    /* no shell, or the shell went away: the page works the same */
  }
}

// 13.3: the language changed -- the shell re-reads settings.json (it never
// trusts a message's content) and rebuilds its menus. A shell built before
// V9 ignores a shape it does not know.
function postShellLanguage() {
  try {
    const bridge = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.rce;
    if (bridge) bridge.postMessage({ type: "language" });
  } catch (err) {
    /* no shell: the page works the same */
  }
}

// -- Init -------------------------------------------------------------------
// loadProjects() first (awaited): it fills state.projectLabel, which the
// summary line prefers over a raw-path basename. The views themselves never
// wait on either -- activateView kicks off its own fetch. The generation
// poll (task V3 phase 2) starts alongside: syncGeneration() records the
// server's current generation as this page's starting point (so the first
// interval tick compares against reality, not null), then the interval
// keeps watching for the server-side watcher's bumps.

(async () => {
  await loadProjects();
  loadProjectSummary();
  RODesk.refreshSidebar();
  activateView(storedView() || "workspace");
  syncGeneration();
  generationLive = true;
  startGenerationPoll();
})();
</script>
