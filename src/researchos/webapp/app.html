<!doctype html>
<!--
  Research OS decision-tree / lineage viewer (task V2).

  Single self-contained file: inline CSS, inline JS, zero external
  resources, zero build step. Served verbatim by researchos.webapp.server at "/"
  and read entirely client-side against this same process's JSON API
  (/api/summary, /api/attempts, /api/tree, /api/lineage, /api/file,
  /api/open, /api/projects, /api/projects/switch, /api/projects/remove,
  /api/projects/inspect, /api/projects/add, /api/projects/rescan,
  /api/projects/rename, /api/generation,
  /api/attempts/preview, /api/attempts/write, /api/shutdown -- see
  researchos/webapp/server.py's module docstring for the contract each endpoint
  promises).

  The page's structure (DESIGN.md 12.9, task V8 phase U2): a sidebar --
  the project switcher at the top (the 10.1 menu below), the open
  project's sections 项目首页 / 研究路线 / 图表与论断 / 变量 / 文献 / 数据与代码 /
  提议 / 成员, and at the bottom the shared drive's line, who I am, 记录 and
  停止服务 -- beside a workspace whose serif title names the section. 研究路线
  (18.3: the route map of Section 14 or the grouped list, with 等你处理 beside
  either) and the sidebar's live lines are the third served
  file, /desk.js (window.RODesk; GET /api/desk, /api/proposals, /api/share,
  /api/me). The node page, 图表与论断 and 数据与代码's list are the fourth,
  /node.js (window.RONode, U3; GET /api/node, /api/results,
  /api/data-code): every object -- a script, data file, figure, draft
  section or claim, attempt, variable, reference -- opens the same node
  page (its trace, its changes and notes, its judgments, 关系图 behind a
  control). 研究路线, 提议 and 成员 are the fifth, /team.js (window.ROTeam,
  U4; GET /api/routes, /api/evidence, /api/proposals, /api/share, /api/me/key):
  the routes grouped by status with proposals shown apart, the PI's inbox
  and a proposal's page (批准并加入 / 退回并说明 / 讨论), a member's 我的提议
  and 提交提议, and 成员 -- the team, who I am, the shared folder, adding a
  member, joining and syncing, each saying what it will write first. 12.11
  applies to everything on screen: no emoji (a verdict is its status word
  from `verdict_status`, then the researcher's words), no arrow characters
  (relations in words), disclosure by the platform's own <details>, icons
  only as monochrome line drawings written here.

  Auto-refresh (task V3 phase 2): the server's own watcher re-ingests the
  attempts map / step scripts when they change on disk and bumps a
  generation counter; this page polls GET /api/generation every 2s and,
  when the number moved, re-fetches the current view's data while
  PRESERVING UI state -- which attempts/scripts are expanded, which view
  is active, and (for an attempt whose record still exists) the open
  panel. A small chip in the header says, in product language, when a
  rescan is in flight or when the last one failed (the raw error lives on
  the chip's hover title, technical detail folded away).

  Multi-project switching (task V3 phase 1, reshaped by DESIGN.md 10.1 in
  task V6): the project line starts with one button, 「项目：<名称> ▾」,
  shown always (hover for the full path). Its menu lists the registered
  projects (the open one marked, one whose folder cannot be found greyed
  「找不到文件夹」 with 「选择新位置…」), then 「添加项目…」, 「重新扫描这个项目」,
  「重命名显示名称…」 and 「从列表中移除…」. Switching POSTs
  /api/projects/switch (the server accepts only exact registry members;
  this page only ever offers values it got from /api/projects), then
  re-fetches every view from scratch, since everything on screen belongs
  to the previous project.

  Adding a project (DESIGN.md Section 10, task V6): 「添加项目…」 (also the
  native 文件 → 添加项目… ⌘O, and the no-project page's button) opens the add
  dialog in the side panel: choose a folder (the shell's folder panel, or a
  path field), let the engine look at it (POST /api/projects/inspect --
  writes nothing), then write (POST /api/projects/add with the
  inspection's token). A new folder's first full scan, and a rescan from
  the menu, show their progress in the header from GET /api/generation's
  `scanning`. With an empty registry the engine serves no project, and
  every tab shows only the welcome (10.1).

  Writing from the UI (task V3 phase 3): the "＋ 新增尝试" header button and
  the attempt panel's "编辑" button open a form in the same slide-out
  panel, built from the project's OWN column names (the attempts_config
  echo in /api/summary -- nothing hardcoded). Submitting first POSTs
  /api/attempts/preview (a pure dry run: old row / new row, nothing
  written) and shows the change with an explicit Chinese confirm; only the
  confirm click POSTs /api/attempts/write, which edits the researcher's
  own map file (backed up first, written atomically, re-ingested
  server-side) -- the graph then follows the file, per DESIGN.md's
  "resync from source": this page never writes the graph, only the one
  source of truth. On success the form closes and the phase-2 auto-refresh
  renders the new state; update mode submits ONLY the fields the user
  actually changed, so untouched cells keep their raw markdown decoration
  byte-for-byte (prefills come from parsed/cleaned values and must not be
  round-tripped over cells nobody edited).

  Degraded projects (DESIGN.md section 8.10 rules 2 and 3): when a view's
  fetch fails with a known project state -- the server sends `state`
  alongside `error` for exactly two conditions -- the page shows a header
  state in product language instead of an English error box: 「项目不可用 —
  图谱文件已不存在」 for a graph that vanished mid-serve, 「图谱文件正在从云端
  下载…」 for one macOS has evicted to iCloud. The raw engine message stays
  on the hover title. Crucially the project menu stays usable in both,
  since switching away is the one action that can actually fix it. A
  registry entry whose folder is gone is marked 「找不到文件夹」, and
  「从列表中移除…」 drops any entry from ~/.researchos/projects.json (POST
  /api/projects/remove) -- a bookmark removal, nothing on disk.

  Two interface languages (DESIGN.md Section 13, task V9): /i18n.js, loaded
  first, defines window.ROI18N (the language and the English table); the
  page's words go through t() (the Chinese is the key), apiGet/apiPost name
  the language on every request (X-ResearchOS-Lang), and the quiet switch
  beside 停止服务 (「English」 / 「中文」) saves the choice
  (POST /api/settings/language), tells the shell and reloads. The 设置 page (DESIGN.md
  21.7), opened from the same foot, holds the one form of each setting of this Mac --
  AI 执行者, 本地模型, 联网查询, 界面语言 -- and the places that used to hold one link
  to it (「在设置里修改」).

  Stopping the server (task V3 phase 4): a quiet 停止服务 text button in
  the page footer, behind an explicit window.confirm that names the agent runs
  still going (21.7). Confirming
  POSTs /api/shutdown; on success the whole page is replaced by a plain
  "服务已停止" state (the generation poll stops too -- the server is gone,
  so continuing to poll would only spray connection errors). A failure
  leaves the page fully usable and says so in the header line.

  The views, shown through the sidebar's sections (12.9; before V8 the
  top tab bar 「决策树」「血缘」「画布」). The last one used is remembered in
  localStorage under its old key -- a per-viewer convenience, unlike the
  canvas scope, which 8.7 says defaults to the current attempt -- wrapped
  so blocked storage just starts on the desk:
    - 决策树 (default): GET /api/tree. attempt -> step script ->
      read/write data files, all three layers already computed
      server-side from graph edges; this page only renders them.
    - 数据与代码: GET /api/data-code (node.js), every script and data file
      with the lineage report's blocks as filters.
    - 画布 (task V4 phases 2a-2b): GET /api/canvas, drawn and edited by the second served
      file, /canvas.js (window.RCECanvas; see its own top comment). This
      page owns only the tab, the full-window "canvas-mode" layout, the
      canvas CSS (kept here with every other style, on the same tokens),
      and the hooks: generation refresh and project switch call
      RCECanvas.load / RCECanvas.reset. The one external <script src> is
      same-origin and served by this same process -- still zero external
      resources.

  Native shell (DESIGN.md 8.9, task V4 phase 3): Research OS.app shows this same
  page in a WKWebView. Its menus call window.RCE.command(name) -- one
  dispatcher over a fixed command table, see "Native shell bridge" in the
  script -- and the page posts {type: "title", text} to
  webkit.messageHandlers.rce after every project load. Without the shell
  both are inert; the page behaves exactly as in any browser.

  Section 8.10 rule 2's one-message rule: while a project state chip is
  showing, the refresh-failure chip is suppressed (hideRefreshChip).

  Clicking any file, attempt, variable or reference anywhere opens its
  node page (node.js); the node page's 查看内容 opens the right-hand
  slide-out panel (GET /api/file for a preview, POST /api/open to reveal
  in Finder or open with the default app).

  Every fetch is wrapped (apiGet/apiPost below) so a failure renders a
  readable message inside the page -- never only to the console.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research OS</title>
<link rel="stylesheet" href="/workspace.css">
<style>
:root {
  --paper: #F7F2E9;
  --paper-alt: #F0E9DA;
  --ink: #26221B;
  --ink-soft: #5B564A;
  --line: rgba(38, 34, 27, 0.14);
  --line-strong: rgba(38, 34, 27, 0.32);
  --clay: #A64B2A;
  --clay-soft: #F1DCD0;
  --ochre: #9A6E1F;
  --ochre-soft: #F0E3C4;
  --olive: #6C7042;
  --olive-soft: #E4E6D4;
  --gray: #736F63;
  --gray-soft: #E7E4DB;
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
  --font-sans: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }

/* DESIGN.md 12.9 / 12.11: a sidebar and a workspace. The sidebar is the
   paper's own alt tone, separated by one rule; typography carries the
   hierarchy (the serif for the brand and the page title, the sans for the
   rest), icons are monochrome line drawings, never colored. */
#app { min-height: 100vh; display: flex; }
.sidebar {
  flex: none; width: 236px; position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; background: var(--paper-alt); border-right: 1px solid var(--line-strong);
  padding: 1.25rem 0 0.9rem;
}
.side-brand { display: flex; flex-direction: column; gap: 0.1rem; padding: 0 1.25rem 1rem; }
.brand-mark { font-family: var(--font-serif); font-size: 1.3rem; letter-spacing: 0.04em; }
.brand-sub { font-size: 0.75rem; color: var(--ink-soft); }
.side-project { padding: 0.6rem 1.25rem 0.9rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.side-eyebrow { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 0.15rem; }
.side-nav { display: flex; flex-direction: column; padding: 0.7rem 0.6rem; gap: 0.05rem; }
.side-item {
  display: flex; align-items: center; gap: 0.6rem; width: 100%; text-align: left; font: inherit; font-size: 0.9rem;
  color: var(--ink-soft); background: none; border: none; border-left: 2px solid transparent; padding: 0.38rem 0.65rem;
  cursor: pointer;
}
.side-item:hover { color: var(--ink); background: var(--paper); }
.side-item:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.side-item[aria-current="page"] { color: var(--ink); font-weight: 600; border-left-color: var(--ink); background: var(--paper); }
.side-icon { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.side-label { flex: 1; }
.side-count { font-size: 0.75rem; color: var(--ink-soft); font-weight: normal; }
.side-foot { margin-top: auto; padding: 0.8rem 1.25rem 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.78rem; }
.share-line { color: var(--ink-soft); }
.me-line { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: baseline; }
.me-name { color: var(--ink); }
.me-role, .me-unset { color: var(--ink-soft); }
.side-tools { display: flex; flex-wrap: wrap; gap: 0.1rem 1rem; margin-top: 0.2rem; }
body.no-project .side-nav, body.no-project .share-line { display: none !important; }
/* 18.3: a project of one person has no 提议 and no 成员 in the sidebar (desk.js sets data-team). */
.side-nav[data-team="single"] .side-item[data-section="proposals"],
.side-nav[data-team="single"] .side-item[data-section="members"] { display: none; }

.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: 1.3rem 2rem 0.9rem;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.page-title { font-family: var(--font-serif); font-weight: normal; font-size: 1.45rem; margin: 0; letter-spacing: 0.02em; }
.topbar .new-attempt-btn { margin-left: auto; }

/* 「项目：<名称> ▾」 (DESIGN.md 10.1): the project line's one button and its
   small menu -- the registered projects, then 添加 / 重新扫描 / 重命名 /
   移除. Quiet like the line it sits in; the menu is paper on a strong rule. */
.project-menu-wrap { position: relative; display: inline-block; font-family: var(--font-sans); }
.project-menu-wrap { display: block; }
.project-menu-btn {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--ink); background: none; text-align: left;
  border: 1px solid transparent; padding: 0.15rem 0.4rem; margin-left: -0.4rem; cursor: pointer;
  width: calc(100% + 0.8rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: baseline;
}
.project-menu-btn:hover, .project-menu-btn[aria-expanded="true"] { border-color: var(--line-strong); background: var(--paper-alt); }
.project-menu-btn:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.project-menu {
  position: absolute; top: calc(100% + 0.25rem); left: -0.4rem; z-index: 45; min-width: 17rem; max-width: min(26rem, 92vw);
  background: var(--paper); border: 1px solid var(--line-strong); box-shadow: 0 6px 18px rgba(38, 34, 27, 0.12);
  padding: 0.3rem 0; font-size: 0.84rem; color: var(--ink);
}
/* In the sidebar the menu keeps to the sidebar's width (it scrolls
   vertically, so anything wider is clipped): a long project name is cut
   short with an ellipsis, its full path on hover (12.11 sweep, 900x600). */
/* Where 文件 > 提交提议… / 发布 lands (revealShellAnchor): a little air above. */
[data-anchor] { scroll-margin-top: 1.2rem; }
.side-project .project-menu { left: -0.65rem; right: -0.65rem; min-width: 0; max-width: none; }
.pm-item {
  display: flex; align-items: baseline; gap: 0.5rem; width: 100%; text-align: left; font: inherit; color: inherit;
  background: none; border: none; padding: 0.32rem 0.9rem 0.32rem 0.7rem; cursor: pointer;
}
.pm-item:hover:not(:disabled), .pm-item:focus-visible { background: var(--paper-alt); outline: none; }
.pm-item:disabled { color: var(--ink-soft); cursor: default; }
.pm-mark { flex: none; width: 1em; color: var(--ink); align-self: center; display: inline-flex; } /* 12.11: never colored */
.pm-mark svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pm-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 13.3: on an English screen a menu action's longer words wrap, never cut;
   a project's own name keeps its ellipsis, and 「选择新位置…」 drops below it. */
html[lang="en"] .pm-item[role="menuitem"] .pm-label { white-space: normal; }
html[lang="en"] .pm-row { flex-wrap: wrap; }
html[lang="en"] .pm-row .pm-sub { flex-basis: 100%; padding-left: 2.05rem; }
.pm-flag { flex: none; font-size: 0.75rem; color: var(--ink-soft); }
.pm-row { display: flex; align-items: baseline; }
.pm-row .pm-item { flex: 1; min-width: 0; }
.pm-row .pm-sub { flex: none; width: auto; font-size: 0.76rem; color: var(--ink); padding: 0.32rem 0.9rem 0.32rem 0.4rem; }
.pm-missing .pm-label { color: var(--ink-soft); }
.pm-rule { border: none; border-top: 1px solid var(--line); margin: 0.3rem 0; }
.pm-empty { padding: 0.32rem 0.9rem 0.32rem 1.7rem; color: var(--ink-soft); font-size: 0.8rem; }
.pm-form { padding: 0.45rem 0.9rem 0.55rem; display: flex; flex-direction: column; gap: 0.45rem; }
.pm-form-title { font-weight: 600; font-size: 0.82rem; }
.pm-form p { margin: 0; font-size: 0.78rem; color: var(--ink-soft); }
.pm-form .form-input { font-size: 0.82rem; }
.pm-form-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.pm-status { font-size: 0.78rem; color: var(--clay); min-height: 0; }
.pm-status:empty { display: none; }
/* DESIGN.md 11.2: the GitHub line, its state as of the last fetch, and
   「从 GitHub 获取最新状态」. The state is a quiet second line. */
.pm-github { padding: 0.32rem 0.9rem 0.1rem 1.7rem; font-size: 0.82rem; }
.pm-github a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.pm-github a:hover { border-bottom-color: var(--ink); }
.pm-github-state { padding: 0 0.9rem 0.25rem 1.7rem; font-size: 0.76rem; color: var(--ink-soft); }
.github-link-row { font-size: 0.8rem; margin: -0.3rem 0 0.7rem; color: var(--ink-soft); }
.github-link-row a { color: var(--ink); }
.github-link-row .github-note { margin-left: 0.6rem; color: var(--ink-soft); }

.refresh-chip {
  font-size: 0.76rem;
  color: var(--ink);
  background: var(--ochre-soft);
  border: 1px solid var(--ochre);
  padding: 0.18rem 0.6rem;
  align-self: center;
  white-space: nowrap;
}
.refresh-chip.err { background: var(--clay-soft); border-color: var(--clay); cursor: help; }

/* A degraded project (DESIGN.md section 8.10 rules 1-2). Clay, because in
   this app clay means "something is wrong" (21.8; it once also meant "a human
   did this") -- and this is it. Sits by the project menu, which stays usable:
   the state is about the project, not about the page. */
.project-state {
  font-size: 0.76rem;
  color: var(--clay);
  background: var(--clay-soft);
  border: 1px solid var(--clay);
  padding: 0.18rem 0.6rem;
  align-self: center;
  white-space: nowrap;
  cursor: help;
}

/* The full scan's progress (DESIGN.md 10.2 step 3, 10.3): 「正在扫描：<步骤>
   （n/m）」 while it runs, then a quiet 「扫描完成」 for a few seconds. */
.scan-chip {
  font-size: 0.76rem; color: var(--ink); background: var(--paper-alt); border: 1px solid var(--line-strong);
  padding: 0.18rem 0.6rem; align-self: center; white-space: nowrap;
}
.scan-chip.done { color: var(--olive); border-color: var(--olive); background: var(--olive-soft); }
.scan-chip.warn { color: var(--ink); border-color: var(--ochre); background: var(--ochre-soft); white-space: normal; max-width: 28rem; }
.scan-chip.err { color: var(--ink); border-color: var(--clay); background: var(--clay-soft); white-space: normal; max-width: 28rem; }
.scan-chip-link {
  font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}
.scan-chip-close { font: inherit; color: var(--ink-soft); background: none; border: none; padding: 0 0 0 0.5rem; cursor: pointer; white-space: nowrap; }
.scan-chip-close:hover { color: var(--ink); }

/* The in-view companion to the header state: product language where the
   error box would have been, with the engine's English on hover. */
.state-note { border: 1px solid var(--clay); background: var(--clay-soft); padding: 0.9rem 1.1rem; font-size: 0.88rem; max-width: 640px; }
.state-note .state-note-title { font-weight: 600; color: var(--clay); margin-bottom: 0.25rem; }
.state-note p { margin: 0.3rem 0 0; color: var(--ink-soft); }

/* 数据与代码's two ways of looking: the list and 关系图 (12.9). */
.subnav { display: flex; gap: 1.4rem; margin: -0.4rem 0 1.2rem; border-bottom: 1px solid var(--line); }
.subnav-item {
  background: none; border: none; cursor: pointer; font: inherit; font-size: 0.86rem; color: var(--ink-soft);
  padding: 0.2rem 0 0.45rem; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.subnav-item[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.subnav-item:hover { color: var(--ink); }
.subnav-item:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
body.canvas-mode .subnav { margin: 0; padding: 0.5rem 1rem 0; }

.project-line-msg { font-size: 0.78rem; color: var(--ink-soft); }
.project-line-msg:empty { display: none; }

/* No project yet (DESIGN.md 10.1): every section shows only the welcome. */
.welcome { display: none; max-width: 560px; margin: 3.5rem auto 0; }
body.no-project .welcome { display: block; }
body.no-project .view, body.no-project .notices, body.no-project #new-attempt-btn,
body.no-project #records-btn, body.no-project .subnav, body.no-project .page-title { display: none !important; }
.welcome p { margin: 0 0 0.6rem; font-size: 0.95rem; }
.welcome .welcome-what { color: var(--ink-soft); font-size: 0.84rem; margin-top: 1.1rem; }
.welcome .btn { margin-top: 0.6rem; font-size: 0.88rem; padding: 0.45rem 1rem; }

/* The add dialog (DESIGN.md 10.2), in the side panel. */
.add-choose { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
.add-choose .locate-row { margin-top: 0; }
.add-busy { font-size: 0.84rem; color: var(--ink-soft); }
.add-result { display: flex; flex-direction: column; gap: 0.7rem; }
.add-root { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); word-break: break-all; }
.add-lead { font-size: 0.92rem; font-weight: 600; }
.add-lead.bad { color: var(--clay); }
.add-counts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.add-counts li { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.84rem; padding: 0.28rem 0; border-bottom: 1px solid var(--line); }
.add-counts .n { font-family: var(--font-mono); font-size: 0.8rem; }
.add-note { font-size: 0.82rem; color: var(--ink-soft); margin: 0; }
.add-note.warn { color: var(--ink); border-left: 2px solid var(--ochre); padding-left: 0.6rem; }
.add-writes { font-size: 0.8rem; color: var(--ink-soft); border-left: 2px solid var(--line-strong); padding-left: 0.6rem; margin: 0; }
.add-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.add-confirm { border: 1px solid var(--ochre); background: var(--ochre-soft); padding: 0.7rem 0.9rem; font-size: 0.84rem; }
.add-confirm .add-actions { margin-top: 0.55rem; }
.add-result .notice { max-width: none; }

/* 「推送到 GitHub…」 (DESIGN.md 11.3), in the side panel. */
.add-note.bad { color: var(--clay); border-left: 2px solid var(--clay); padding-left: 0.6rem; }
.push-commits { list-style: none; margin: -0.3rem 0 0; padding: 0; border-top: 1px solid var(--line); }
.push-commits li { font-size: 0.82rem; padding: 0.22rem 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.push-commits code, .push-cmd { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); margin-right: 0.5rem; }
.push-cmd { color: var(--ink); background: var(--paper-alt); padding: 0.05rem 0.3rem; user-select: all; }
.push-remote { font-size: 0.84rem; }
.push-remote a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.push-tick { display: flex; gap: 0.45rem; align-items: center; font-size: 0.84rem; }
.push-name { display: flex; gap: 0.5rem; align-items: center; margin: 0.5rem 0; font-size: 0.84rem; }
.push-name .form-input { flex: 1; min-width: 10rem; font-family: var(--font-mono); font-size: 0.8rem; }

main#main { flex: 1; padding: 1.6rem 2rem 4rem; max-width: 1040px; width: 100%; }

.guide-card { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 1.5rem 1.75rem; max-width: 640px; }
.guide-card h2 { font-family: var(--font-serif); font-size: 1.15rem; margin: 0 0 0.6rem; }
.guide-card p { margin: 0.4rem 0; color: var(--ink-soft); }
.guide-card pre {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 0.9rem 1rem;
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  line-height: 1.5;
  white-space: pre;
}

.section-title {
  font-family: var(--font-serif);
  font-size: 1rem;
  margin: 2rem 0 0.75rem;
  padding-bottom: 0.4rem;
  border-bottom: 1px solid var(--line-strong);
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}
.section-title .count { font-family: var(--font-sans); font-size: 0.78rem; color: var(--ink-soft); font-weight: normal; }

.empty-note { color: var(--ink-soft); font-size: 0.86rem; padding: 0.4rem 0 1rem; }

.attempt-list { margin: 0; }
.attempt-children { margin-left: 1.4rem; }
details.attempt-node { border-bottom: 1px solid var(--line); }
/* 12.11: disclosure is the platform's own control -- the summary keeps its
   native marker; the row inside it opens the record. */
details.attempt-node > summary { display: list-item; cursor: pointer; padding: 0.55rem 0; color: var(--ink-soft); }
details.attempt-node > summary:focus-visible, details.script-node > summary:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }

.row-content { cursor: pointer; display: inline-flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; padding: 0.1rem 0.35rem; margin: -0.1rem 0 -0.1rem 0.1rem; color: var(--ink); vertical-align: top; max-width: calc(100% - 1.5rem); }
.row-content:hover { background: var(--paper-alt); }
.attempt-number { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-soft); }
.attempt-date { font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.attempt-desc { font-weight: 500; }

/* 12.11: a verdict is a quiet tinted text label (现行 / 已放弃 / 待定 /
   不利证据 / 被否 / 归档 / 其它), followed by the researcher's own words. */
.status-label {
  display: inline-block; flex: none; font-size: 0.75rem; line-height: 1.5; padding: 0 0.4rem; white-space: nowrap;
  color: var(--ink); background: var(--paper-alt);
}
.status-label.tone-olive { background: var(--olive-soft); color: var(--olive); }
.status-label.tone-ochre { background: var(--ochre-soft); color: var(--ochre); }
.status-label.tone-clay { background: var(--clay-soft); color: var(--clay); }
.status-label.tone-gray { background: var(--gray-soft); color: var(--gray); }
.status-label.tone-plain { background: var(--paper-alt); color: var(--ink-soft); }
.verdict-inline { display: inline-flex; align-items: baseline; gap: 0.35rem; flex-wrap: wrap; }
.verdict-words { color: var(--ink-soft); font-size: 0.86rem; }
.own-mark { font-size: 0.75rem; color: var(--ink); font-weight: 600; }
.tree-filter { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: baseline; font-size: 0.86rem; margin: 0 0 0.8rem; color: var(--ink-soft); }
.attempt-reason { font-size: 0.84rem; color: var(--ink-soft); margin: 0 0 0.5rem 1.9rem; }

/* -- 研究路线 (DESIGN.md 14, 18.3): the route map -- or the grouped list in a
   pane of its own -- with the 等你处理 column beside it, the whole window below
   the header (canvas-mode); lists, not dashboards. -- */
body.canvas-mode #view-desk { flex: 1; min-height: 0; display: flex; }
body.canvas-mode #view-desk > :not(.desk-layout) { margin: 1.6rem 2rem; }
.desk-layout { flex: 1; min-width: 0; min-height: 0; display: flex; }
.desk-column {
  flex: none; width: 22rem; overflow-y: auto; padding: 1.1rem 1.25rem 3rem; border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column; gap: 1.6rem;
}
.routes-pane { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 1.4rem 2rem 3rem; }
.route-row.picked { background: var(--paper-alt); box-shadow: -0.5rem 0 0 var(--paper-alt), 0.5rem 0 0 var(--paper-alt); }
.desk-column-title { font-family: var(--font-sans); font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); margin: 0 0 -0.8rem; }
/* Nothing waits (DESIGN.md 21.4): the column folds to a strip that gives its width to the map or the list, and opens
   again when a row arrives. */
.desk-column.folded { width: 2.4rem; padding: 1.1rem 0.3rem; align-items: center; overflow: hidden; }
.desk-column.folded .desk-column-title { margin: 0; writing-mode: vertical-rl; letter-spacing: 0.08em; white-space: nowrap; }
.desk-title { font-family: var(--font-sans); font-weight: 600; font-size: 1rem; margin: 0 0 0.35rem; }
.desk-sub { font-size: 0.84rem; color: var(--ink-soft); margin: 0 0 0.6rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; }
.desk-row.picked { background: var(--paper-alt); box-shadow: -0.5rem 0 0 var(--paper-alt), 0.5rem 0 0 var(--paper-alt); }
.desk-items { list-style: none; margin: 0.3rem 0 0; padding: 0; font-size: 0.8rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.desk-items li { padding: 0.1rem 0; }
.desk-items .mono { font-family: var(--font-mono); font-size: 0.76rem; }
.desk-reason { color: var(--ochre); margin-right: 0.45rem; }
.desk-empty { font-size: 0.86rem; color: var(--ink-soft); margin: 0.2rem 0 0; }
.desk-alone { font-size: 0.9rem; border-left: 2px solid var(--ochre); padding-left: 0.7rem; margin: 0; }
.desk-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.desk-row { display: flex; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.desk-when { flex: none; width: 6.2rem; font-size: 0.76rem; color: var(--ink-soft); padding-top: 0.15rem; white-space: nowrap; }
.desk-main { flex: 1; min-width: 0; }
.desk-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
.desk-what { font-size: 0.86rem; display: inline-flex; flex-wrap: wrap; gap: 0.35rem; align-items: baseline; }
.desk-what.strong { font-weight: 600; }
.desk-meta { font-size: 0.76rem; color: var(--ink-soft); margin-top: 0.1rem; }
.desk-meta:empty { display: none; }
.desk-note { font-size: 0.84rem; margin: 0.25rem 0 0; padding-left: 0.6rem; border-left: 2px solid var(--line-strong); color: var(--ink); white-space: pre-wrap; word-break: break-word; }
.desk-note.plain { border-left: none; padding-left: 0; color: var(--ink-soft); }
.desk-break { font-size: 0.84rem; margin: 0.2rem 0 0; color: var(--clay); display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; }
.desk-actions { display: flex; gap: 0.5rem; margin-top: 0.35rem; }
.desk-link {
  font: inherit; font-size: 0.88rem; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer;
  text-align: left; border-bottom: 1px solid var(--line-strong); word-break: normal; overflow-wrap: anywhere;
}
.desk-link:hover { border-bottom-color: var(--ink); }
.desk-link.strong { font-weight: 600; word-break: normal; overflow-wrap: anywhere; }
.desk-link:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.desk-link.mono, .desk-files .mono { font-family: var(--font-mono); font-size: 0.8rem; }
.desk-files .mono { overflow-wrap: anywhere; }   /* a long path in a row wraps inside the row */
.desk-link.mono { word-break: break-all; }   /* a path has no word to keep whole */
.desk-files { list-style: none; margin: 0 0 0.8rem; padding: 0; }
.desk-files li { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.2rem 0; border-bottom: 1px solid var(--line); }
/* a file beside its official copy and a member's area: the name above, what goes with it under it at the full width (a closed fold and the form it opens are not squeezed into the row's right edge) */
.desk-files li.beside-item { flex-direction: column; align-items: stretch; gap: 0.15rem; }
.panel-h3 { font-size: 0.8rem; color: var(--ink-soft); font-weight: normal; margin: 1rem 0 0.3rem; }
.proposal-sentence { font-family: var(--font-sans); font-weight: 600; font-size: 0.98rem; margin: 0 0 0.6rem; }
.placeholder { font-size: 0.9rem; color: var(--ink-soft); max-width: 560px; }

.script-list { margin: 0.15rem 0 0.6rem 1.9rem; }
details.script-node { border-left: 1px dashed var(--line-strong); margin: 0.15rem 0; }
details.script-node > summary { display: list-item; cursor: pointer; padding: 0.35rem 0 0.35rem 0.7rem; color: var(--ink-soft); }
.script-path { font-family: var(--font-mono); font-size: 0.85rem; }

.rw-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 0.3rem 0 0.1rem 1.9rem; }

.file-list { list-style: none; margin: 0 0 0.5rem 1.9rem; padding: 0; }
.file-row { display: flex; align-items: baseline; gap: 0.45rem; padding: 0.22rem 0.35rem; margin: 0 -0.35rem; cursor: pointer; font-family: var(--font-mono); font-size: 0.83rem; }
.file-row:hover { background: var(--paper-alt); }

.flow-icon.read { color: var(--olive); }
.flow-icon.write { color: var(--ochre); }

.clickable { cursor: pointer; }
.clickable:hover { text-decoration: underline; }

/* -- The node page (DESIGN.md 12.6, 12.7, 12.9, 12.11; node.js): type in
   words, the serif name, the path in mono; the trace as columns joined by
   drawn lines; one timeline of changes and notes; the judgments. Weight
   and space carry the hierarchy, not boxes. -- */
.node-page { display: flex; flex-direction: column; gap: 1.8rem; }
.node-back { margin-bottom: -0.8rem; }
.node-link {
  font: inherit; font-size: inherit; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer;
  border-bottom: 1px solid var(--line-strong); text-align: left;
}
.node-link:hover { border-bottom-color: var(--ink); }
.node-link:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.node-link.mono { font-family: var(--font-mono); font-size: 0.8rem; }
.node-back .node-link { font-size: 0.82rem; color: var(--ink-soft); }
.node-icon { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.node-head { display: flex; flex-direction: column; gap: 0.3rem; }
.node-kind { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--ink-soft); }
.node-name { font-family: var(--font-serif); font-weight: normal; font-size: 1.5rem; margin: 0; line-height: 1.35; word-break: break-word; }
.node-path { color: var(--ink-soft); word-break: break-all; }
.node-marks { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; margin-top: 0.2rem; }
.node-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
.node-details { display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1.2rem; margin: 0; font-size: 0.88rem; max-width: 820px; }
.node-details dt { color: var(--ink-soft); }
.node-details dd { margin: 0; word-break: break-word; }
.node-sec-title { font-family: var(--font-sans); font-weight: 600; font-size: 1rem; margin: 0 0 0.6rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--line-strong); }
.node-sub { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.5rem; }
.node-sub-inline { font-size: 0.78rem; color: var(--ink-soft); }
.node-empty { font-size: 0.86rem; color: var(--ink-soft); margin: 0.2rem 0; list-style: none; }
.node-failed { font-size: 0.88rem; color: var(--clay); margin-top: 1rem; }

.trace-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 0.4rem; }
.trace { position: relative; display: flex; gap: 2rem; align-items: flex-start; padding: 0.2rem 0.1rem; }
.trace-lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.trace-line { fill: none; stroke: var(--ink); stroke-opacity: 0.45; stroke-width: 1.5; }
.trace-line.pending { stroke-dasharray: 5 4; }
.trace-line.human { stroke: var(--ink); stroke-opacity: 1; stroke-width: 2.25; }
.trace-line.review { stroke: var(--ochre); stroke-opacity: 0.9; }
.trace-dot { fill: var(--ink); }
/* Columns share the width (120-190px each); a long chain scrolls sideways. */
.trace-col { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 0.55rem; flex: 1 1 0; min-width: 0; max-width: 190px; }
.trace-col.is-self { flex-grow: 1.2; max-width: 210px; }
.trace-col.repairing { flex: none; width: 280px; max-width: none; }
.trace-col-title { font-size: 0.75rem; color: var(--ink-soft); padding-bottom: 0.15rem; }
.trace-item {
  display: flex; flex-direction: column; gap: 0.1rem; text-align: left; font: inherit; color: var(--ink);
  background: var(--paper-alt); border: 1px solid var(--line-strong); border-left-width: 3px; padding: 0.35rem 0.5rem; cursor: pointer; min-width: 0;
}
.trace-item:hover { border-color: var(--ink-soft); }
.trace-item:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.trace-item.t-dataset { border-left-color: var(--ochre); }
.trace-item.t-script { border-left-color: var(--olive); }
.trace-item.t-figure, .trace-item.t-section, .trace-item.t-claim { border-left-color: var(--ink); }
.trace-item.self { cursor: default; border-color: var(--ink); border-width: 1.5px 1.5px 1.5px 3px; background: var(--paper); }
.trace-item.missing { border-style: dashed; }
.trace-item-head { display: flex; align-items: center; gap: 0.35rem; min-width: 0; }
.trace-item-name { font-size: 0.84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trace-item.t-section .trace-item-name, .trace-item.t-claim .trace-item-name, .trace-item.t-reference .trace-item-name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.trace-item-dir { font-size: 0.75rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.trace-item-flags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.15rem; }
.trace-item .own-mark { font-size: 0.75rem; }
.trace-empty { font-size: 0.78rem; color: var(--ink-soft); }
.trace-gap { border: 1px dashed var(--clay); padding: 0.45rem 0.55rem; display: flex; flex-direction: column; gap: 0.4rem; background: var(--paper); }
.trace-gap.wide { margin-top: 0.9rem; max-width: 520px; }
.trace-gap-label { font-size: 0.8rem; color: var(--clay); }
.trace-belongs { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: baseline; margin-top: 0.9rem; font-size: 0.86rem; }
.trace-belongs-word { color: var(--ink-soft); }
.trace-attempt { display: inline-flex; flex-wrap: wrap; gap: 0.4rem; align-items: baseline; }
.trace-break { font-size: 0.82rem; color: var(--clay); margin: 0.4rem 0 0; }
/* 21.5: the same break in no colour when the paper does not rely on it (the clay colour is for what is wrong). */
.trace-gap.quiet { border-color: var(--line-strong); }
.trace-gap.quiet .trace-gap-label, .trace-break.quiet { color: var(--ink-soft); }
.trace-gap-cause { font-size: 0.78rem; color: var(--ink-soft); }
.repair { display: flex; flex-direction: column; align-items: flex-start; gap: 0.4rem; }
.repair-form { align-self: stretch; }
.repair-form { display: flex; flex-direction: column; gap: 0.4rem; }
.repair-select, .repair-note { font-size: 0.78rem; max-width: 100%; }
.repair-sentence { font-size: 0.78rem; margin: 0; color: var(--ink); word-break: break-all; }
.repair-sentence:empty { display: none; }
.repair-actions { display: flex; gap: 0.4rem; }

.node-timeline, .node-links { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-width: 860px; }
.tl-row { display: flex; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
.tl-when { flex: none; width: 6.2rem; font-size: 0.76rem; color: var(--ink-soft); padding-top: 0.15rem; white-space: nowrap; }
.tl-main { flex: 1; min-width: 0; }
.tl-what { font-size: 0.88rem; }
.tl-row.kind-note > .tl-main > .tl-what { color: var(--ink-soft); font-size: 0.8rem; }
.tl-meta { font-size: 0.76rem; color: var(--ink-soft); margin-top: 0.1rem; }
.tl-meta:empty { display: none; }
.tl-note { font-size: 0.86rem; margin: 0.3rem 0 0; padding-left: 0.6rem; border-left: 2px solid var(--line-strong); white-space: pre-wrap; word-break: break-word; }
.tl-note.withdrawn { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.tl-summary { font-size: 0.84rem; margin: 0.3rem 0 0; }
.tl-diff { margin-top: 0.35rem; }
.tl-actions { display: flex; gap: 0.5rem; margin-top: 0.35rem; }
.diff { font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.5; border: 1px solid var(--line); background: var(--paper); overflow-x: auto; padding: 0.3rem 0; }
.dl-row { white-space: pre; padding: 0 0.6rem; min-height: 1.1em; }
.dl-row.add { background: var(--olive-soft); }
.dl-row.del { background: var(--gray-soft); }
.dl-row.hunk, .dl-row.meta { color: var(--ink-soft); }
.diff-more { margin: 0.35rem 0.6rem 0.1rem; font-family: var(--font-sans); }
.node-note { margin-top: 0.9rem; max-width: 640px; display: flex; flex-direction: column; gap: 0.35rem; }
.node-note-input { width: 100%; resize: vertical; font-family: var(--font-sans); }

.link-row { padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.link-row.rejected .link-head > :not(.status-label) { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.link-head { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: baseline; font-size: 0.86rem; }
.link-rel { color: var(--ink-soft); }
.link-self { font-weight: 600; }
.link-actions { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
.node-links-more { padding: 0.5rem 0; list-style: none; }
.node-graph { position: relative; height: 480px; margin-top: 0.7rem; border: 1px solid var(--line-strong); }

/* 图表与论断 and 数据与代码 (12.9): lists, each row opening its node page. */
.results { display: flex; flex-direction: column; gap: 1.6rem; max-width: 900px; }
.res-group { margin-bottom: 1.1rem; }
.res-group-title { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; font-size: 0.86rem; color: var(--ink-soft); margin: 0.6rem 0 0.25rem; }
.res-group-file { font-size: 0.76rem; }
.res-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.res-row { display: flex; gap: 0.9rem; align-items: baseline; padding: 0.45rem 0; border-bottom: 1px solid var(--line); }
.res-kind { flex: none; width: 3.1rem; font-size: 0.78rem; color: var(--ink-soft); }
.res-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; font-size: 0.88rem; }
.res-main .node-link.claim { font-size: 0.84rem; border-bottom-color: var(--line); }
.res-path { font-size: 0.75rem; color: var(--ink-soft); word-break: break-all; }
/* 21.7: a path is the quiet second line under its title, never the line itself. */
.res-main > .res-path { flex: 0 0 100%; margin-top: -0.4rem; font-size: 0.75rem; }
.res-main > .res-gone { flex: 0 0 100%; margin-top: -0.4rem; font-size: 0.75rem; }   /* 21.5: a mark whose file has gone: one quiet sentence under its name */
.dc-path { margin-top: 0.05rem; font-size: 0.75rem; }
.dc-broken-path { margin: -0.05rem 0 0.2rem; font-size: 0.75rem; }
.res-cause { font-size: 0.78rem; color: var(--ink-soft); }
.res-cause.warn { color: var(--clay); }
.res-repair { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
/* 21.5: a row's small picture, and its quiet fields (the drafts that include it, the attempt it belongs to). */
.res-thumb { flex: none; align-self: flex-start; width: 56px; height: 40px; object-fit: cover; border: 1px solid var(--line); border-radius: 2px; background: var(--paper-alt); }
.res-field { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 0; align-items: baseline; font-size: 0.78rem; color: var(--ink-soft); }
.res-field-label { margin-right: 0.45rem; }
.res-field-more { margin-left: 0.4rem; }
.res-field-sep { white-space: pre; }   /* a flex item loses a trailing space: English's ", " would otherwise print a.md,b.md */
.res-field .node-link { font-size: 0.78rem; }
.res-open.warn { color: var(--clay); }
.res-fold { margin-top: 0.8rem; }
/* 21.5: the paper is chosen once: its drafts in a line each, and one control that opens the drafts it can still take. */
.res-paper-list { margin-bottom: 0.7rem; }
.res-paper-list .res-main { align-items: baseline; }
.res-picker-list { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; }
.res-picker-list.hidden { display: none; }
.res-picker-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; font-size: 0.86rem; }
.res-picker-more { margin-top: 0.2rem; }
.res-draft { border-bottom: 1px solid var(--line); }
/* 12.13: a quiet line chevron for disclosure; the browser's triangle is hidden. */
.res-draft-summary { display: flex; align-items: center; gap: 0.6rem; list-style: none; cursor: pointer; padding: 0.5rem 0.3rem; font-size: 0.86rem; }
.res-draft-summary::-webkit-details-marker { display: none; }
.res-draft-summary::marker { content: ""; }
.res-draft-summary > .btn { margin-left: auto; }
.res-draft-plain > .res-draft-summary { cursor: default; padding-left: calc(0.3rem + 12px + 0.6rem); }
.res-draft-plain > .res-draft-summary:hover { background: none; }
.res-chevron { width: 12px; height: 12px; flex: none; fill: none; stroke: var(--ink-soft); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s ease; }
.res-draft[open] > .res-draft-summary .res-chevron { transform: rotate(90deg); }
details[open] > .res-draft-summary .res-chevron { transform: rotate(90deg); }
/* 12.13: the same chevron on a toggle that is not a <details>, drawn by the class so the control's words stay its own. */
.has-chevron::before { content: ""; display: inline-block; flex: none; width: 4px; height: 4px; margin: 0 0.5rem 0.12em 0.15rem; border-top: 1.4px solid var(--ink-soft); border-right: 1.4px solid var(--ink-soft); transform: rotate(45deg); transition: transform 0.15s ease; }
.has-chevron[aria-expanded="true"]::before { transform: rotate(135deg); }
.draft-file.left-out .mono { color: var(--ink-soft); }
.res-draft-summary:hover { background: var(--paper-alt); }
.res-draft-summary:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.res-draft-body { padding: 0 0 0.8rem 1.4rem; }
.dc-filters { display: flex; flex-wrap: wrap; gap: 1.2rem; margin: 0 0 0.9rem; }
.dc-filter { font: inherit; font-size: 0.84rem; color: var(--ink-soft); background: none; border: none; border-bottom: 2px solid transparent; padding: 0.1rem 0 0.25rem; cursor: pointer; }
.dc-filter[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.dc-filter:hover { color: var(--ink); }
.dc-filter:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.dc-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-width: 900px; }
.dc-row { display: flex; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.dc-kind { flex: none; width: 3.6rem; display: inline-flex; gap: 0.35rem; align-items: center; font-size: 0.76rem; color: var(--ink-soft); height: 1.4rem; }
.dc-main { flex: 1; min-width: 0; }
.dc-head { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
.dc-rel { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.1rem; word-break: break-all; }
.dc-rel.bad { color: var(--clay); }
.dc-filter.problem { color: var(--clay); }
.dc-nogen { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; }
.dc-broken { display: flex; flex-direction: column; }
.dc-maybe, .dc-candidate { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; font-size: 0.8rem; margin-top: 0.2rem; }
.dc-maybe-path { font-size: 0.78rem; word-break: break-all; }
.dc-fold > .res-draft-summary { padding: 0.15rem 0; font-size: 0.8rem; color: var(--ink-soft); }
.dc-fold[open] > .res-draft-summary .res-chevron { transform: rotate(90deg); }
.dc-fold-body { padding-left: calc(12px + 0.6rem); }
/* 撤销 (18.3) stays in view at the top while a long list is read: the write reloads the page at the scroll the person was at. */
.dc-undo { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; font-size: 0.84rem; margin: 0 0 0.8rem; position: sticky; top: 0; z-index: 6; padding: 0.5rem 0; background: var(--paper); border-bottom: 1px solid var(--line); }
.lit-ref-open { display: block; font: inherit; font-size: 0.84rem; text-align: left; background: none; border: none; padding: 0; color: var(--ink); cursor: pointer; border-bottom: 1px solid transparent; }
.lit-ref-open:hover { border-bottom-color: var(--ink); }

.error-box { border: 1px solid var(--clay); background: var(--clay-soft); color: var(--ink); padding: 0.9rem 1.1rem; font-size: 0.88rem; }
.error-box .error-title { font-weight: 600; color: var(--clay); margin-bottom: 0.25rem; }
/* DESIGN.md 8.8 "Errors": an error that blocked an action shows its Chinese
   sentence, then a 「详情」 button that reveals the engine's raw text inline
   -- one click, never a hover (renderBlockingError). */
.err-detail-toggle {
  font: inherit; font-family: var(--font-sans); font-size: 0.75rem; color: var(--ink);
  background: none; border: none; padding: 0; margin-left: 0.5rem;
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
}
.err-detail-toggle:hover { color: var(--ink); }
.err-detail {
  display: block; margin-top: 0.3rem; font-family: var(--font-mono); font-size: 0.75rem;
  color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; max-height: 12rem; overflow: auto;
}

.panel-backdrop { position: fixed; inset: 0; background: rgba(38, 34, 27, 0.28); z-index: 40; }
.panel {
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: min(var(--panel-width, 560px), calc(100vw - 24px));
  box-sizing: border-box;
  background: var(--paper);
  border-left: 1px solid var(--line-strong);
  z-index: 50;
  display: flex;
  flex-direction: column;
  box-shadow: -6px 0 24px rgba(38, 34, 27, 0.12);
}
.panel-resizer { position: absolute; top: 0; bottom: 0; left: -6px; width: 12px; z-index: 1; cursor: col-resize; touch-action: none; }
.panel-resizer::after { content: ""; position: absolute; left: 5px; top: 50%; width: 3px; height: 44px; border-radius: 2px; transform: translateY(-50%); background: var(--line-strong); }
.panel-resizer:hover::after, .panel-resizer:focus-visible::after { background: var(--ink); }
.panel-resizer:focus-visible { outline: none; }
.panel-resizer:focus-visible::after { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--ink); }
body.panel-resizing, body.panel-resizing * { cursor: col-resize !important; user-select: none !important; -webkit-user-select: none !important; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--line-strong); }
.panel-head-text { min-width: 0; }
.panel-back { display: block; margin: 0 0 0.35rem; font-size: 0.82rem; }
.panel-title { font-family: var(--font-sans); font-weight: 600; font-size: 1rem; word-break: normal; }
.panel-title.path-title { font-family: var(--font-mono); font-weight: normal; font-size: 0.95rem; word-break: break-all; }
.panel-subtitle { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.25rem; }
/* 12.11: closed with the word, not a glyph. */
.panel-close { flex: none; background: none; border: none; font: inherit; font-size: 0.82rem; line-height: 1.4; cursor: pointer; color: var(--ink-soft); padding: 0.1rem 0.2rem; white-space: nowrap; }
.panel-close:hover { color: var(--ink); }
.panel-body { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; padding: 1.1rem 1.3rem; }
/* The desk's side panel (DESIGN.md 14.3): an attempt, its note, trace, lines and what waits on it. */
.panel-body .dp-part, .panel-body .node-trace-sec { margin: 0 0 1.6rem; }
.dp-head { display: flex; flex-direction: column; gap: 0.4rem; margin: 0 0 1.4rem; }
.dp-mark { font-size: 0.75rem; color: var(--ink-soft); }
.dp-part .desk-list { border-top: none; }
.dp-part .desk-alone { margin-top: 0.5rem; }
.dp-proposal { display: flex; flex-direction: column; gap: 1.2rem; }
.dp-in-place { margin-top: 0.6rem; }

.panel-actions { display: flex; gap: 0.6rem; margin: 0 0 0.7rem; }
.btn { font: inherit; font-size: 0.82rem; padding: 0.4rem 0.85rem; background: var(--paper-alt); border: 1px solid var(--line-strong); cursor: pointer; color: var(--ink); }
.btn:hover { border-color: var(--ink); }
.panel-status { font-size: 0.8rem; margin-bottom: 0.8rem; min-height: 1.1em; }
.panel-status.ok { color: var(--olive); }
.panel-status.err { color: var(--clay); }

.kv-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.86rem; }
.kv-table th { text-align: left; vertical-align: top; color: var(--ink-soft); font-weight: normal; padding: 0.3rem 0.8rem 0.3rem 0; white-space: nowrap; }
.kv-table td { padding: 0.3rem 0; word-break: break-word; }

.code-preview { border: 1px solid var(--line); overflow-x: auto; background: var(--paper-alt); }
.dta-shape { font-size: 0.86rem; margin: 0 0 0.4rem; }
.dc-stata { margin: 0 0 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--line); }
.dc-stata-title { font-size: 0.92rem; font-weight: 600; margin: 0 0 0.5rem; }
.dc-stata-item { margin: 0 0 0.8rem; max-width: 760px; }
.dc-stata-sentence { font-size: 0.86rem; margin: 0 0 0.3rem; overflow-wrap: anywhere; }
.dc-stata-unresolved summary { font-size: 0.84rem; cursor: pointer; }
.dc-stata-unresolved[open] > .res-draft-summary .res-chevron { transform: rotate(90deg); }
.dc-stata-reason { font-size: 0.82rem; color: var(--ink-soft); margin: 0.6rem 0 0.2rem; }
.dc-stata-list { list-style: none; margin: 0; padding: 0; }
.dc-stata-list li { overflow-wrap: anywhere; }
.dta-label { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.7rem; overflow-wrap: anywhere; }
.dta-table { border-collapse: collapse; font-size: 0.82rem; width: 100%; }
.dta-table th { text-align: left; font-weight: normal; color: var(--ink-soft); font-size: 0.76rem; padding: 0.3rem 0.8rem 0.3rem 0; border-bottom: 1px solid var(--line-strong); }
.dta-table td { padding: 0.3rem 0.8rem 0.3rem 0; border-bottom: 1px solid var(--line); vertical-align: baseline; overflow-wrap: anywhere; }
.dta-table td.dta-name, .dta-table td.dta-type { font-family: var(--font-mono); font-size: 0.78rem; white-space: nowrap; }
.code-table { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.78rem; width: 100%; }
.code-table td.ln { color: var(--ink-soft); text-align: right; padding: 0 0.7em; user-select: none; border-right: 1px solid var(--line); white-space: nowrap; }
.code-table td.src { padding: 0 0.7em; white-space: pre; }
.truncated-note { font-size: 0.76rem; color: var(--ochre); margin-bottom: 0.6rem; }

.step-broken { color: var(--clay); font-size: 0.84rem; }

/* -- Attempt edit form (task V3 phase 3) -- same paper palette as the rest */
.new-attempt-btn { align-self: center; white-space: nowrap; }

.attempt-form { display: flex; flex-direction: column; gap: 0.75rem; }
.form-field label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.25rem; }
.form-input, .form-textarea {
  font: inherit;
  font-size: 0.86rem;
  color: var(--ink);
  background: var(--paper-alt);
  border: 1px solid var(--line-strong);
  border-radius: 0;
  padding: 0.35rem 0.55rem;
  width: 100%;
}
.form-textarea { resize: vertical; min-height: 3.2em; line-height: 1.5; }
.form-input:focus, .form-textarea:focus { outline: 1px solid var(--ink); outline-offset: 1px; }
.form-input:disabled { color: var(--ink-soft); cursor: not-allowed; }
.form-mono { font-family: var(--font-mono); }
.verdict-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
.chip { font: inherit; font-size: 0.76rem; padding: 0.12rem 0.5rem; background: var(--paper-alt); border: 1px solid var(--line); cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--ink); }
/* 研究判断 as a choice and a reason (21.3): a button per status, the chosen one pressed -- shown in ink and weight, never
   the clay of a problem (21.8) --, then the reason. Used by the side panel, the attempt form and the handback. */
.status-chooser { display: flex; flex-direction: column; gap: 0.45rem; }
.status-picks { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.status-pick { font: inherit; font-size: 0.8rem; padding: 0.15rem 0.6rem; background: var(--paper-alt); border: 1px solid var(--line); color: var(--ink); cursor: pointer; }
.status-pick:hover:not(:disabled) { border-color: var(--ink); }
.status-pick:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.status-pick[aria-pressed="true"] { background: var(--paper); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
.status-pick:disabled { color: var(--ink-soft); cursor: not-allowed; }
.status-caption { display: block; font-size: 0.78rem; color: var(--ink-soft); }
/* the attempt form's folds (21.3): the local model's draft, and 详情 */
.attempt-fold[open] > .res-draft-summary .res-chevron { transform: rotate(90deg); }
.attempt-fold > .res-draft-summary { padding-left: 0; }
.form-actions { display: flex; gap: 0.6rem; margin-top: 0.3rem; }
.btn-primary { background: var(--ochre-soft); border-color: var(--ochre); }
.diff-label { font-size: 0.75rem; color: var(--ink-soft); margin: 0.6rem 0 0.2rem; } /* sentence case (13.4) */
.diff-row { font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.5; padding: 0.45rem 0.6rem; border: 1px solid var(--line); overflow-x: auto; white-space: pre; }
.diff-row.old { background: var(--gray-soft); border-color: var(--line-strong); }
.diff-row.new { background: var(--olive-soft); border-color: var(--olive); }
.confirm-note { font-size: 0.84rem; margin: 0.7rem 0 0.4rem; }

/* -- 记录 and 停止服务 (task V3 phase 4), at the sidebar's foot -- deliberately
   quiet: small ink-soft text buttons, ink on hover. */
.shutdown-btn {
  background: none;
  border: none;
  cursor: pointer;
  font: inherit;
  font-size: 0.76rem;
  color: var(--ink-soft);
  padding: 0.2rem 0;
}
.shutdown-btn:hover { color: var(--ink); text-decoration: underline; }

.stopped-note { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 1.5rem 1.75rem; max-width: 640px; }
.stopped-note h2 { font-family: var(--font-serif); font-size: 1.15rem; margin: 0 0 0.6rem; }
.stopped-note p { margin: 0.4rem 0; color: var(--ink-soft); }
.stopped-note code { font-family: var(--font-mono); font-size: 0.85em; background: var(--paper); border: 1px solid var(--line); padding: 0.05em 0.35em; }

/* -- 画布 (DESIGN.md section 8.2; drawn by canvas.js) ------------------------
   Only the existing tokens: paper/ink for the ground and text, ochre /
   olive / ink as the three type colors (数据集 / 脚本 / 图表), clay kept for
   "something is wrong" (21.8) -- never a type color, never a selection or a human's link. */
body.canvas-mode #app { height: 100vh; min-height: 0; }
body.canvas-mode .workspace { height: 100vh; min-height: 0; }
body.canvas-mode main#main { max-width: none; padding: 0; display: flex; flex-direction: column; min-height: 0; }
#view-canvas { flex: 1; min-height: 0; position: relative; overflow-y: auto; }
.cv-root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); user-select: none; -webkit-user-select: none; }
.cv-svg { display: block; width: 100%; height: 100%; touch-action: none; }
.cv-root.space .cv-svg, .cv-root.space .cv-node { cursor: grab; }
.cv-root.panning .cv-svg { cursor: grabbing; }
.cv-dot { fill: var(--line); }

.cv-node { cursor: grab; }
.cv-node.dragging { cursor: grabbing; filter: drop-shadow(0 6px 10px rgba(38, 34, 27, 0.18)); }
.cv-card { fill: var(--paper-alt); stroke: var(--line-strong); stroke-width: 1; }
.cv-node.hover .cv-card { stroke: var(--ink-soft); }
.cv-node.match .cv-card { stroke: var(--ink); stroke-width: 1.5; }
.cv-node.missing .cv-card, .cv-node.ghost .cv-card { stroke-dasharray: 5 3; }
.cv-node.selected .cv-card { stroke: var(--ink); stroke-width: 2; }
.cv-title-sep { stroke: var(--line); stroke-width: 1; }
.cv-node.t-dataset .cv-rule { fill: var(--ochre); }
.cv-node.t-script .cv-rule { fill: var(--olive); }
.cv-node.t-figure .cv-rule { fill: var(--ink); }
.cv-type { font-family: var(--font-sans); font-size: 12px; }
.cv-node.t-dataset .cv-type { fill: var(--ochre); }
.cv-node.t-script .cv-type { fill: var(--olive); }
.cv-node.t-figure .cv-type { fill: var(--ink); }
.cv-tag { font-family: var(--font-sans); font-size: 12px; }
.cv-tag-missing { fill: var(--clay); }
.cv-tag-ghost { fill: var(--ink-soft); }
.cv-name { font-family: var(--font-sans); font-size: 13px; fill: var(--ink); }
.cv-dir { font-family: var(--font-mono); font-size: 12px; fill: var(--ink-soft); }
.cv-node.ghost .cv-name, .cv-node.ghost .cv-type, .cv-node.ghost .cv-rule { fill: var(--ink-soft); }
.cv-socket { stroke-width: 1.25; }
.cv-socket.sock-data { fill: var(--ochre-soft); stroke: var(--ochre); }
.cv-socket.sock-figure { fill: var(--paper); stroke: var(--ink); }
.cv-socket.orphan { fill: var(--clay); stroke: var(--clay); }
.cv-socket-label { font-family: var(--font-sans); font-size: 12px; fill: var(--ink-soft); }

.cv-link { fill: none; }
.cv-link.machine { stroke: var(--ink); stroke-width: 1.5; stroke-opacity: 0.45; }
.cv-link.pending { stroke-dasharray: 6 4; }
.cv-link.human { stroke: var(--ink); stroke-width: 2.25; }
/* A cycle-closing link (8.4): dashed clay. A machine one turns clay at
   1.5px; a human one stays a human link (2.25px ink + midpoint dot) and
   only gains the dash -- the two must never be confusable (8.2). */
.cv-link.machine.cycle { stroke: var(--clay); stroke-opacity: 1; stroke-width: 1.5; stroke-dasharray: 6 4; }
.cv-link.human.cycle { stroke-dasharray: 6 4; }
.cv-link-g.lit .cv-link.machine { stroke-opacity: 1; }
.cv-link-hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; vector-effect: non-scaling-stroke; cursor: pointer; }
.cv-link.optimistic { stroke-opacity: 0.6; }
.cv-link-g.selected .cv-link.machine { stroke-opacity: 1; stroke-width: 2.25; }
.cv-link-g.selected .cv-link.human, .cv-link-g.selected .cv-link.machine.cycle { stroke-width: 3; }
.cv-link-dot { fill: var(--ink); }
.cv-node.dim, .cv-link-g.dim { opacity: 0.22; }

.cv-frames { pointer-events: none; }
.cv-frame-rect { stroke-width: 1.25; stroke-dasharray: 6 4; fill-opacity: 0.4; }
.cv-frame-title { font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
.cv-loose-title { font-family: var(--font-sans); font-size: 12px; fill: var(--ink-soft); }
.cv-frame.tone-olive .cv-frame-rect { stroke: var(--olive); fill: var(--olive-soft); }
.cv-frame.tone-olive .cv-frame-title { fill: var(--olive); }
.cv-frame.tone-ochre .cv-frame-rect { stroke: var(--ochre); fill: var(--ochre-soft); }
.cv-frame.tone-ochre .cv-frame-title { fill: var(--ochre); }
.cv-frame.tone-clay .cv-frame-rect { stroke: var(--clay); fill: var(--clay-soft); }
.cv-frame.tone-clay .cv-frame-title { fill: var(--clay); }
.cv-frame.tone-gray .cv-frame-rect { stroke: var(--gray); fill: var(--gray-soft); }
.cv-frame.tone-gray .cv-frame-title { fill: var(--gray); }
.cv-frame.tone-plain .cv-frame-rect { stroke: var(--line-strong); fill: var(--paper-alt); }
.cv-frame.tone-plain .cv-frame-title { fill: var(--ink-soft); }

.cv-toolbar {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  max-width: calc(100% - 24px);
  background: var(--paper); border: 1px solid var(--line-strong); padding: 6px;
  box-shadow: 0 2px 8px rgba(38, 34, 27, 0.08);
}
.cv-btn, .cv-scope, .cv-search {
  font: inherit; font-size: 0.8rem; color: var(--ink);
  background: var(--paper-alt); border: 1px solid var(--line-strong); border-radius: 0;
  padding: 0.22rem 0.55rem; line-height: 1.4;
}
.cv-btn { cursor: pointer; }
.cv-btn:hover, .cv-scope:hover { border-color: var(--ink); }
.cv-scope { max-width: 16rem; cursor: pointer; }
.cv-search { width: 10rem; }
.cv-scope:focus, .cv-search:focus, .cv-btn:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.cv-more { position: relative; }
.cv-menu { position: absolute; top: calc(100% + 4px); right: 0; background: var(--paper); border: 1px solid var(--line-strong); box-shadow: 0 2px 8px rgba(38, 34, 27, 0.1); min-width: 7rem; }
.cv-menu-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 0.8rem; color: var(--ink); background: none; border: none; padding: 0.4rem 0.7rem; cursor: pointer; white-space: nowrap; }
.cv-menu-item:hover { background: var(--paper-alt); }
.cv-zoom {
  position: absolute; left: 12px; bottom: 12px; z-index: 2;
  font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-soft);
  background: var(--paper); border: 1px solid var(--line); padding: 0.1rem 0.45rem;
}
/* 21.8: why the view opened on 全部, and how many cards are out of view -- one quiet line under the toolbar. It is a child of the toolbar,
   placed from its lower edge, so a toolbar that wraps to a second row (a narrow window) does not cover it. */
.cv-note { position: absolute; left: 0; top: calc(100% + 6px); z-index: 1; width: max-content; max-width: min(36rem, calc(100vw - 48px)); font-size: 0.78rem; color: var(--ink-soft); background: var(--paper); padding: 0.1rem 0.45rem; pointer-events: none; }
.cv-status {
  position: absolute; left: 72px; bottom: 12px; z-index: 4; max-width: calc(100% - 96px);
  font-size: 0.76rem; color: var(--clay); background: var(--clay-soft); border: 1px solid var(--clay); padding: 0.1rem 0.55rem;
}
.cv-tip {
  position: absolute; z-index: 3; pointer-events: none; max-width: 22rem;
  font-size: 0.76rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong);
  padding: 0.25rem 0.55rem; box-shadow: 0 2px 8px rgba(38, 34, 27, 0.1);
}
.cv-tip.human { border-color: var(--ink); }
/* Link editing (phase 2b): the curve being drawn, the socket halos, the
   confirm popover, the pinned link card, the right-click menu. */
.cv-root.on-socket .cv-svg, .cv-root.on-socket .cv-node,
.cv-root.linking .cv-svg, .cv-root.linking .cv-node { cursor: crosshair; }
.cv-draft { pointer-events: none; }
.cv-draft-path { fill: none; stroke: var(--ink); stroke-width: 2.25; stroke-opacity: 0.85; }
.cv-socket-halo {
  fill: var(--paper-alt); stroke: var(--ink); stroke-width: 1; stroke-opacity: 0.5; pointer-events: none;
  transform-box: fill-box; transform-origin: center; animation: cv-pulse 1.1s ease-in-out infinite;
}
@keyframes cv-pulse { 0%, 100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.5); opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .cv-socket-halo { animation: none; } }
.cv-node.link-no .cv-socket.in, .cv-node.link-no .cv-socket-label.in { opacity: 0.25; }
.cv-node.link-hot .cv-socket.in { fill: var(--ink); stroke: var(--ink); }
.cv-pop {
  position: absolute; z-index: 4; width: 21rem; max-width: calc(100% - 16px);
  background: var(--paper); border: 1px solid var(--ink); padding: 0.7rem 0.8rem;
  box-shadow: 0 4px 14px rgba(38, 34, 27, 0.14); user-select: text; -webkit-user-select: text;
}
.cv-pop-line { font-size: 0.86rem; color: var(--ink); line-height: 1.45; word-break: break-all; margin-bottom: 0.6rem; }
.cv-pop-field { display: block; }
.cv-pop-note { font-size: 0.8rem; }
.cv-pop-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.65rem; }
.cv-linkcard {
  position: absolute; z-index: 3; max-width: 22rem;
  font-size: 0.76rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong);
  padding: 0.35rem 0.6rem; box-shadow: 0 2px 8px rgba(38, 34, 27, 0.1);
}
.cv-linkcard.human { border-color: var(--ink); }
.cv-linkcard-assert { word-break: break-all; }
.cv-linkcard-hint { color: var(--ink-soft); margin-top: 0.1rem; }
.cv-linkcard-actions { display: flex; gap: 0.8rem; margin-top: 0.3rem; }
.cv-text-btn, .cv-status-action {
  font: inherit; font-size: 0.75rem; color: var(--ink); background: none; border: none; padding: 0;
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
}
.cv-text-btn:hover, .cv-status-action:hover { color: var(--ink); }
.cv-status.notice { color: var(--ink); background: var(--paper); border-color: var(--line-strong); }
.cv-status-action { margin-left: 0.6rem; }
.cv-ctx { top: auto; right: auto; z-index: 4; }
.cv-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; color: var(--ink-soft); font-size: 0.88rem; pointer-events: none; }
/* V5 (9.6 "Where it shows"): a link whose old judgment waits is drawn as
   the machine link it is now, plus a small ochre ring at its midpoint --
   never clay (a review is not a problem) and never invisible. */
.cv-review-mark { fill: var(--paper); stroke: var(--ochre); stroke-width: 1.75; }
.cv-tip.review, .cv-linkcard.review { border-color: var(--ochre); }
.cv-linkcard { max-width: 25rem; user-select: text; -webkit-user-select: text; }
.cv-linkcard-note {
  display: block; width: 100%; margin-top: 0.35rem; font: inherit; font-size: 0.75rem; color: var(--ink);
  background: var(--paper-alt); border: 1px solid var(--line-strong); border-radius: 0; padding: 0.15rem 0.4rem;
}
.cv-linkcard-note:focus { outline: 1px solid var(--ink); outline-offset: 1px; }
.cv-linkcard-actions { flex-wrap: wrap; }
.cv-linkcard-history { margin-top: 0.45rem; padding-top: 0.3rem; border-top: 1px solid var(--line); max-height: 13rem; overflow-y: auto; }
.cv-linkcard-history-title { color: var(--ink-soft); font-size: 0.75rem; margin-bottom: 0.1rem; }
.cv-hist { padding: 0.12rem 0; }
.cv-hist.cancelled .cv-hist-what { color: var(--ink-soft); text-decoration: line-through; }
.cv-hist-sub { color: var(--ink-soft); font-size: 0.75rem; word-break: break-all; }
.cv-notice {
  position: absolute; bottom: 44px; left: 12px; z-index: 2; max-width: min(30rem, calc(100% - 24px));
  font-size: 0.78rem; color: var(--ink); background: var(--clay-soft); border: 1px solid var(--clay); padding: 0.4rem 0.65rem;
}
.cv-notice .cv-notice-title { color: var(--clay); font-weight: 600; }

/* -- 路线图, the desk's route map (DESIGN.md 14.1, 14.2; drawn by routemap.js) --
   The attempts are the cards, toned by their verdict's status; the 「源自」
   lines are a human's lines (ink, 21.8); marks are quiet words. Its toolbar,
   chip and popover take 关系图's classes. */
.desk-map { position: relative; flex: 1; min-width: 0; }
.rm-root {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--paper); background-image: radial-gradient(circle, var(--line) 1px, transparent 1.2px);
}
.rm-root.panning { cursor: grabbing; }
.rm-root.linking, .rm-root.linking .rm-card { cursor: crosshair; }
.rm-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.rm-lines { position: absolute; left: 0; top: 0; overflow: visible; }
.rm-card {
  position: absolute; width: 232px; min-height: 88px; padding: 6px 14px 6px 11px; display: flex; flex-direction: column; gap: 2px;
  font-size: 13px; line-height: 22px; background: var(--paper-alt); border: 1px solid var(--line-strong);
  border-left: 3px solid var(--line-strong); border-radius: 6px; cursor: grab;
}
.rm-card.tone-olive { border-left-color: var(--olive); }
.rm-card.tone-ochre { border-left-color: var(--ochre); }
.rm-card.tone-clay { border-left-color: var(--clay); }
.rm-card.tone-gray { border-left-color: var(--gray); }
.rm-card:hover { box-shadow: 0 0 0 1px var(--ink-soft); }
.rm-card.selected, .rm-card.target { box-shadow: 0 0 0 2px var(--ink); }
.rm-card.marked { box-shadow: 0 0 0 2px var(--ochre); }
.rm-card.target { background: var(--paper); }
.rm-card.dragging { cursor: grabbing; box-shadow: 0 6px 14px rgba(38, 34, 27, 0.18); }
.rm-card.abandoned { background: var(--paper); opacity: 0.62; }
.rm-head, .rm-meta { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
/* A card's marks (14.1) are never cut (13.3: a longer English word wraps):
   they wrap to a second line, each whole -- one wider than the card wraps
   inside itself -- and the card grows (min-height). */
.rm-marks { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-width: 0; }
/* 21.1: a card whose attempt holds tasks says them under its status -- how many and how many are unfinished, a handback
   to open in ink and weight (the clay is for what is wrong, 21.8) -- and the first line of its latest handback. One line
   each, cut with an ellipsis; the hover title holds them whole. */
.rm-card.has-work { min-height: 100px; }
.rm-work, .rm-headline { display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 12px; line-height: 18px; color: var(--ink-soft); }
.rm-headline { display: block; text-overflow: ellipsis; color: var(--ink); }
.rm-tasks { flex: none; }
.rm-look { flex: none; font-weight: 600; color: var(--ink); }
/* 21.2: the handback line and 「等你看」 open that handback; the rest of the card opens the attempt. */
.rm-headline, .rm-look { cursor: pointer; }
.rm-headline:hover { text-decoration: underline; }
.rm-num { flex: none; font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
.rm-title { overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.rm-date { flex: none; font-size: 12px; color: var(--ink-soft); }
.rm-meta .status-label { flex: none; }
.rm-mark { flex: none; max-width: 100%; white-space: normal; font-size: 12px; line-height: 17px; color: var(--ink-soft); background: var(--paper); padding: 0 6px; }
.rm-handle {
  position: absolute; right: -7px; top: 37px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--paper); border: 1.5px solid var(--ink); cursor: crosshair;
}
.rm-handle:hover { background: var(--paper-alt); }
.rm-caption { position: absolute; font-family: var(--font-sans); font-size: 12px; line-height: 20px; color: var(--ink-soft); white-space: nowrap; pointer-events: none; }
.rm-line-hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
.rm-line-path { fill: none; stroke: var(--ink); stroke-width: 2.25; pointer-events: none; }
.rm-line.pending .rm-line-path { stroke-dasharray: 6 4; }
.rm-line.selected .rm-line-path { stroke-width: 3.5; }
.rm-line-dot { fill: var(--ink); pointer-events: none; }
.rm-line-label { font-family: var(--font-sans); font-size: 12px; fill: var(--ink); pointer-events: none;
  paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; } /* legible over the dashed line */
.rm-draft { fill: none; stroke: var(--ink); stroke-width: 2.25; stroke-opacity: 0.85; pointer-events: none; }
/* 提议新的尝试's 源自 (14.2): the official attempts, a short scrolling list. */
.parent-picks { display: flex; flex-direction: column; gap: 2px; max-height: 9rem; overflow-y: auto; padding: 4px 6px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.parent-pick { display: flex; align-items: baseline; gap: 6px; font-size: 0.85rem; color: var(--ink); }
.parent-pick .mono { color: var(--ink-soft); }
/* 新增尝试's 生成草稿 (16): the chosen files, then the model's draft. */
.attempt-draft { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.attempt-draft .form-actions { margin-top: 0.4rem; }
.attempt-draft .form-actions > .btn { flex: none; white-space: nowrap; } /* 加入 never wraps letter by letter */
.attempt-draft-where { font-size: 0.82rem; color: var(--ink-soft); margin: 0.4rem 0 0; overflow-wrap: anywhere; }
.attempt-draft-where.warn { color: var(--ink); border-left: 2px solid var(--ochre); padding-left: 0.6rem; }
.rm-pop-sub { margin: -0.3rem 0 0.55rem; font-size: 0.78rem; color: var(--ink-soft); }

/* -- V5: the human record's surfaces (DESIGN.md 9.3-9.6, task V5 phase 7) --
   Ochre = "waits for you" (待复核, a question), clay = "something is wrong",
   on the same tokens as everything else. */
.line-part { white-space: nowrap; }
.review-count-btn {
  font: inherit; font-size: inherit; color: var(--ink-soft); background: none; border: none; padding: 0;
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.review-count-btn.has { color: var(--ochre); font-weight: 600; }
.review-count-btn:hover { color: var(--ink); }
.review-tag {
  font: inherit; font-family: var(--font-sans); font-size: 0.75rem; line-height: 1.35; flex: none;
  color: var(--ochre); background: var(--ochre-soft); border: 1px solid var(--ochre); padding: 0 0.35rem; cursor: pointer;
}
.review-tag:hover { color: var(--ink); border-color: var(--ink); }

.notices { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
.notices:empty { display: none; }
body.canvas-mode .notices { margin: 0; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); max-height: 45vh; overflow-y: auto; }
.notice { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 0.85rem 1.1rem; font-size: 0.86rem; max-width: 780px; }
.notice.warn { border-color: var(--ochre); background: var(--ochre-soft); }
.notice.bad { border-color: var(--clay); background: var(--clay-soft); }
.notice-title { font-weight: 600; margin-bottom: 0.15rem; }
.notice.bad .notice-title, .state-note .notice-title { color: var(--clay); }
.notice p { margin: 0.3rem 0 0; color: var(--ink-soft); }
.notice-close { float: right; margin-left: 0.6rem; background: none; border: none; cursor: pointer; color: var(--ink-soft); font: inherit; font-size: 0.78rem; line-height: 1.4; padding: 0; white-space: nowrap; }
.notice-close:hover { color: var(--ink); }
.notice-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.7rem; align-items: center; }
.notice-status { font-size: 0.8rem; margin-top: 0.45rem; min-height: 1em; }
.notice-status.err { color: var(--clay); }
.notice-status.ok { color: var(--olive); }
.answer { display: flex; gap: 0.8rem; align-items: baseline; margin-top: 0.6rem; }
.answer .btn { flex: none; }
.answer-help { font-size: 0.8rem; color: var(--ink-soft); }
.fact-line { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.25rem; word-break: break-all; }
.mono { font-family: var(--font-mono); font-size: 0.78rem; }
.entry-list { list-style: none; margin: 0.45rem 0 0; padding: 0; max-height: 16rem; overflow-y: auto; }
.entry-list li { font-size: 0.8rem; padding: 0.25rem 0; border-bottom: 1px solid var(--line); }
.entry-list .entry-sub { color: var(--ink-soft); font-size: 0.75rem; word-break: break-all; }
.locate-row { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
.locate-row .form-input { flex: 1; min-width: 14rem; font-family: var(--font-mono); font-size: 0.8rem; }
.btn-small { font-size: 0.76rem; padding: 0.22rem 0.6rem; }
.btn:disabled { color: var(--ink-soft); cursor: default; border-color: var(--line); }

.review-intro { font-size: 0.8rem; color: var(--ink-soft); margin: 0 0 0.9rem; }
.review-item { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 0.75rem 0.9rem; margin-bottom: 0.8rem; }
.review-item.focus { border-color: var(--ochre); box-shadow: 0 0 0 2px var(--ochre-soft); }
.review-link { font-family: var(--font-mono); font-size: 0.82rem; word-break: break-all; }
.review-reason {
  display: inline-block; font-size: 0.75rem; color: var(--ochre); border: 1px solid var(--ochre);
  background: var(--ochre-soft); padding: 0 0.35rem; margin: 0.35rem 0 0.15rem;
}
.review-was { font-size: 0.82rem; margin: 0.25rem 0; }
.review-note { font-size: 0.8rem; color: var(--ink-soft); }
.basis-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
