// -- Auto-refresh (task V3 phase 2) -----------------------------------------
// GET /api/generation every 2s (matching the server watcher's own poll
// cadence). When the generation moved, the current view's data is
// re-fetched and re-rendered with UI state preserved: expanded rows stay
// expanded (the page keeps its scroll; a half-typed form is left alone), the active view stays
// active (only it re-fetches now; the hidden one is marked stale and
// reloads lazily on its next activation), and an open attempt panel is
// re-validated against the fresh data -- re-rendered if its record still
// exists, closed if the row was deleted from the map. A file panel is left
// as it stands: its preview is a point-in-time snapshot and yanking it
// mid-read would lose the user's scroll position for no gain.
//
// The chip states, in product language (the raw error string is folded
// onto the hover title): "正在重扫" while a rescan or re-fetch is in
// flight, a clay warning when the watcher's last re-ingest failed (a
// half-saved table, usually -- the next good save clears it), hidden
// otherwise. A failed generation poll itself is simply retried next tick,
// never surfaced as an error box: transient, and the page still shows
// consistent (if momentarily stale) data.

const REFRESH_POLL_MS = 2000;
const refreshChip = document.getElementById("refresh-chip");
let lastGeneration = null;
let refreshInFlight = false;
let pollTimer = null; // held so the 停止服务 flow (task V3 phase 4) can stop polling a dead server

// -- The poll rests while the window is hidden (DESIGN.md 18.4 item 3) -------
// A hidden window asks nothing: the interval is taken away when the window
// is hidden, and when it is shown again the poll runs at once (what moved
// meanwhile is read then) and the interval starts anew. `generationLive` is
// set when the page starts watching (init, below) and cleared by 停止服务,
// after which nothing starts the poll again.
let generationLive = false;

function startGenerationPoll() {
  if (pollTimer !== null || !generationLive || document.hidden) return;
  pollTimer = setInterval(pollGeneration, REFRESH_POLL_MS);
}

function stopGenerationPoll() {
  if (pollTimer !== null) clearInterval(pollTimer);
  pollTimer = null;
}

document.addEventListener("visibilitychange", () => {
  if (!generationLive) return;
  if (document.hidden) {
    stopGenerationPoll();
  } else if (pollTimer === null) {
    pollGeneration();
    startGenerationPoll();
  }
});

function showRefreshingChip() {
  refreshChip.classList.remove("hidden", "err");
  refreshChip.textContent = "地图有改动，正在重扫…";
  refreshChip.title = "";
}

// DESIGN.md section 8.10 rule 2: while a project state chip is showing,
// the refresh-failure chip is suppressed -- both are true, but one cause
// deserves one message, and the project state is the cause.
function hideRefreshChip() {
  refreshChip.classList.add("hidden");
  refreshChip.classList.remove("err");
  refreshChip.title = "";
}

function updateChipFromStatus(status) {
  // One cause, one message (8.10 rule 2): a project state, a move under the
  // page, or a pre-V5 index waiting for its migration (the new code cannot
  // rescan the old store; the banner says what to do) is the cause.
  const explained = state.projectState || state.projectMoved || (state.summary && state.summary.needs_migration);
  if (status.last_error && explained) {
    hideRefreshChip();
  } else if (status.last_error) {
    refreshChip.classList.remove("hidden");
    refreshChip.classList.add("err");
    refreshChip.textContent = "重扫失败，最新改动尚未同步";
    refreshChip.title = status.last_error;
  } else if (status.refreshing) {
    showRefreshingChip();
  } else {
    hideRefreshChip();
  }
}

// A panel that follows the record live is re-rendered here, whatever view
// is showing. (Since U3 an attempt opens its node page, which the refresh
// reloads itself.)
async function revalidatePanel() {
  const subject = state.panelSubject;
  if (!subject || panel.classList.contains("hidden")) return;
  // V5: the 待复核 list and the 记录 inventory follow the record live.
  if (subject.kind === "review") { await renderReviewPanel(subject); return; }
  if (subject.kind === "records") { await renderRecordsPanel(subject); return; }
  // V10 (14.3, 14.4): an attempt or a proposal opened on the desk, drawn again unless something is typed in it --
  // and only on the desk, whose payload it is drawn from.
  if (subject.kind === "desk-attempt" || subject.kind === "desk-proposal") {
    if (currentView === "desk") await RODesk.revalidatePanel(subject);
    return;
  }
}

async function refreshCurrentView() {
  if (state.noProject) return; // 10.1: nothing to refresh
  // Every view's data may have moved on disk; only the visible one
  // re-fetches now, the others are marked stale for their next showing.
  markViewsStale();
  if (currentView === "workspace") {
    await ROWorkspace.load(views.workspace, true);
  } else if (currentView === "desk") {
    await RODesk.loadDesk(views.desk, true);
  } else if (currentView === "node") {
    await RONode.loadNode(views.node, true);
  } else if (currentView === "results") {
    await RONode.loadResults(views.results, true);
  } else if (currentView === "proposals") {
    await ROTeam.loadProposals(views.proposals, true);
  } else if (currentView === "members") {
    await ROTeam.loadMembers(views.members, true);
  } else if (currentView === "lineage") {
    await loadLineageView(true);
  } else if (currentView === "canvas") {
    // Selection, camera, search and positions survive (RCECanvas.load
    // re-fetches /api/canvas and re-renders in place).
    await RCECanvas.load(views.canvas);
  } else if (currentView === "variables") {
    await loadVariablesView();
  } else if (currentView === "literature") {
    await loadLiteratureView();
  }
  await revalidatePanel();
  loadProjectSummary(); // the review count may have moved with the graph
  if (currentView !== "desk") RODesk.refreshSidebar(); // the desk's load refreshed it already
}

async function syncGeneration() {
  try {
    const status = await apiGet("/api/generation");
    lastGeneration = status.generation;
    updateChipFromStatus(status);
    updateScanChip(status);
  } catch (err) {
    // Leave lastGeneration as-is; the regular poll self-corrects.
  }
}

async function pollGeneration() {
  if (refreshInFlight) return; // never stack refreshes on a slow fetch
  let status;
  try {
    status = await apiGet("/api/generation");
  } catch (err) {
    return; // transient; retry on the next tick
  }
  updateScanChip(status);
  if (lastGeneration === null) {
    lastGeneration = status.generation;
    updateChipFromStatus(status);
    return;
  }
  if (status.generation === lastGeneration) {
    updateChipFromStatus(status);
    return;
  }
  lastGeneration = status.generation;
  refreshInFlight = true;
  showRefreshingChip();
  try {
    // The served project may have changed under this page (added, removed
    // or switched from another window): the menu's label and the
    // no-project page follow it.
    const wasNoProject = state.noProject;
    if (await loadProjects() === false) return;
    if (wasNoProject !== state.noProject) await reloadAllViews();
    else await refreshCurrentView();
  } finally {
    refreshInFlight = false;
    updateChipFromStatus(status);
  }
}

// -- The full scan's progress (DESIGN.md 10.2 step 3, 10.3; task V6) ----------
// From the generation poll's `scanning` / `last_scan`: 「正在扫描：<步骤>
// （n/m）」 while a scan runs; when one ends, a quiet 「扫描完成」 for a few
// seconds -- or 「扫描完成，有 N 个文件暂时读不了」 with the files named
// behind 「详情」, until dismissed (10.2: a failed read is not a failed
// addition) -- or, when it did not finish,
// its sentence with the engine's text behind 「详情」, until dismissed.
// The views themselves reload on the generation bump the scan's end makes.

const scanChip = document.getElementById("scan-chip");
const SCAN_DONE_MS = 6000;
let scanChipTimer = null;

function hideScanChip() {
  if (scanChipTimer !== null) { clearTimeout(scanChipTimer); scanChipTimer = null; }
  scanChip.classList.add("hidden");
  scanChip.classList.remove("done", "warn", "err");
  scanChip.textContent = "";
}

function resetScanChip(scanStarted) {
  hideScanChip();
  state.scanSeen = scanStarted ? null : undefined;
}

function updateScanChip(status) {
  if (!status || typeof status !== "object") return;
  const running = status.scanning && typeof status.scanning === "object" ? status.scanning : null;
  const last = status.last_scan && typeof status.last_scan === "object" ? status.last_scan : null;
  const finished = last && last.finished ? last.finished : null;
  if (state.scanSeen === undefined) state.scanSeen = running ? null : finished; // the baseline
  if (running) {
    if (scanChipTimer !== null) { clearTimeout(scanChipTimer); scanChipTimer = null; }
    scanChip.classList.remove("hidden", "done", "warn", "err");
    scanChip.textContent = scanProgressText(running);
    return;
  }
  if (finished && finished !== state.scanSeen) {
    state.scanSeen = finished;
    showScanDone(last);
    return;
  }
  // A running chip whose scan ended without a result this page can show.
  if (!scanChip.classList.contains("hidden") && !scanChip.classList.contains("done") &&
      !scanChip.classList.contains("warn") && !scanChip.classList.contains("err")) hideScanChip();
}

function showScanDone(last) {
  hideScanChip();
  scanChip.classList.remove("hidden");
  const unreadable = Array.isArray(last.unreadable_sources) ? last.unreadable_sources.length : 0;
  if (last.ok && !unreadable) {
    scanChip.classList.add("done");
    scanChip.textContent = scanDoneText(last);
    scanChipTimer = setTimeout(hideScanChip, SCAN_DONE_MS);
    return;
  }
  if (last.ok) {
    // 10.2: a failed read is not a failed addition -- but the files are
    // named (behind 「详情」), and the line stays until dismissed.
    scanChip.classList.add("warn");
    const text = mk("span", "err-text", scanDoneText(last));
    const files = unreadableFilesText(last.unreadable_sources) + cloudNotesText(last.cloud);
    const toggle = mkButton("详情", "err-detail-toggle has-chevron", null);
    toggle.setAttribute("aria-expanded", "false");
    const detail = mk("span", "err-detail hidden", files);
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = detail.classList.toggle("hidden") === false;
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    });
    const close = mkButton("关闭", "scan-chip-close", hideScanChip);
    close.setAttribute("aria-label", "关闭");
    close.title = "关闭";
    scanChip.append(text, toggle, detail, close);
    return;
  }
  scanChip.classList.add("err");
  const text = mk("span");
  const err = new Error(String(last.error || ""));
  renderBlockingError(text, scanDoneText(last), last.error ? err : null);
  const close = mkButton("关闭", "scan-chip-close", hideScanChip);
  close.setAttribute("aria-label", "关闭");
  close.title = "关闭";
  scanChip.append(text, close);
}

async function refreshScanStatus() {
  try {
    updateScanChip(await apiGet("/api/generation"));
  } catch (err) {
    /* the regular poll catches up */
  }
}

function renderGuideCard() {

// 12.11: a verdict is shown as a text status (现行 / 已放弃 / 待定 / 不利
//证据 / 被否 / 归档 / 其它) in a quiet tinted label, followed by the
// researcher's own words -- never the marker of their table. The engine
// maps marker to status (`verdict_status`, from attempts.toml's
// [verdict_labels] with the defaults); canvas.js colors frames by the same.
const VERDICT_TONES = {
  current: "olive", abandoned: "gray", pending: "ochre", adverse: "clay",
  rejected: "plain", archived: "plain", labelled: "plain", other: "plain",
};

function verdictTone(status) {
  const s = status && status.status;
  return Object.prototype.hasOwnProperty.call(VERDICT_TONES, s) ? VERDICT_TONES[s] : "plain";
}

// `status`: a payload's `verdict_status` ({status, label, words}).
function verdictLabel(status) {
  const span = document.createElement("span");
  span.className = "status-label tone-" + verdictTone(status);
  span.textContent = status && status.label ? status.label : "其它";
  return span;
}

// marked 「我的改动，尚未提交」 or 「提议中」 wherever it shows.

  if (!o || !o.label || o.state === "official") return null;

// -- Slide-out panel (shared by both views) --------------------------------------

const panel = document.getElementById("panel");
const panelBackdrop = document.getElementById("panel-backdrop");
const panelTitle = document.getElementById("panel-title");
const panelSubtitle = document.getElementById("panel-subtitle");
const panelBody = document.getElementById("panel-body");

// -- Panel resizing: local display preference, independent of project files and runs.
const endPanelResize = (() => {
  const handle = document.getElementById("panel-resizer"), key = "researchos.panel-width";
  let preferred = null, width = 560, drag = null;
  try {
    const saved = Number(window.localStorage.getItem(key));
    if (Number.isFinite(saved) && saved > 0) preferred = saved;
  } catch (err) { /* Site data may be unavailable. Resizing still works. */ }
  function apply(value) {
    const max = Math.max(1, window.innerWidth - 24), min = Math.min(320, max);
    width = Math.round(Math.max(min, Math.min(max, value)));
    panel.style.setProperty("--panel-width", width + "px");
    handle.setAttribute("aria-valuemin", String(min));
    handle.setAttribute("aria-valuemax", String(max));
    handle.setAttribute("aria-valuenow", String(width));
  }
  function remember() {
    preferred = width;
    try { window.localStorage.setItem(key, String(width)); } catch (err) { /* Convenience only. */ }
  }
  function move(event) {
    if (!drag || event.pointerId !== drag.id || !Number.isFinite(event.clientX)) return;
    event.preventDefault();
    apply(drag.width + drag.x - event.clientX);
  }
  function finish(save = true) {
    if (!drag) return;
    const id = drag.id; drag = null;
    document.body.classList.remove("panel-resizing");
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", cancel);
    window.removeEventListener("blur", cancel);
    if (handle.hasPointerCapture && handle.hasPointerCapture(id)) handle.releasePointerCapture(id);
    if (save) remember(); else apply(preferred || 560);
  }
  function up(event) {
    if (!drag || event.pointerId !== drag.id) return;
    move(event); finish();
  }
  function cancel() { finish(false); }
  handle.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || event.isPrimary === false || drag) return;
    event.preventDefault(); event.stopPropagation();
    handle.focus({ preventScroll: true });
    drag = { id: event.pointerId, x: event.clientX, width };
    document.body.classList.add("panel-resizing");
    window.addEventListener("pointermove", move, { passive: false });
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancel);
    window.addEventListener("blur", cancel);
    try { handle.setPointerCapture(event.pointerId); } catch (err) { /* Window listeners also track the drag. */ }
  });
  handle.addEventListener("lostpointercapture", cancel);
  handle.addEventListener("click", (event) => event.stopPropagation());
  handle.addEventListener("dblclick", (event) => {
    event.preventDefault(); preferred = null;
    try { window.localStorage.removeItem(key); } catch (err) { /* Convenience only. */ }
    apply(560);
  });
  handle.addEventListener("keydown", (event) => {
    const step = event.shiftKey ? 64 : 32;
    if (event.key === "ArrowLeft") apply(width + step);
    else if (event.key === "ArrowRight") apply(width - step);
    else if (event.key === "Home") apply(320);
    else if (event.key === "End") apply(window.innerWidth - 24);
    else return;
    event.preventDefault(); event.stopPropagation(); remember();
  });
  window.addEventListener("resize", () => apply(drag ? width : (preferred || 560)));
  apply(preferred || 560);
  return finish;
})();
// -- End panel resizing.

// -- Panel and 返回 (DESIGN.md 21.8) -------------------------------------------------
// Every panel that covers the page has the one scrim (#panel-backdrop, shown by openPanel; the desk keeps its map live beside an
// attempt's panel and hides it there, 14.3), and a panel opened from another panel says so: 返回 at the head of the panel opens the
// one it came from again -- fresh, for what was half typed in it was asked about when this one opened. The panel it leaves is read
// off the subject on screen (`state.panelSubject`); the subjects that cannot be opened again from what they hold carry a `reopen`.
const panelBackLink = document.getElementById("panel-back");
let panelOn = null;           // the subject the panel last opened for, while it is on screen
let panelReturning = false;   // 返回 was pressed: the panel it opens was not opened "from" the one it leaves
// The desk's own panels are where the others start (a card or a row opens them, and a way back from a handback leads to the attempt).
const PANEL_BASE = ["desk-attempt", "desk-proposal"];

// How to open `subject`'s panel again, or null when that cannot be done from what it holds.
function panelReopener(subject) {
  if (!subject || typeof subject !== "object") return null;
  if (typeof subject.reopen === "function") return subject.reopen;
  switch (subject.kind) {
    case "desk-attempt": return window.RODesk && RODesk.openAttemptAnywhere ? () => RODesk.openAttemptAnywhere(subject.id) : null;
    case "file": return () => openFilePanel(subject.path);
    case "settings": return () => openSettingsPanel();
    case "records": return () => openRecordsPanel();
    case "handback": return subject.report && window.ROWorkspace && ROWorkspace.openHandback ? () => ROWorkspace.openHandback(subject.report, { back: subject.back || null }) : null;
    default: return null;
  }
}

function sameSubject(a, b) {
  return a.kind === b.kind && (a.kind !== "file" || a.path === b.path);
}

function syncPanelBack() {
  const subject = state.panelSubject;
  // a handback keeps its own 返回 (to the attempt) in its body
  panelBackLink.classList.toggle("hidden", !(subject && !subject.back && typeof subject.backTo === "function"));
}

function openPanel() {
  const subject = state.panelSubject, visible = !panel.classList.contains("hidden"), before = panelOn, returned = panelReturning;
  panelReturning = false;
  if (subject && typeof subject === "object" && !Object.prototype.hasOwnProperty.call(subject, "backTo")) {
    let back = null;
    if (visible && before && before !== subject) {
      if (sameSubject(before, subject)) back = before.backTo || null;     // the same panel drawn again keeps its way back
      else if (!returned && PANEL_BASE.indexOf(subject.kind) < 0) back = panelReopener(before);
    }
    subject.backTo = back;
  }
  panelOn = subject || null;
  // 21.8: a panel's title is in the title font in both languages; the mono is for a file's path (the file panel's title)
  panelTitle.classList.toggle("path-title", !!(state.panelSubject && state.panelSubject.kind === "file"));
  panel.classList.remove("hidden");
  panelBackdrop.classList.remove("hidden");
  panel.setAttribute("aria-hidden", "false");
  // 21.8: a panel that opens with another subject starts at the top, whatever the last one was scrolled to. Only a shown panel
  // has a box to scroll, so this comes after `hidden` is gone; the subject on screen drawn again (the form's preview step) keeps
  // its place, and the redraws that do not come through here (a refresh of the records, an attempt's panel read again) keep theirs.
  if (!(visible && subject && before === subject)) panelBody.scrollTop = 0;
  syncPanelBack();
}

function closePanel() {
  if (window.ROWorkspace && ROWorkspace.mayLeavePanel && !ROWorkspace.mayLeavePanel()) return;
  endPanelResize();
  panel.classList.add("hidden");
  panelBackdrop.classList.add("hidden");
  panel.setAttribute("aria-hidden", "true");
  panelTitle.classList.remove("plain-title"); // a proposal's title is words, not a path
  state.panelSubject = null;
  panelOn = null;
  panelReturning = false;
  syncPanelBack();
}

// One panel at a time (14.3): an opener the frame offers on every screen asks
// before it takes the place of a panel holding half-typed text, as every
// opener inside the desk does (RODesk.mayLeavePanel; true when nothing is typed).
function mayReplacePanel() {
  // 返回 asked a moment ago and was told yes: the opener it calls does not ask again (kept on the function, which stands alone)
  if (Date.now() < (mayReplacePanel.answeredYesUntil || 0)) return true;
  if (window.ROWorkspace && ROWorkspace.mayLeavePanel && !ROWorkspace.mayLeavePanel()) return false;
  return !(window.RODesk && RODesk.mayLeavePanel) || RODesk.mayLeavePanel();
}

panelBackLink.addEventListener("click", () => {
  const subject = state.panelSubject, to = subject && subject.backTo;
  if (typeof to !== "function" || !mayReplacePanel()) return;
  // 返回 asked, and was told yes: the opener it calls does not ask again -- desk.js's openers ask too (RODesk.mayLeavePanel reads this
  // answer), and an attempt's panel opened from another page asks only when its read of the desk is done, so the answer stands until then
  mayReplacePanel.answeredYesUntil = Date.now() + 1500;
  panelReturning = true;
  // the opener declined or failed (nothing opened): the panel on screen is the one 返回 was pressed in, and a panel opened from it is
  // still "from" it, with its own 返回
  const unchanged = () => { if (state.panelSubject === subject) panelReturning = false; };
  let opened;
  try { opened = to(); } catch (err) { mayReplacePanel.answeredYesUntil = 0; unchanged(); throw err; }
  if (opened && typeof opened.then === "function") {
    mayReplacePanel.answeredYesUntil = Date.now() + 15000;
    const settled = () => { mayReplacePanel.answeredYesUntil = 0; unchanged(); };
    opened.then(settled, (err) => { settled(); throw err; });
  } else if (opened === null) {
    unchanged();
  }
});
// -- end of panel and 返回 ---------------------------------------------------------

document.getElementById("panel-close").addEventListener("click", closePanel);
// A field typed in: the desk asks before anything takes the panel's place (14.3).
panelBody.addEventListener("input", (e) => { if (e.target && e.target.dataset) e.target.dataset.typed = "1"; });
// The scrim is a dimmed page a stray click can reach: half-typed words are asked about as when another panel takes the place (14.3, 21.8).
panelBackdrop.addEventListener("click", () => {
  if (window.RODesk && RODesk.mayLeavePanel && !RODesk.mayLeavePanel()) return;
  closePanel();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !panel.classList.contains("hidden")) closePanel();
});

const FILE_TYPE_RULES = [
  [/\.docx$/i, "Word 文档"],
  [/\.(py|r|rmd|jl|ipynb|sh|do|ado)$/i, "脚本"],
  [/\.(csv|tsv|json|parquet|dta|rds|rda|pkl|feather|h5|hdf5)$/i, "数据集"],
  [/\.(png|jpe?g|pdf|svg|eps|gif|tiff?)$/i, "图表"],
  [/\.(md|txt|tex|bib|rst)$/i, "文本 / 文档"],
  [/\.(toml|yaml|yml|ini|cfg)$/i, "配置"],
];

function classifyFileType(path, hint) {
  if (hint === "script") return "脚本";
  for (const [pattern, label] of FILE_TYPE_RULES) if (pattern.test(path)) return label;
  return "文件";
}

function codePreview(content) {
  const wrap = document.createElement("div");
  wrap.className = "code-preview";
  const table = document.createElement("table");
  table.className = "code-table";
  const lines = content.split("\n");
  table.innerHTML = lines.map((line, i) =>
    "<tr><td class=\"ln\">" + (i + 1) + "</td><td class=\"src\">" + escapeHtml(line) + "</td></tr>"
  ).join("");
  wrap.appendChild(table);
  return wrap;
}

async function runOpenAction(path, reveal, statusEl) {
  statusEl.className = "panel-status";
  statusEl.textContent = "处理中…";
  try {
    const result = await apiPost("/api/open", { path, reveal });
    statusEl.className = "panel-status ok";
    statusEl.textContent = (reveal ? "已在 Finder 中显示：" : "已打开：") + result.opened;
    statusEl.title = "";
  } catch (err) {
    statusEl.className = "panel-status err";
    // 8.8 "Errors": Chinese framing up front, the engine's text behind 「详情」.
    renderBlockingError(statusEl, reveal ? "无法在 Finder 中显示" : "无法打开", err);
  }
}

function buildFileActions(path, statusEl) {
  const actions = document.createElement("div");
  actions.className = "panel-actions";
  const openBtn = document.createElement("button");
  openBtn.className = "btn";
  openBtn.type = "button";
  openBtn.textContent = t("打开");
  const revealBtn = document.createElement("button");
  revealBtn.className = "btn";
  revealBtn.type = "button";
  revealBtn.textContent = t("在 Finder 中显示");
  openBtn.addEventListener("click", () => runOpenAction(path, false, statusEl));
  revealBtn.addEventListener("click", () => runOpenAction(path, true, statusEl));
  actions.append(openBtn, revealBtn);
  return actions;
}

// -- A Stata .dta file in the panel (DESIGN.md 15.4) --
// Rows by variables and the variable table (name, label, type), from the
// file's header. Names and labels are the file's own, untrusted text: set
// with textContent only, never markup.
const DTA_SHOWN = 2000;

function dtaPreview(info) {
  const wrap = mk("div", "dta-preview");
  const vars = Array.isArray(info.variables) ? info.variables : [];
  const en = uiLang() === "en";
  const rows = t("{n} 行", { n: en ? groupedNumber(info.rows) : info.rows });
  wrap.appendChild(mk("p", "dta-shape", t("{rows} × {n} 个变量", { rows: rows, n: en ? groupedNumber(vars.length) : vars.length })));
  if (info.label) wrap.appendChild(mk("p", "dta-label", t("数据集标签：{label}", { label: info.label })));
  const table = mk("table", "dta-table");
  const head = mk("tr");
  [t("变量名"), t("标签"), t("类型")].forEach((word) => head.appendChild(mk("th", null, word)));
  table.appendChild(head);
  vars.slice(0, DTA_SHOWN).forEach((v) => {
    const tr = mk("tr");
    tr.appendChild(mk("td", "dta-name", String(v.name == null ? "" : v.name)));
    tr.appendChild(mk("td", "dta-label-cell", String(v.label == null ? "" : v.label)));
    tr.appendChild(mk("td", "dta-type", String(v.type == null ? "" : v.type)));
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  if (vars.length > DTA_SHOWN) {
    wrap.appendChild(mk("p", "truncated-note", t("只列出了前 {n} 个变量", { n: en ? groupedNumber(DTA_SHOWN) : DTA_SHOWN })));
  }
  return wrap;
}

function isCurrentFilePanel(path) {
  const s = state.panelSubject;
  return !!s && s.kind === "file" && s.path === path;
}

function docxPreview(data) {
  const wrap = mk("div", "word-preview");
  wrap.appendChild(mk("p", "preview-format-note", t("正文与表格预览。图片、公式和完整排版请点击“打开”查看。")));
  if (data.truncated) wrap.appendChild(mk("p", "truncated-note", t("文档较长，仅显示部分内容。点击“打开”查看全文。")));
  const blocks = data.blocks || [];
  blocks.forEach((block) => {
    if (block.kind === "table") {
      const box = mk("div", "word-table-wrap");
      const table = mk("table", "word-table");
      (block.rows || []).forEach((row) => {
        const tr = mk("tr");
        row.forEach((cell) => tr.appendChild(mk("td", null, cell)));
        table.appendChild(tr);
      });
      box.appendChild(table); wrap.appendChild(box);
    } else {
      const heading = block.kind === "heading" ? Math.max(1, Math.min(6, Number(block.level) || 1)) : 0;
      wrap.appendChild(mk(heading ? "h" + heading : "p", null, block.text || ""));
    }
  });
  if (!blocks.length) wrap.appendChild(mk("p", "empty-note", t("文档中没有可预览的正文文字。请点击“打开”查看原文件。")));
  return wrap;
}

async function openFilePanel(path, hint) {
  state.panelSubject = { kind: "file", path: path };
  panelTitle.textContent = path;
  panelTitle.title = "";
  panelSubtitle.textContent = t(classifyFileType(path, hint));
  panelBody.innerHTML = "";
  const status = document.createElement("div");
  status.className = "panel-status";
  panelBody.appendChild(buildFileActions(path, status));
  const githubHost = document.createElement("div");
  panelBody.appendChild(githubHost);
  panelBody.appendChild(status);
  const contentHost = document.createElement("div");
  contentHost.innerHTML = '<p class="empty-note">预览载入中…</p>';
  panelBody.appendChild(contentHost);
  openPanel();

  let data;
  try {
    data = await apiGet("/api/file?path=" + encodeURIComponent(path));
  } catch (err) {
    if (!isCurrentFilePanel(path)) return;
    renderGitHubLink(githubHost, err && err.github);
    if (err && err.state === "docx_refused") {
      contentHost.innerHTML = "";
      const box = mk("div", "panel-status err");
      renderBlockingError(box, err.engineMessage || t("无法预览这份 Word 文档。请点击“打开”检查原文件。"), err);
      contentHost.appendChild(box);
      return;
    }
    if (err && (err.state === "preview_unsupported" || (!err.state && err.status === 415))) {
      contentHost.replaceChildren(mk("p", "empty-note", t("此文件格式暂不支持预览。请点击“打开”，用默认应用查看。")));
      return;
    }
    if (err && err.state === "dta_refused") {
      // 15.4: a .dta file the header reader refused -- the engine's sentence
      // in the page's language, the reader's account behind 「详情」.
      contentHost.innerHTML = "";
      const box = mk("div", "panel-status err");
      renderBlockingError(box, err.engineMessage || t("无法读取这个 .dta 文件"), err);
      contentHost.appendChild(box);
      return;
    }
    if (err && err.messageZh) {
      // 11.1: a file only in the cloud -- the sentence, the engine's text behind 「详情」.
      contentHost.innerHTML = "";
      const box = mk("div", "panel-status err");
      renderBlockingError(box, "无法读取这个文件", err);
      contentHost.appendChild(box);
      return;
    }
    renderErrorBox(contentHost, err);
    return;
  }
  if (!isCurrentFilePanel(path)) return;
  renderGitHubLink(githubHost, data.github);
  contentHost.innerHTML = "";
  if (data.kind === "dta") {
    contentHost.appendChild(dtaPreview(data.dta || {}));
    return;
  }
  if (data.kind === "docx") {
    contentHost.appendChild(docxPreview(data));
    return;
  }
  if (data.truncated) {
    const note = document.createElement("div");
    note.className = "truncated-note";
    note.textContent = "只显示了开头 " + data.content.length + " 个字符，文件共 " + data.size + " 字节（已截断）。";
    contentHost.appendChild(note);
  }
  contentHost.appendChild(codePreview(data.content));
}

// -- Attempt edit form (task V3 phase 3) ------------------------------------
// One form for both "＋ 新增尝试" (append) and an attempt panel's 编辑
// (update), rendered into the same slide-out panel. Two-step by design:
// submit only ever calls POST /api/attempts/preview (a pure dry run) and
// shows the old/new row; the write happens exclusively on the explicit
// confirm click. Update mode submits ONLY dirty fields -- prefills come
// from the parser's *cleaned* values, so re-writing an untouched cell
// would silently strip the user's own markdown decoration from it.

const EDITABLE_KEYS = ["date", "description", "variables", "result", "verdict"];

// -- Attempt records: one loader, one freshness rule -------------------------
// state.attemptsById (full records, from /api/attempts) and
// state.attemptsConfig (the map file and its column names, from
// /api/summary) are read by the attempt panel and by this form, and the
// form can be opened from any view: the header button and the native
// menu's 新增尝试 work on 画布 and 血缘 too, where nothing has loaded the
// records (verifier finding on 53c61a7: a page that reopened on 画布 built
// the form from an empty map -- number 1, a full date in an MM-DD table,
// no verdict choices). So ensureAttemptData() re-reads BOTH, every time,
// before the form is built. It used to skip the read when the server's
// generation counter had not moved since the last one (a038210), but that
// counter is not a reliable "the graph changed" signal (verifier finding on
// a038210): a CLI `researchos attempts` / `researchos ingest` while the server is up, or
// a server restart that starts counting again from 1, changes the records
// without moving it, and the form then proposed a number that already
// exists and left out new verdict choices. Two small requests per form
// opening cost nothing a researcher can notice.
// Everything from here to toCellText is loaded into node by
// tests/test_webapp_canvas_js.py; the first two functions are pure.

// `attempts`: any iterable of /api/attempts records.
function defaultNewNumber(attempts) {
  // Task spec: max existing top-level number + 1 ("14a" counts as 14).
  let max = 0;
  for (const a of attempts) {
    const n = parseInt((a.attrs && a.attrs.number) || "", 10);
    if (!isNaN(n) && n > max) max = n;
  }
  return String(max + 1);
}

function defaultDateValue(attempts, now) {
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");
  // Match the format the table already uses: any existing bare "MM-DD"
  // row makes new rows follow suit; otherwise full "YYYY-MM-DD".
  let short = false;
  for (const a of attempts) {
    if (/^\d{2}-\d{2}/.test((a.attrs && a.attrs.date) || "")) short = true;
  }
  return short ? mm + "-" + dd : now.getFullYear() + "-" + mm + "-" + dd;
}

// The ONE path that fills state.attemptsById (the tree view loads through
// it too). Resolves true when the records were stored, false when the
// project was switched while the request was out (they are dropped);
// rejects when /api/attempts failed.
async function fetchAttemptRecords() {
  const epoch = state.dataEpoch;
  const data = await apiGet("/api/attempts");
  if (epoch !== state.dataEpoch) return false;
  state.attemptsById = new Map((data.attempts || []).map((a) => [a.id, a]));
  state.attemptStatuses = data.statuses || [];
  return true;
}

// The ONE path that fills state.attemptsConfig (the header's summary line
// reads through it too). Resolves the /api/summary body, or null when the
// project was switched meanwhile.
async function fetchSummary() {
  const epoch = state.dataEpoch;
  const data = await apiGet("/api/summary");
  if (epoch !== state.dataEpoch) return null;
  state.attemptsConfig = data.attempts_config || null;
  return data;
}

// Re-reads the records and the config (both, always -- see above).
// Resolves true when both are current, false when a project switch
// overtook it; rejects with the fetch's error.
async function ensureAttemptData() {
  const epoch = state.dataEpoch;
  const results = await Promise.all([
    fetchAttemptRecords(),
    fetchSummary().then((d) => d !== null),
  ]);
  return epoch === state.dataEpoch && results.every(Boolean);
}

function toCellText(value) {
  // The exact inverse of the server parser's <br> handling (its cell
  // cleanup turns a literal <br> into "\n" when reading): a newline typed
  // -- or carried in from a prefilled multi-line cell -- goes back out as
  // "<br>", since a markdown table cell cannot hold a raw newline and the
  // server rejects one outright. Normalized FIRST is the full set of
  // characters Python's str.splitlines() treats as line boundaries (the
  // server's _LINE_BOUNDARY_CHARS), not just \r\n: U+2028 rides along
  // invisibly in text pasted from PDFs and \x0b is PowerPoint's soft line
  // break, and any of them left through would be refused server-side --
  // here they just become the same <br> a typed newline becomes.
  return value.replace(/\r\n?/g, "\n")
    .replace(/[\v\f\x1c\x1d\x1e\x85\u2028\u2029]/g, "\n")
    .split("\n").map((s) => s.trim()).join("<br>")
    .replace(/^(<br>)+|(<br>)+$/g, "").trim();
}

function formFieldEl(labelText, inputEl) {
  const wrap = document.createElement("div");
  wrap.className = "form-field";
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.append(label, inputEl);
  return wrap;
}

// `err` (optional): the engine failure behind it, shown through the shared
// blocking-error helper -- the Chinese sentence, the raw text behind 「详情」.
function panelErrorBoxCn(message, err) {
  const box = document.createElement("div");
  box.className = "error-box";
  const title = document.createElement("div");
  title.className = "error-title";
  title.textContent = t("无法打开尝试表单");
  const msg = document.createElement("div");
  if (err) renderBlockingError(msg, message, err);
  else msg.textContent = message;
  box.append(title, msg);
  return box;
}

function setFormStatus(statusEl, cls, cnText, err) {
  // Product language up front -- the specific sentence when the engine named
  // the cause (a duplicate number, ...) -- and the raw technical message one
  // click away behind 「详情」 (8.8 "Errors").
  statusEl.className = "panel-status " + cls;
  if (err) {
    renderBlockingError(statusEl, cnText, err);
    return;
  }
  statusEl.textContent = cnText;
  statusEl.title = "";
}

// Every way into the form -- 「＋ 新增尝试」, the native menu's 新增尝试,
// an attempt panel's 编辑 -- comes through here, and the form's defaults
// (next number, date format, verdict choices) and an edit's prefill are
// derived only after ensureAttemptData() has made the records and the
// config current. Meanwhile the panel says 载入中…; a failure is said in
// Chinese with the engine's text behind 「详情」, never an empty form with
// wrong defaults.
async function openAttemptForm(mode, attemptId, researchSource) {
  if (state.noProject) return; // 10.1: no project, no attempt table (⌘N from the shell)
  const subject = { kind: "attempt-form", researchSource: mode === "append" ? researchSource : null };
  subject.reopen = () => openAttemptForm(mode, attemptId, researchSource);   // 返回 from a panel opened from this form (21.8)
  const project = state.currentPath, epoch = state.dataEpoch;
  state.panelSubject = subject;
  panelTitle.textContent = mode === "append" ? t("新增尝试") : t("编辑尝试");
  panelTitle.title = "";
  panelSubtitle.textContent = "";
  panelBody.innerHTML = '<p class="empty-note">载入中…</p>';
  openPanel();
  let ready = false;
  let failure = null;
  try {
    // U4: who I am in this project decides whether the form writes the
    // table (one person, the PI) or proposes (a member); never throws.
    await RODesk.ensureContext();
    ready = await ensureAttemptData();
    if (ready && state.panelSubject === subject && mode === "append" && !state.attemptsConfig) {
      await apiPost("/api/attempts/initialize", { project });
      if (epoch !== state.dataEpoch || state.panelSubject !== subject) return;
      ready = await ensureAttemptData();
    }
  } catch (err) {
    ready = false;
    failure = err;
  }
  if (state.panelSubject !== subject) return; // closed, replaced, or the project switched
  if (!ready) {
    panelBody.innerHTML = "";
    panelBody.appendChild(failure
      ? panelErrorBoxCn(t("无法读取或创建尝试记录，请查看错误详情。"), failure)
      : panelErrorBoxCn("项目刚刚切换，请重新打开表单。"));
    return;
  }
  renderAttemptForm(mode, attemptId);
}

// -- 「根据所选文件生成草稿」 (DESIGN.md 16) ------------------------------------
// The model drafts the description and the result of a new row from the
// files the researcher picks, into the cells still empty; nothing else, and
// nothing is written until the form's own preview. Every word goes through
// t() (13.6).

// 16.2: the language a draft is written in, read from the table itself: of
// the last 5 rows, those with a description or a result; at least half of
// them holding Chinese is "zh", none is "en"; otherwise (or with no such
// row) null, and the model writes in the files' own language.
function draftLanguage(attempts) {
  const rows = attempts.slice(-5)
    .map((a) => ((a.attrs || {}).description || "") + " " + (a.result || ""))
    .filter((s) => s.trim());
  if (!rows.length) return null;
  const chinese = rows.filter((s) => /[㐀-䶿一-鿿豈-﫿]/.test(s)).length;
  if (chinese * 2 >= rows.length) return "zh";
  return chinese === 0 ? "en" : null;
}

// What became of each cell (16.1), in the form's order, one whole sentence
// each (13.6: never pieces glued into one): `outcome[cell]` is "filled",
// "kept" (the researcher's own text, untouched) or the engine's reason for
// dropping the draft's cell ("empty", "no_source", "unknown_source",
// "unsupported_number"). `names` are the form's own column labels.
function draftOutcomeText(outcome, names, cut) {
  const said = ["description", "result"].map((k) => {
    const v = { cell: names[k] };
    switch (outcome[k]) {
      case "filled": return t("已填入「{cell}」。", v);
      case "kept": return t("「{cell}」原本有内容，没有改。", v);
      case "no_source": return t("「{cell}」留空：模型没有指出依据的文件。", v);
      case "unknown_source": return t("「{cell}」留空：模型引了没有选的文件。", v);
      case "unsupported_number": return t("「{cell}」留空：草稿里有所选文件中找不到的数字。", v);
      default: return t("文件里看不出「{cell}」，留空。", v);
    }
  });
  if (cut) said.push(t("较长的文件只读了开头。"));
  return said.join(" ");
}

// A refused draft in words (16.2, 8.8): the file it names as typed, or the
// remedy; the server's own text stays behind 「详情」.
function draftErrorText(err) {
  const v = { file: (err && err.file) || "" };
  switch (err && err.state) {
    case "draft_model_failed": return t("没能从模型得到草稿：请确认 LM Studio 的本地服务已启动、模型已载入");
    case "draft_too_long": return t("所选文件超出了模型一次能读的长度：在 LM Studio 里用更大的上下文长度重新载入模型，或少选几个文件");
    case "draft_file_missing": return t("项目里找不到 {file}", v);
    case "draft_file_not_text": return t("{file} 不是文本文件，模型读不了", v);
    case "draft_file_cloud_only": return t("{file} 还在云端，没有下载到这台 Mac", v);
    case "draft_file_outside": return t("{file} 不在这个项目里", v);
    case "draft_file_unreadable": return t("没能读取 {file}", v);
    case "draft_too_many_files": return t("一次最多选 5 个文件");
    case "draft_no_files": return t("先选至少一个文件");
    default: return t("没能生成草稿");
  }
}

// 12.13: a disclosure's quiet line chevron, the one node.js draws -- parsed
// from markup, so the page names no namespace address.
function chevronIcon() {
  const tpl = document.createElement("template");
  tpl.innerHTML = '<svg class="res-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 4l4 4-4 4"></path></svg>';
  return tpl.content.firstChild;
}

// 12.13, 21.8: the summary of every <details> -- the chevron and the words, in `res-draft-summary`, which hides the browser's
// triangle; `cls` adds the disclosure's own class. A toggle that is not a <details> (the 「详情」 of a refusal) takes the class
// `has-chevron`, which draws the same shape in CSS and turns it with aria-expanded.
function chevronSummary(label, cls) {
  const summary = mk("summary", "res-draft-summary" + (cls ? " " + cls : ""));
  summary.append(chevronIcon(), mk("span", null, label));
  return summary;
}

// The block on 新增尝试 / 提议新的尝试. Returns { el, setFrozen, markWritten }:
// the form freezes it with everything else while a preview is made or
// stands, and for good once a member's row is written (16.1).
function attemptDraftBlock(inputs, attempts, proposing, columns) {
  const box = mk("div", "attempt-draft");
  const chosen = [];
  let frozen = false, busy = false, ready = false, written = false;
  const names = { description: columns.description || t("描述"), result: columns.result || t("结果") };
  const list = mk("div", "verdict-chips");
  const pathInput = mk("input", "form-input form-mono");
  pathInput.placeholder = t("项目里的文件路径，例如 code/run.py");
  const options = mk("datalist");
  options.id = "attempt-draft-files";
  pathInput.setAttribute("list", options.id);
  // The canvas's file paths as suggestions, asked on focus until one answer arrives.
  let suggested = false, asking = false;
  pathInput.addEventListener("focus", async () => {
    if (suggested || asking) return;
    asking = true;
    try {
      const c = await apiGet("/api/canvas?scope=all");
      // Only files a draft can read (16.2): no figure, no missing file, no binary data file.
      const readable = (n) => n.path && n.type !== "figure" && !n.missing && !n.ghost && !/\.(dta|xlsx?|parquet|rds)$/i.test(n.path);
      Array.from(new Set((c.nodes || []).filter(readable).map((n) => n.path))).sort().forEach((p) => {
        const o = mk("option");
        o.value = p;
        options.appendChild(o);
      });
      suggested = true;
    } catch (err) { /* no suggestions this time; a typed path still works */ }
    asking = false;
  });
  const status = mk("div", "panel-status");
  // 16.2: where a draft goes, always in view beside 生成草稿.
  const where = mk("div", "attempt-draft-where");
  const addBtn = mkButton(t("加入"), "btn btn-small", add);
  const go = mkButton(t("生成草稿"), "btn btn-small", draft);
  // 21.7: the model server is set on the 设置 page; this block reads the setting to say where a draft goes, and links there.
  const settingLine = mk("div", "attempt-draft-setting-link");
  settingLine.appendChild(settingsPageLink("llm"));
  async function readSetting() {
    let s;
    try {
      s = await apiGet("/api/settings/llm");
    } catch (err) {
      ready = false;
      setFormStatus(where, "err", t("没能读到模型设置，先不能起草"), err);
      sync();
      return;
    }
    ready = true;
    where.className = "attempt-draft-where" + (s.where === "this_mac" ? "" : " warn");
    where.title = "";
    where.textContent = s.where === "this_mac"
      ? t("本地模型：{model}", { model: s.model })
      : t("所选文件将发送至 {host} · 模型：{model}", { host: s.host, model: s.model });
    sync();
  }
  function sync() {
    go.disabled = frozen || busy || !ready;
    pathInput.disabled = frozen;
    addBtn.disabled = frozen;
    Array.from(list.children).forEach((chip) => { chip.disabled = frozen; });
  }
  function drawChosen() {
    list.innerHTML = "";
    chosen.forEach((p, i) => list.appendChild(mkButton(t("{path} 去掉", { path: p }), "chip", () => { chosen.splice(i, 1); drawChosen(); })));
    // The chosen files are chips, not typed words, but a panel opened over this form drops them: for the leave guard (14.3, desk.js
    // halfTyped, which counts a typed field that differs from its start) the path field differs from its start while any is chosen.
    pathInput.dataset.initial = chosen.join("\n");
    if (chosen.length) pathInput.dataset.typed = "1";
    sync();
  }
  // The path in the field joins the chosen files; false when it was refused (a sixth file).
  function add() {
    const p = pathInput.value.trim().replace(/^\.\//, "");
    if (!p) return true;
    if (chosen.indexOf(p) < 0) {
      if (chosen.length >= 5) { setFormStatus(status, "err", t("一次最多选 5 个文件")); return false; }
      chosen.push(p);
    }
    pathInput.value = "";
    drawChosen();
    return true;
  }
  // Enter adds the path, except the Enter that ends an input method's composition.
  pathInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); add(); }
  });
  async function draft() {
    if (!add()) return; // a path picked from the suggestions, or typed, without 加入 is chosen too
    if (!chosen.length) { setFormStatus(status, "err", t("先选至少一个文件")); return; }
    busy = true;
    sync();
    setFormStatus(status, "", t("正在请模型起草…可能要等一两分钟"));
    const body = { files: chosen.slice() };
    const language = draftLanguage(attempts);
    if (language) body.language = language;
    try {
      fill(await apiPost("/api/attempts/draft", body));
    } catch (err) {
      setFormStatus(status, "err", draftErrorText(err), err);
    }
    busy = false;
    sync();
  }
  function fill(d) {
    // 16.1: a draft that arrives while the preview is made or stands is not put into the frozen form.
    if (written) { setFormStatus(status, "", t("这一行已经写进工作副本，草稿没有用上")); return; }
    if (frozen || inputs.description.disabled) {
      setFormStatus(status, "err", t("预览已经生成，草稿没有填入：先返回修改，再生成草稿"));
      return;
    }
    const outcome = {};
    ["description", "result"].forEach((k) => {
      const cell = (d.fields || {})[k] || {}, input = inputs[k];
      if (input.value.trim()) { outcome[k] = "kept"; return; }
      if (!cell.text) { outcome[k] = (d.dropped || {})[k] || "empty"; return; }
      input.value = cell.text;
      input.dataset.typed = "1"; // the leave guard (14.3) asks before a draft is dropped, as for typed words
      const v = { model: d.model, files: (cell.sources || []).join(t("、")) };
      const note = mk("div", "team-help", t("模型：{model} · 参考文件：{files}", v));
      input.after(note);
      input.addEventListener("input", () => note.remove(), { once: true });
      outcome[k] = "filled";
    });
    setFormStatus(status, Object.values(outcome).indexOf("filled") >= 0 ? "ok" : "",
      draftOutcomeText(outcome, names, (d.cut || []).length > 0));
  }
  const pick = mk("div", "form-actions");
  pick.append(pathInput, options, addBtn);
  const field = formFieldEl(t("辅助填写"), pick);
  field.append(list, mk("div", "team-help",
    t("仅填写空白的「{description}」和「{result}」。", names)));
  const actions = mk("div", "form-actions");
  actions.appendChild(go);
  box.append(field, where, settingLine, actions, status);
  sync();
  readSetting();
  return { el: box, setFrozen(f) { frozen = f; sync(); }, markWritten() { written = frozen = true; sync(); } };
}

// Builds the form from the (now current) records and config.
function renderAttemptForm(mode, attemptId) {
  panelTitle.title = "";
  panelBody.innerHTML = "";
  const attempts = Array.from(state.attemptsById.values());
  const config = state.attemptsConfig;
  if (!config) {
    panelTitle.textContent = mode === "append" ? t("新增尝试") : t("编辑尝试");
    panelSubtitle.textContent = "";
    panelBody.appendChild(panelErrorBoxCn(
      t("尝试记录的配置无法读取，请检查或恢复项目中的配置文件。")
    ));
    openPanel();
    return;
  }
  const record = mode === "update" ? state.attemptsById.get(attemptId) : null;
  if (mode === "update" && !record) {
    panelTitle.textContent = "编辑尝试";
    panelSubtitle.textContent = "";
    panelBody.appendChild(panelErrorBoxCn("尝试表里已经没有这条尝试了，可能刚在文件里被改掉。"));
    openPanel();
    return;
  }
  const formProject = state.currentPath, formEpoch = state.dataEpoch, formSubject = state.panelSubject;
  const researchSource = state.panelSubject && state.panelSubject.researchSource;
  const prefill = researchSource && researchSource.prefill || {};
  const attrs = record ? (record.attrs || {}) : {};
  const number = mode === "append" ? defaultNewNumber(attempts) : (attrs.number || "");
  // 12.3, 12.4 (U4): in a project with members a member's new attempt or
  // verdict is a proposal: the row is first written into their own working
  // copy (their own change, not official), then the proposal is shown as
  // the engine's dry run and sent only on 发送提议. Someone not in the
  // team yet cannot propose.
  const role = ROTeam.mode();
  const proposing = role === "member";
  if (role === "none") {
    panelTitle.textContent = mode === "append" ? "提议新的尝试" : "提议修改研究判断";
    panelSubtitle.textContent = "";
    panelBody.appendChild(mk("p", "desk-alone", "你还不是这个项目的成员：请 PI 把你加入团队，然后同步"));
    openPanel();
    return;
  }
  panelTitle.textContent = proposing ? (mode === "append" ? t("提议新的尝试") : t("提议修改研究判断 #{number}", { number }))
    : (mode === "append" ? t("新增尝试") : t("编辑尝试 #{number}", { number }));
  // 21.3: the file it writes is under 「详情」 at the foot of the form, not a line of its own at the top.
  panelSubtitle.textContent = proposing ? t("先写进你的工作副本，再生成提议；PI 批准以后才进入正式版本") : "";

  const form = document.createElement("form");
  form.className = "attempt-form";
  const inputs = {};
  const initial = {};
  let sentenceInput = null;
  let reasonInput = null;

  const numberInput = document.createElement("input");
  numberInput.className = "form-input form-mono";
  numberInput.value = number;
  if (mode === "update") {
    // The number is the row's identity (the graph node id derives from
    // it) -- renumbering is a hand edit in the file, not a cell update.
    numberInput.disabled = true;
    numberInput.title = "编号是这一行的身份，界面里不改；如需重编号请直接改源文件";
  }
  form.appendChild(formFieldEl(t("编号"), numberInput));
  if (proposing) {
    sentenceInput = document.createElement("textarea");
    sentenceInput.className = "form-textarea";
    sentenceInput.rows = 2;
    sentenceInput.placeholder = "用你自己的话说明这份提议：PI 会先看到这句话";
    form.appendChild(formFieldEl("一句话说明（必填）", sentenceInput));
  }
  // 16: a new row may start from a draft of its description and result.
  const draftBlock = mode === "append" ? attemptDraftBlock(inputs, attempts, proposing, config.columns) : null;

  // 21.3: 日期, and the table's own header only when it names the column differently (not 「日期（日期）」).
  const dateColumn = config.columns.date ? String(config.columns.date).trim() : "";
  const dateLabel = !dateColumn || [t("日期"), "日期", "Date"].some((w) => w.toLowerCase() === dateColumn.toLowerCase())
    ? t("日期") : t("日期（{column}）", { column: dateColumn });
  // 21.3: the research assessment is a status chosen and a reason written, not the cell's text. A new row starts as 待定
  // (the project's word for it, else 其它); an existing one is read from its cell and written back untouched until changed.
  const statuses = state.attemptStatuses || [];
  const pending = statuses.find((s) => s.code === "pending");
  // The panel calls the cell 研究判断 (21.3) and so does the form (21.6), whatever the table's own header says (「状态」 in
  // a researcher's table): the header only finds the column. The other fields keep the table's header below.
  const verdictLabelText = t("研究判断");
  const chooser = RODesk.statusChooser(mode === "append"
    ? { statuses: statuses, status: pending ? pending.status : "", reason: "", label: verdictLabelText }
    : { statuses: statuses, cell: record.verdict || "", label: verdictLabelText });

  // Field labels come from the project's OWN [columns] header text -- the
  // researcher's words, not this tool's.
  const defs = [
    { key: "date", label: dateLabel, mono: true },
    { key: "description", label: config.columns.description || t("描述"), multiline: true },
    { key: "variables", label: config.columns.variables || t("变量"), multiline: true },
    { key: "result", label: config.columns.result || t("结果"), multiline: true },
    { key: "verdict", label: verdictLabelText },
  ];
  defs.forEach((def) => {
    if (def.key === "verdict") { form.appendChild(formFieldEl(def.label, chooser.el)); return; }
    let input;
    if (def.multiline) {
      input = document.createElement("textarea");
      input.className = "form-textarea";
      input.rows = 2;
    } else {
      input = document.createElement("input");
      input.className = "form-input" + (def.mono ? " form-mono" : "");
    }
    if (mode === "append") {
      input.value = def.key === "date" ? defaultDateValue(attempts, new Date()) : (["description", "result"].includes(def.key) && typeof prefill[def.key] === "string" ? prefill[def.key] : "");
    } else {
      input.value = def.key === "result" ? (record.result || "") : (attrs[def.key] || "");
    }
    inputs[def.key] = input;
    initial[def.key] = input.value;
    // 提议修改研究判断 carries the verdict and the result only (12.4).
    if (proposing && mode === "update" && def.key !== "result") {
      input.disabled = true;
      input.dataset.fixed = "1";
      input.title = "修改研究判断的提议只带研究判断和结果；其它格子的改动不会随提议发送";
    }
    form.appendChild(formFieldEl(def.label, input));
  });
  if (proposing && mode === "update") {
    reasonInput = document.createElement("textarea");
    reasonInput.className = "form-textarea";
    reasonInput.rows = 2;
    reasonInput.placeholder = "放弃这条路线时必须写明为什么";
    const reasonField = formFieldEl("理由（放弃一条路线时必填）", reasonInput);
    reasonField.appendChild(mk("div", "team-help", "研究判断标为已放弃时，结果和理由都必须填写：批准后它们会写进尝试表，这条路线当时的依据也会冻结下来。"));
    form.appendChild(reasonField);
  }
  // 14.2: a member's new attempt may name what it grew out of -- official
  // attempts only (a line is proposed against the official version);
  // approving the attempt adds those lines.
  let parentPicks = null;
  if (mode === "append") {
    const official = attempts.filter((a) => !a.officialness || a.officialness.state === "official");
    if (official.length) {
      const box = mk("div", "parent-picks");
      parentPicks = official.map((a) => {
        const lab = mk("label", "parent-pick");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = a.id;
        cb.checked = Array.isArray(prefill.parents) && prefill.parents.includes(a.id);
        lab.append(cb, mk("span", "mono", "#" + ((a.attrs || {}).number || "")), " " + ((a.attrs || {}).description || ""));
        box.appendChild(lab);
        return cb;
      });
      const parentField = formFieldEl(t("源自（可选）"), box);
      parentField.appendChild(mk("div", "team-help", proposing ? t("它源自的正式尝试；PI 批准后，这些连线画到路线图上") : t("保存尝试后，按所选来源建立关联。")));
      form.appendChild(parentField);
    }
  }
  // 16, 21.3: the local model's draft is folded below the main fields; it fills description and result when asked.
  if (draftBlock) {
    const fold = mk("details", "attempt-fold");
    const summary = mk("summary", "res-draft-summary"); // 12.13: the quiet chevron
    summary.append(chevronIcon(), mk("span", null, t("用本地模型辅助填写")));
    fold.append(summary, draftBlock.el);
    form.appendChild(fold);
  }
  // 12.4 / 14.3: a member's new row abandoned from the start asks the same as
  // abandoning one later -- its result and a reason, shown once the preview
  // says the row abandons the route.
  let memberReason = null;
  if (proposing && mode === "append") {
    reasonInput = document.createElement("textarea");
    reasonInput.className = "form-textarea";
    reasonInput.rows = 2;
    reasonInput.placeholder = t("为什么放弃这条路线");
    memberReason = formFieldEl(t("放弃的理由（必填）"), reasonInput);
    memberReason.appendChild(mk("div", "team-help",
      t("这一行一开始就放弃了这条路线：结果和理由都必须填写，PI 批准后它们写进尝试表，这条路线当时的依据也会冻结下来。")));
    memberReason.classList.add("hidden");
    form.appendChild(memberReason);
  }
  // 14.3: abandoning a route asks the PI and a single researcher for the
  // reason too. The field shows once the engine's preview says this write
  // turns the route abandoned (reason_required); rewording a verdict that
  // already abandons it asks nothing.
  let directReason = null;
  if (!proposing) {
    reasonInput = document.createElement("textarea");
    reasonInput.className = "form-textarea";
    reasonInput.rows = 2;
    reasonInput.placeholder = t("为什么放弃这条路线");
    directReason = formFieldEl(t("放弃的理由（必填）"), reasonInput);
    directReason.appendChild(mk("div", "team-help", t("理由会写进结果一栏，这条路线当时的依据也会冻结下来。")));
    directReason.classList.add("hidden");
    form.appendChild(directReason);
  }

  const statusEl = document.createElement("div");
  statusEl.className = "panel-status";

  const actionsEl = document.createElement("div");
  actionsEl.className = "form-actions";
  const submitBtn = document.createElement("button");
  submitBtn.type = "submit";
  submitBtn.className = "btn btn-primary";
  // 18.3: an existing row of the PI or a single researcher is saved, not previewed (a route turned abandoned still is).
  const updating = mode === "update" && !proposing;
  submitBtn.textContent = proposing ? t("预览这一行") : updating ? t("保存") : t("预览改动");
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "btn";
  cancelBtn.textContent = t("取消");
  cancelBtn.addEventListener("click", closePanel);
  actionsEl.append(submitBtn, cancelBtn);
  form.appendChild(actionsEl);
  // 21.3: which file the row is written to is said here, under 「详情」, and nowhere else on the form.
  const detail = mk("details", "attempt-fold");
  const detailSummary = mk("summary", "res-draft-summary");
  detailSummary.append(chevronIcon(), mk("span", null, t("详情")));
  detail.append(detailSummary, mk("p", "team-help", proposing ? t("工作副本里的 {file}", { file: config.file }) : t("将写入 {file}", { file: config.file })));
  form.appendChild(detail);

  const previewHost = document.createElement("div");

  // A cell's text as the form would write it: the chooser's (21.3) for the research assessment, the box's own for the rest.
  const cellOf = (key) => (key === "verdict" ? chooser.cell() : inputs[key].value);
  const isChanged = (key) => (key === "verdict" ? chooser.changed() : inputs[key].value !== initial[key]);

  function collectBody() {
    const num = mode === "append" ? numberInput.value.trim() : number;
    if (!num) {
      setFormStatus(statusEl, "err", "编号不能为空");
      return null;
    }
    const fields = {};
    if (mode === "append") {
      EDITABLE_KEYS.forEach((key) => { fields[key] = toCellText(cellOf(key)); });
    } else {
      // Dirty fields only (section comment above): an untouched cell must
      // never be round-tripped through its cleaned prefill.
      EDITABLE_KEYS.forEach((key) => {
        if (isChanged(key)) fields[key] = toCellText(cellOf(key));
      });
      if (Object.keys(fields).length === 0) {
        setFormStatus(statusEl, "", t("没有需要写入的改动"));
        return null;
      }
    }
    const body = { op: mode, number: num, fields: fields };
    if (directReason && !directReason.classList.contains("hidden") && reasonInput.value.trim()) {
      body.reason = reasonInput.value.trim();
    }
    return body;
  }

  function setFormDisabled(disabled) {
    numberInput.disabled = disabled || mode === "update";
    Object.keys(inputs).forEach((key) => { inputs[key].disabled = disabled || inputs[key].dataset.fixed === "1"; });
    chooser.setDisabled(disabled);
    if (sentenceInput) sentenceInput.disabled = disabled;
    if (reasonInput) reasonInput.disabled = disabled;
    (parentPicks || []).forEach((cb) => { cb.disabled = disabled; });
    if (draftBlock) draftBlock.setFrozen(disabled); // 16.1: no draft into a frozen form
    submitBtn.disabled = disabled;
  }

  // 18.3: changing only the 研究判断 or 结果 of an existing row writes at once (the preview was asked for its
  // guards, not shown), then 已保存 and 撤销, which writes the old cells back the same way (desk.js, shared
  // with the side panel). What the form showed is its fields' text when it was drawn or last saved.
  const shownCells = () => ({ verdict: chooser.shown(), result: initial.result });

  // The field holds what the file holds now (after a save, after 撤销): nothing typed in it is unwritten, so
  // opening another panel does not ask (desk.js halfTyped, as the side panel's own save does).
  function fieldIsWritten(key) {
    if (key === "verdict") { chooser.markWritten(); return; }
    initial[key] = inputs[key].value;
    inputs[key].dataset.initial = inputs[key].value;
    delete inputs[key].dataset.typed;
  }

  function offerUndo(u) {
    setFormStatus(statusEl, "ok", "");
    RODesk.atOnce.line(statusEl, () => undoNow(u));
  }

  async function saveAtOnce(preview, body) {
    previewHost.innerHTML = "";
    setFormDisabled(true);
    setFormStatus(statusEl, "", t("正在写入…"));
    let result;
    try {
      result = await apiPost("/api/attempts/write", body); // the body the preview was made for, verbatim
    } catch (err) {
      setFormDisabled(false);
      setFormStatus(statusEl, "err", t("写入失败，文件没有被修改"), err);
      return;
    }
    pollGeneration();
    setFormDisabled(false);
    if (result.ingest_error) {
      setFormStatus(statusEl, "err", t("已写入并备份，但重扫失败"), result.ingest_error);
      return;
    }
    const undo = RODesk.atOnce.undoOf(preview, body, shownCells());
    EDITABLE_KEYS.forEach((key) => fieldIsWritten(key));
    offerUndo(undo);
  }

  async function undoNow(undo) {
    setFormDisabled(true);
    setFormStatus(statusEl, "", t("正在写入…"));
    let done;
    try {
      done = await RODesk.atOnce.undo(undo);
    } catch (err) {
      setFormDisabled(false);
      setFormStatus(statusEl, "err", t("写入失败，文件没有被修改"), err);
      return;
    }
    setFormDisabled(false);
    if (done.state !== "done") {
      setFormStatus(statusEl, "err", done.state === "abandons"
        ? t("撤销会让这条路线重新放弃，需要写明理由：请把研究判断改回已放弃，再保存。") : t("这一行之后又改过，不能撤销。"));
      return;
    }
    pollGeneration();
    if (done.res.ingest_error) {
      setFormStatus(statusEl, "err", t("已写入并备份，但重扫失败"), done.res.ingest_error);
      return;
    }
    Object.keys(undo.was).forEach((key) => {
      if (key === "verdict") { chooser.set(undo.text[key]); return; }
      inputs[key].value = undo.text[key];
      fieldIsWritten(key);
    });
    setFormStatus(statusEl, "ok", t("撤销了上一步"));
  }

  async function associateCreatedAttempt(result, body) {
    if (mode !== "append" || (!researchSource && !(parentPicks || []).some((pick) => pick.checked))) return null;
    if (formProject !== state.currentPath || formEpoch !== state.dataEpoch || formSubject !== state.panelSubject) return { stale: true };
    await ensureAttemptData();
    if (formProject !== state.currentPath || formEpoch !== state.dataEpoch || formSubject !== state.panelSubject) return { stale: true };
    const created = state.attemptsById.get("attempt:" + result.file + "#" + body.number);
    if (!created) return { missing: true };
    const failures = [];
    if (!proposing) {
      for (const pick of (parentPicks || []).filter((pick) => pick.checked)) {
        if (formProject !== state.currentPath || formEpoch !== state.dataEpoch || formSubject !== state.panelSubject) return { stale: true };
        try { await apiPost("/api/mappings/add", { from: created.id, to: pick.value, type: "derives_from" }); }
        catch (error) { failures.push(error); }
      }
    }
    if (researchSource && typeof researchSource.onSaved === "function") researchSource.onSaved(created, { workingCopy: proposing });
    return { failures };
  }

  function renderPreview(preview, body, moved) {
    previewHost.innerHTML = "";
    setFormDisabled(true); // frozen while the preview stands -- 返回修改 unfreezes
    submitBtn.classList.remove("btn-primary"); // 21.8: the preview's confirm is the one primary button while it stands
    if (preview.old_row !== null && preview.old_row !== undefined) {
      const oldLabel = document.createElement("div");
      oldLabel.className = "diff-label";
      oldLabel.textContent = t("原行");
      const oldRow = document.createElement("div");
      oldRow.className = "diff-row old";
      oldRow.textContent = preview.old_row;
      previewHost.append(oldLabel, oldRow);
    }
    const newLabel = document.createElement("div");
    newLabel.className = "diff-label";
    newLabel.textContent = t("新行");
    const newRow = document.createElement("div");
    newRow.className = "diff-row new";
    newRow.textContent = preview.new_row;
    previewHost.append(newLabel, newRow);

    const note = document.createElement("div");
    note.className = "confirm-note";
    note.textContent = proposing
      ? t("保存到工作副本：{file}。保存前自动备份。", { file: preview.file })
      : t("保存到 {file}，保存前自动备份。", { file: preview.file });
    const confirmActions = document.createElement("div");
    confirmActions.className = "form-actions";
    const confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.className = "btn btn-primary";
    confirmBtn.textContent = proposing ? t("保存后查看提议") : t("保存修改");
    const backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "btn";
    backBtn.textContent = t("返回修改");
    backBtn.addEventListener("click", () => {
      previewHost.innerHTML = "";
      setFormDisabled(false);
      submitBtn.classList.add("btn-primary");
      statusEl.textContent = "";
    });
    confirmActions.append(confirmBtn, backBtn);
    previewHost.append(note);
    if (!proposing && preview.reason_required) {
      previewHost.append(mk("div", "confirm-note", t("这一行会放弃这条路线：理由写进结果一栏，它当时的依据冻结下来。")));
    }
    if (moved) previewHost.append(mk("div", "confirm-note", t("这一行在你打开它以后被改过：上面的原行是文件里现在的样子。")));
    previewHost.append(confirmActions);

    confirmBtn.addEventListener("click", async () => {
      if (moved) { saveAtOnce(preview, body); return; } // the row was shown because the file moved: written, then 撤销
      confirmBtn.disabled = true;
      backBtn.disabled = true;
      setFormStatus(statusEl, "", "正在写入…");
      let result;
      try {
        // The confirmed body, verbatim -- the server re-validates against
        // the file's current state under the ingest lock either way.
        result = await apiPost("/api/attempts/write", body);
      } catch (err) {
        setFormStatus(statusEl, "err", "写入失败，文件没有被修改", err);
        backBtn.disabled = false; // 返回修改, fix, and re-preview
        return;
      }
      const association = !result.ingest_error ? await associateCreatedAttempt(result, body) : null;
      if (association && association.stale) return;
      if (proposing) {
        // The row is the member's own change now; the proposal is the
        // engine's dry run of it, sent only on 发送提议 (team.js).
        pollGeneration();
        previewHost.innerHTML = "";
        if (draftBlock) draftBlock.markWritten(); // 16.1: no 返回修改 now; a late draft says the row is written
        setFormStatus(statusEl, "", "这一行已写进你的工作副本。");
        const propose = { kind: mode === "append" ? "attempt_new" : "verdict_change", sentence: sentenceInput.value.trim(),
          number: body.number };
        if (reasonInput && reasonInput.value.trim() && (!memberReason || !memberReason.classList.contains("hidden"))) {
          propose.reason = reasonInput.value.trim();
        }
        const parents = (parentPicks || []).filter((cb) => cb.checked).map((cb) => cb.value);
        if (parents.length) propose.parents = parents;
        const composeStatus = mk("div", "notice-status");
        const composeHost = mk("div", "compose-result");
        previewHost.append(composeStatus, composeHost);
        const draft = await ROTeam.composeInto(composeHost, propose, composeStatus);
        if (!draft) composeStatus.appendChild(mk("div", "team-help", "这一行已经在你的工作副本里，可以稍后在「提议」一栏里提交。"));
        return;
      }
      if (result.ingest_error) {
        // The file edit itself landed (and is backed up) -- only the
        // rescan failed; the refresh chip carries the same error.
        setFormStatus(statusEl, "err", "已写入并备份，但重扫失败", result.ingest_error);
        backBtn.disabled = false;
        pollGeneration();
        return;
      }
      if (association && (association.missing || association.failures.length)) {
        previewHost.replaceChildren();
        setFormStatus(statusEl, "err", association.missing ? t("尝试已保存，但尚未读到新尝试，要点里的关联未更新。") : t("尝试已保存，部分来源关联未成功。可在研究路线中补充关联。"), association.failures && association.failures[0]);
        previewHost.appendChild(mkButton(t("关闭"), "btn", closePanel)); pollGeneration(); return;
      }
      closePanel(); // success -- the auto-refresh renders the new state
      pollGeneration();
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (proposing && !sentenceInput.value.trim()) {
      setFormStatus(statusEl, "err", "请用一句话说明这份提议");
      sentenceInput.focus();
      return;
    }
    const body = collectBody();
    if (!body) return;
    // 16.1: a draft landing while the preview is made would show text the snapshot lacks.
    const unfreezeDraft = () => { if (draftBlock) draftBlock.setFrozen(false); };
    if (draftBlock) draftBlock.setFrozen(true);
    setFormStatus(statusEl, "", updating ? t("正在保存…") : "正在生成预览…");
    let preview;
    try {
      preview = await apiPost("/api/attempts/preview", body);
    } catch (err) {
      unfreezeDraft();
      setFormStatus(statusEl, "err", updating ? t("写入失败，文件没有被修改") : "无法生成预览", err);
      return;
    }
    // 12.4: abandoning a route through a proposal -- a verdict changed, or a
    // new row abandoned from the start -- needs its result and its reason,
    // refused here, before anything is written.
    if (memberReason) memberReason.classList.toggle("hidden", !preview.abandons);
    if (proposing && preview.abandons &&
        (!inputs.result.value.trim() || !(reasonInput && reasonInput.value.trim()))) {
      unfreezeDraft();
      setFormStatus(statusEl, "err", t("放弃一条路线时，结果和理由都必须填写"));
      (inputs.result.value.trim() ? reasonInput : inputs.result).focus();
      return;
    }
    if (directReason) {
      directReason.classList.toggle("hidden", !preview.reason_required);
      if (preview.reason_required && !body.reason) {
        unfreezeDraft();
        setFormStatus(statusEl, "err", t("放弃一条路线时必须写明理由"));
        reasonInput.focus();
        return;
      }
    }
    statusEl.textContent = "";
    const how = updating && RODesk.atOnce.kind(body) ? RODesk.atOnce.verdict(preview, body, shownCells()) : "preview";
    if (how === "once") saveAtOnce(preview, body);
    else renderPreview(preview, body, how === "moved");
  });

  panelBody.append(form, statusEl, previewHost);
  openPanel();
  (mode === "append" ? numberInput : inputs.description).focus();
}

if (window.ROWorkspace) {
  window.ROWorkspace.onCreateAttempt = (prefill, onSaved) => { if (mayReplacePanel()) openAttemptForm("append", null, { prefill, onSaved }); };
  window.ROWorkspace.onOpenVariable = (id) => openVariableCard(id);
}

document.getElementById("new-attempt-btn").addEventListener("click", () => { if (mayReplacePanel()) openAttemptForm("append"); });

// -- The human record's surfaces (DESIGN.md 9.3-9.6, task V5 phase 7) --------
// The 待复核 list (9.6), the 记录 inventory (9.2), the identity questions
// (9.4), the migration banner (9.5), the ledger's trust and shrink states
// (9.3). Every write goes through an existing origin-checked endpoint and
// the server's one human write path; every refusal is shown with the
// shared helper (a Chinese sentence, the engine's text behind 「详情」).

const JUDGE_UNDO_MS = 10000; // as long as the canvas's 「撤销」 offer

function mk(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function mkButton(label, cls, onClick) {
  const b = mk("button", cls || "btn btn-small", label);
  b.type = "button";
  if (onClick) b.addEventListener("click", onClick);
  return b;
}

function keyOf(x) {
  return { src: x.src, dst: x.dst, type: x.type, extractor: x.extractor };
}

function keyId(x) {
  return JSON.stringify([x.src, x.dst, x.type, x.extractor]);
}

function setStatus(el, cls, text, err) {
  el.className = "notice-status" + (cls ? " " + cls : "");
  if (err) renderBlockingError(el, text, err);
  else { el.textContent = text || ""; el.title = ""; }
}

// What stops a human record before it is even tried (9.10, 9.4): the page
// says it in place of the action rather than letting the click fail.
function humanRecordsBlocked() {
  const s = state.summary;
  if (!s) return null;
  if (s.needs_migration) return t("迁移后才能记录连线确认");
  if (s.read_only) return t("只读打开：不会写入任何东西");
  return null;
}

// One human act on one machine link, through POST /api/judgements (the
// one write path, 9.1). Resolves the response, or throws the refusal.
function postJudgement(key, verdict, note) {
  const body = Object.assign(keyOf(key), { verdict: verdict });
  if (note && note.trim()) body.note = note.trim();
  return apiPost("/api/judgements", body);
}

// -- 待复核 (9.6) ---------------------------------------------------------------

const reviewNotes = new Map(); // keyId -> a note being typed, kept across re-renders

async function openReviewPanel(focus) {
  const subject = { kind: "review", focus: focus ? keyId(focus) : null, scrolled: false };
  state.panelSubject = subject;
  panelTitle.textContent = t("待复核");
  panelTitle.title = "";
  panelSubtitle.textContent = t("依据变了的旧连线确认和变量卡，等你再看一眼");
  panelBody.innerHTML = '<p class="empty-note">' + t("载入中…") + "</p>";
  openPanel();
  await renderReviewPanel(subject);
}

function reasonNow(item) {
  if (item.basis_now) return basisLines(item.basis_now);
  if (item.reason === "not_produced") return [t("本次扫描读到了两端，但没有得出这条关联")];
  if (item.reason === "endpoint_gone") return [t("关联的一端不在本次扫描结果里")];
  return [t("本次扫描没有给出依据")];
}

function basisColumn(title, lines) {
  const col = mk("div", "basis-col");
  col.appendChild(mk("div", "basis-col-title", title));
  (lines.length ? lines : [t("（没有记录依据）")]).forEach((l) => col.appendChild(mk("div", null, l)));
  return col;
}

// Each act as [its button, the verdict it records, what is said once done].
function reviewActions(item) {
  const withdraw = [t("撤回"), "withdrawn", t("已撤回")];
  if (item.outcome === "conflict") {
    return [[t("定为确认"), "confirmed", t("已定为确认")], [t("定为否决"), "rejected", t("已定为否决")], withdraw];
  }
  const opposite = item.verdict === "confirmed" ? [t("改为否决"), "rejected", t("已改为否决")]
    : [t("改为确认"), "confirmed", t("已改为确认")];
  return [[t("仍然成立"), item.verdict, t("已记录：仍然成立")], opposite, withdraw];
}

// `origin`: the review item the act was made from -- the 「撤销」 offer is
// shown inside it while it is still listed (never only at the top of a
// scrolled panel, where it would expire unseen).
async function judgeFromReview(target, verdict, note, statusEl, buttons, done, origin) {
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", t("正在记录…"));
  try {
    const res = await postJudgement(target, verdict, note);
    // This page re-fetches right below; the poll need not do it again.
    if (res && typeof res.generation === "number") lastGeneration = res.generation;
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", t("没能记录这条连线确认"), err);
    return;
  }
  reviewNotes.delete(keyId(target));
  // Its note went with the act: the field is emptied, so a panel that keeps
  // what is half typed (the desk's, DESIGN.md 14.3) is drawn again.
  panelBody.querySelectorAll("input").forEach((f) => {
    if (origin && f.dataset.noteFor === origin) { f.value = ""; delete f.dataset.typed; }
  });
  state.reviewOffer = {
    text: t("{done}：{link}", { done: done, link: linkText(target) }), key: keyOf(target), until: Date.now() + JUDGE_UNDO_MS,
    origin: origin || null, shown: false,
  };
  setTimeout(() => {
    if (state.reviewOffer && state.reviewOffer.until <= Date.now()) {
      state.reviewOffer = null;
      const subject = state.panelSubject;
      if (subject && subject.kind === "review") renderReviewPanel(subject);
    }
  }, JUDGE_UNDO_MS + 50);
  await refreshCurrentView(); // the count, the marks and this list, now
}

async function undoFromReview(key, statusEl) {
  state.reviewOffer = null;
  setStatus(statusEl, "", t("正在撤销…"));
  try {
    const res = await postJudgement(key, "undone");
    if (res && typeof res.generation === "number") lastGeneration = res.generation;
  } catch (err) {
    setStatus(statusEl, "err", t("无法撤销"), err);
    return;
  }
  await refreshCurrentView();
}

function renderReviewItem(item, subject) {
  const id = keyId(item);
  const box = mk("div", "review-item" + (subject.focus === id ? " focus" : ""));
  box.dataset.key = id;
  const link = mk("div", "review-link", linkText(item));
  link.title = item.src + "\n" + item.dst + "\n" + t("（{type} · {extractor}）", { type: item.type, extractor: item.extractor });
  box.append(link, mk("span", "review-reason", item.label || t("待复核")));
  if (item.outcome === "conflict") {
    const d = item.detail || {};
    box.appendChild(mk("p", "review-note", d.contradicts
      ? t("迁移来的旧连线确认和记录里已有的连线确认相反（两台电脑各做了一次）。Research OS 不按迁移日期替你选，请写一条新的连线确认来定下它。")
      : t("两份记录各自追加了不同的内容（可能是两台电脑各改了一份，再被同步合并）。Research OS 不按时间替你选，请写一条新的连线确认来定下它。")));
    if (d.common && d.common.length) {
      box.appendChild(mk("div", "review-note", t("共同的记录：{entries}", { entries: d.common.map(historyEntryText).join(t("；")) })));
    }
    const branches = mk("div", "review-branches");
    (d.branches || []).forEach((branch, i) => {
      const col = mk("div", "basis-col");
