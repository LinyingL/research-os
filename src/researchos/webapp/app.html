      col.appendChild(mk("div", "basis-col-title", (d.contradicts ? [t("记录里原有的"), t("迁移来的")][i] : null) || t("第 {n} 份", { n: i + 1 })));
      branch.forEach((e) => col.appendChild(mk("div", null, historyEntryText(e) + (e.note ? " · " + e.note : ""))));
      branches.appendChild(col);
    });
    box.appendChild(branches);
  } else {
    box.appendChild(mk("div", "review-was", t("原连线确认：{verdict} · {when}", { verdict: verdictWord(item.verdict), when: whenText(item) })));
    if (item.note) box.appendChild(mk("div", "review-note", t("备注：{note}", { note: item.note })));
    const pair = mk("div", "basis-pair");
    pair.append(basisColumn(t("当时的依据"), basisLines(item.basis)), basisColumn(t("现在"), reasonNow(item)));
    box.appendChild(pair);
  }
  const noteInput = mk("input", "form-input");
  noteInput.placeholder = t("备注（可选）");
  noteInput.dataset.noteFor = id;
  noteInput.value = reviewNotes.get(id) || "";
  noteInput.addEventListener("input", () => reviewNotes.set(id, noteInput.value));
  const status = mk("div", "notice-status");
  const buttons = [];
  const candidates = item.candidates || [];
  if (candidates.length && (item.verdict === "confirmed" || item.verdict === "rejected")) {
    const cands = mk("div", "review-cands");
    cands.appendChild(mk("div", "review-cands-title",
      t("可能对应的新关联（同一次扫描里新出现）：旧连线确认不会自己转过去，点了才会在它上面记下一条新的连线确认，旧的这条保持原样。")));
    candidates.forEach((c) => {
      const row = mk("div", "review-cand");
      const name = mk("span", "review-link", linkText(c));
      name.title = c.src + "\n" + c.dst;
      row.appendChild(name);
      if (candidateApplied(c, item.verdict)) {
        // Applied already (9.6: one click, one entry): said, not offered again.
        row.appendChild(mk("span", "review-note", t("已用到这条关联上（{verdict}）", { verdict: verdictWord(item.verdict) })));
      } else {
        const b = mkButton(t("把这条旧连线确认用到它上面"), "btn btn-small", () =>
          judgeFromReview(c, item.verdict, noteInput.value, status, buttons, t("已用到新关联上（{verdict}）", { verdict: verdictWord(item.verdict) }), id));
        buttons.push(b);
        row.appendChild(b);
      }
      cands.appendChild(row);
    });
    box.appendChild(cands);
  }
  const actions = mk("div", "review-actions");
  const blocked = humanRecordsBlocked();
  if (blocked) {
    actions.appendChild(mk("span", "review-note", blocked));
  } else {
    actions.appendChild(noteInput);
    reviewActions(item).forEach(([label, verdict, done]) => {
      const b = mkButton(label, "btn btn-small", () => judgeFromReview(item, verdict, noteInput.value, status, buttons, done, id));
      buttons.push(b);
      actions.appendChild(b);
    });
  }
  box.append(actions, status);
  return box;
}

function sourceFiles(item) {
  const d = item.detail || {};
  if (Array.isArray(d.sources) && d.sources.length) return d.sources;
  return [String(item.src).slice(String(item.src).indexOf(":") + 1)];
}

async function renderReviewPanel(subject) {
  let data;
  try {
    data = await apiGet("/api/review");
  } catch (err) {
    if (state.panelSubject !== subject) return;
    renderViewFailure(panelBody, err);
    return;
  }
  if (state.panelSubject !== subject) return;
  const top = panelBody.scrollTop;
  panelBody.innerHTML = "";
  const ledger = data.ledger || {};
  if (ledger.state && ledger.state !== "ok") {
    const warn = mk("div", "notice bad");
    warn.appendChild(mk("div", "notice-title", ledger.message || t("连线确认的记录文件当前无法读取，请先恢复它")));
    warn.appendChild(mk("p", null, t("修好之前，这里的操作都不会被记录。")));
    panelBody.appendChild(warn);
  }
  const offer = state.reviewOffer;
  const offerStatus = mk("div", "panel-status ok");
  if (offer && offer.until > Date.now()) {
    offerStatus.appendChild(mk("span", null, offer.text));
    const undo = mkButton(t("撤销"), "err-detail-toggle", () => undoFromReview(offer.key, offerStatus));
    offerStatus.appendChild(undo);
  }
  const offerAnchor = mk("div");
  panelBody.appendChild(offerAnchor);
  const cardGroups = (data.cards && data.cards.groups) || [];
  if (data.review.length || !cardGroups.length) {
    panelBody.appendChild(mk("p", "review-intro",
      t("这些连线确认做出时依据的事实，这次扫描看到的不一样了。连线确认没有被删掉，也没有被套用：连线暂时按机器的结果显示，等你决定。")));
  }
  if (!data.review.length && !cardGroups.length) panelBody.appendChild(mk("p", "empty-note", t("没有待复核的旧连线确认。")));
  data.review.forEach((item) => panelBody.appendChild(renderReviewItem(item, subject)));
  // 9.11 stage (b): variable cards whose implementation moved, in the same list.
  if (cardGroups.length) renderCardReviewGroups(panelBody, data.cards);
  const held = data.source_unreadable || [], absent = data.not_in_index || [];
  if (held.length || absent.length) {
    panelBody.appendChild(mk("div", "review-quiet-title", t("不计入待复核")));
    held.forEach((item) => {
      const row = mk("div", "review-quiet");
      row.append(mk("span", "review-link", linkText(item)),
        " · " + t("来源文件暂不可读：{files}", { files: sourceFiles(item).join(t("、")) }) +
        " · " + t("连线确认照旧（{verdict}）", { verdict: verdictWord(item.verdict) }) +
        // 11.1: only in a synced folder's cloud, its client not running
        (typeof item.cloud === "string" && item.cloud ? " · " + item.cloud : ""));
      panelBody.appendChild(row);
    });
    absent.forEach((item) => {
      const row = mk("div", "review-quiet");
      row.append(mk("span", "review-link", linkText(item)),
        " · " + t("图谱里还没有这条关联") + " · " + t("你的连线确认：{verdict}（{when}）", { verdict: verdictWord(item.verdict), when: whenText(item) }));
      panelBody.appendChild(row);
    });
  }
  // The 「撤销」 offer sits in the item the act was made from while it is
  // listed (applying an old verdict to a candidate leaves it listed), else
  // at the top; either way it is brought into view once.
  const origin = offer && offer.origin
    ? Array.from(panelBody.querySelectorAll(".review-item")).find((n) => n.dataset.key === offer.origin) : null;
  if (origin) origin.appendChild(offerStatus);
  else offerAnchor.appendChild(offerStatus);
  if (subject.focus && !subject.scrolled) {
    subject.scrolled = true;
    const target = Array.from(panelBody.querySelectorAll(".review-item")).find((n) => n.dataset.key === subject.focus);
    if (target && target.scrollIntoView) target.scrollIntoView({ block: "center" });
  } else {
    panelBody.scrollTop = top;
  }
  if (offer && offer.until > Date.now() && !offer.shown) {
    offer.shown = true;
    if (offerStatus.scrollIntoView) offerStatus.scrollIntoView({ block: "nearest" });
  }
}

// -- 你的记录与备份 (9.2: what `researchos records` prints; DESIGN.md 21.7) ---------------
// What Research OS keeps for this project, one line each in words, with when it was last backed up (the time in the
// newest backup's own name, the engine's `backed_up_at`) and 「在 Finder 中显示」. The file's name and the backup's
// name are folded under 「详情」, with the engine's own English for a problem.

// A kind of record in words (13.4: 连线确认 is "Link judgments" and 备注 is "Comments" wherever the page says them).
function recordKindWord(row) {
  switch (row.code) {
    case "attempts": return t("研究判断");
    case "attempts_config": return t("尝试表");
    case "judgements": return t("连线确认");
    case "mappings": return t("手画的连线");
    case "canvas": return t("研究路线的布局");
    case "variables": return t("变量卡");
    case "notes": return t("备注", { n: 2 });
    case "decisions": return t("经 PI 批准的决定");
    case "papers": return t("论文正文与不属于论文");
    case "tasks": return t("任务列表");
    case "stata": return t("Stata 全局变量指向的文件夹");
    case "history": return t("版本历史（保存的材料，不是记录）");
    case "legacy": return t("旧版本留下的连线确认");
    default: return row.kind;
  }
}

// 21.7: the lines stand in this order -- the researcher's own judgments and the table they are made in, the link judgments and
// hand-drawn links, the route map's layout, the variable cards, then the rest -- and the records the project holds stand before
// the ones whose line would say 还没有 (each group in that order, and the engine's order for a kind this list does not know).
const RECORD_ORDER = ["attempts", "attempts_config", "judgements", "mappings", "canvas", "variables", "notes", "decisions", "papers",
  "tasks", "stata", "history", "legacy"];

// Whether the project holds nothing of this record yet -- no file, no card, nothing arranged. A file that cannot be read is held.
function recordHasNone(row) {
  const f = row.facts || {};
  switch (row.code) {
    case "attempts": return f.state === "not_configured";
    case "attempts_config": case "variables": case "tasks": case "history": return !f.exists;
    case "canvas": return f.state === "absent";
    case "legacy": return false;
    default: return f.file_state === "absent" || f.state === "absent";
  }
}

function orderedRecordRows(rows) {
  const rank = (row) => { const at = RECORD_ORDER.indexOf(row.code); return at < 0 ? RECORD_ORDER.length : at; };
  return rows.map((row, at) => ({ row: row, at: at }))
    .sort((a, b) => Number(recordHasNone(a.row)) - Number(recordHasNone(b.row)) || rank(a.row) - rank(b.row) || a.at - b.at)
    .map((item) => item.row);
}

function recordIssueWord(code, f) {
  switch (code) {
    case "dataless": return t("正在从云端下载");
    case "unreadable": return t("无法读取");
    case "conflict_copy": return t("旁边有同步冲突副本");
    case "invalid": return f.line ? t("第 {n} 行无法解析", { n: f.line }) : t("内容无法解析");
    case "refused_entries": return t("有几条连线没有被采用");
    case "migration_unfinished": return t("上次迁移没有完成");
    case "needs_migration": return t("等待迁移");
    // why the engine will not trust or write a record (9.3), in the page's own words; a reason it has no sentence for says
    // what the engine said in Chinese, and only in Chinese
    case "missing": return t("文件找不到了，但留有它的备份");
    case "empty_but_expected": return t("文件是空的，但此前有过内容");
    case "shrunk": return t("文件里的记录比 Research OS 记得的少了几条，需要你先确认以哪一份为准");
    case "no_identity": return t("项目身份文件无法读取");
    case "migrating": return t("项目正在迁移");
    case "refuse_writes": return t("现在不能写入");
    case "edited_after_confirmation": return t("确认之后又改过");
    case "copy_missing": return t("留存的副本不见了");
    default: return f.trust_message && uiLang() !== "en" ? f.trust_message : t("需要处理");
  }
}

function recordCountText(row) {
  const f = row.facts || {};
  const none = () => (f.file_state === "absent" || f.state === "absent" ? t("还没有") : t("无法读取"));
  switch (row.code) {
    case "judgements": {
      if (typeof f.entries !== "number") return none();
      const parts = [t("{n} 条记录，其中 {standing} 条正在生效", { n: f.entries, standing: f.standing })];
      if (f.conflicts) parts.push(t("{n} 条记录互相冲突", { n: f.conflicts }));
      return parts.join(t("，"));
    }
    case "mappings":
      if (f.state === "present") return t("{n} 条手画的连线，其中 {noted} 条带备注", { n: f.links, noted: f.with_note });
      return none();
    case "attempts":
      if (f.state === "present") return t("{n} 条尝试，其中 {judged} 条有研究判断", { n: f.attempts, judged: f.with_verdict });
      if (f.state === "not_configured") return t("还没有设置尝试表");
      if (f.state === "unusable") return t("尝试表的设置无法使用");
      if (f.state === "table_missing") return t("找不到尝试表");
      return t("无法读取");
    case "attempts_config":
      return f.exists ? t("已设置：说明哪个文件是尝试表、每一列是什么") : t("还没有设置");
    case "canvas":
      if (f.state === "ok" || f.state === "legacy") {
        const views = t("{n} 个视图，其中 {arranged} 个摆放过", { n: f.views, arranged: f.arranged });
        return f.state === "legacy" ? views + t("（还放在项目外，尚未移入项目）") : views;
      }
      return f.state === "absent" ? t("还没有摆放过") : f.state === "dataless" ? t("正在从云端下载…") : t("无法读取");
    case "variables":
      return f.exists ? t("{n} 张卡片", { n: f.cards }) : t("还没有");
    case "notes": {
      if (typeof f.notes !== "number") return none();
      const parts = [t("{n} 条备注", { n: f.notes }), t("写在 {n} 处", { n: f.nodes })];
      if (f.withdrawn) parts.push(t("{n} 条已撤回", { n: f.withdrawn }));
      return parts.join(t("，"));
    }
    case "decisions":
      if (typeof f.entries === "number") return t("{n} 条决定，其中 {abandoned} 条是放弃的路线", { n: f.entries, abandoned: f.abandoned });
      return none();
    case "papers":
      if (typeof f.marked === "number") return t("{n} 份文稿设为论文正文，不属于论文的图和表：{out}", { n: f.marked, out: f.out });
      return none();
    case "tasks":
      if (typeof f.tasks === "number") return t("{n} 项任务，其中 {done} 项已完成", { n: f.tasks, done: f.done });
      return f.exists ? t("无法读取") : t("还没有");
    case "stata":
      if (typeof f.globals === "number") return t("{n} 个全局变量已回答，其中 {folders} 个指向项目里的文件夹", { n: f.globals, folders: f.folders });
      return none();
    case "history":
      if (!f.exists) return t("还没有");
      return t("{n} 个版本，共 {size}。保存在 Research OS 自己的数据文件夹里，不在项目里：删掉那个文件夹，这些版本就没有了。",
        { n: f.versions, size: recordBytesText(f.bytes) });
    case "legacy":
      return t("{n} 份旧版本留下的数据等待迁移", { n: f.waiting });
    default:
      return row.count || "";
  }
}

function recordBytesText(bytes) {
  const n = Number(bytes) || 0;
  if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(1) + " GB";
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
  if (n >= 1024) return Math.round(n / 1024) + " KB";
  return t("{n} 字节", { n: n });
}

function recordIssueText(row) {
  const f = row.facts || {};
  const words = (f.issues || []).map((code) => recordIssueWord(code, f));
  return Array.from(new Set(words)).join(t("；"));
}

// A record is backed up when it is a file of the project's: the version store (kept beside the index, never copied,
// 12.12) and the old indexes waiting to be migrated are not.
function recordIsBackedUp(row) {
  return row.code !== "history" && row.code !== "legacy" && !!row.path && row.path !== "-";
}

// When it was last backed up, from the backup store; 「还没有备份过」 when nothing has been copied.
function recordBackupText(row) {
  if (!recordIsBackedUp(row)) return "";
  if (!row.backed_up_at) return t("还没有备份过");
  const D = window.RODesk;
  const when = (D && D.whenWords && D.whenWords(row.backed_up_at, new Date())) || row.backed_up_at;
  return t("最近一次备份：{when}", { when: when.charAt(0).toLowerCase() + when.slice(1) });
}

// 「详情」, folded (12.13): the file's name and the newest backup's name, and what the engine said of a problem. A fold the researcher
// opened stays open when the panel is drawn again (`subject.open`, by record).
function recordDetails(row, subject) {
  const lines = [];
  if (row.path && row.path !== "-") lines.push([t("存放位置"), row.path]);
  if (recordIsBackedUp(row) && row.snapshot) lines.push([t("最新备份"), row.snapshot]);
  const engine = (row.problems || []).join("\n");
  if (!lines.length && !engine) return null;
  const fold = mk("details", "records-fold");
  fold.open = subject.open.has(row.code);
  fold.addEventListener("toggle", () => { if (fold.open) subject.open.add(row.code); else subject.open.delete(row.code); });
  const summary = mk("summary", "res-draft-summary");
  summary.append(chevronIcon(), mk("span", null, t("详情")));
  fold.appendChild(summary);
  lines.forEach(([label, value]) => {
    const line = mk("div", "records-detail");
    line.append(mk("span", "records-detail-label", label), mk("span", "mono", value));
    fold.appendChild(line);
  });
  if (engine) fold.appendChild(mk("div", "records-detail records-engine", engine));
  return fold;
}

// 在 Finder 中显示: the existing /api/open route reveals it, and refuses a path outside the project.
async function revealRecord(path, statusEl) {
  statusEl.className = "panel-status";
  statusEl.textContent = t("处理中…");
  try {
    await apiPost("/api/open", { path: path, reveal: true });
    statusEl.className = "panel-status ok";
    statusEl.textContent = t("已在 Finder 中显示。");
    statusEl.title = "";
  } catch (err) {
    statusEl.className = "panel-status err";
    renderBlockingError(statusEl, t("无法在 Finder 中显示"), err);
  }
}

// The line a press of 「在 Finder 中显示」 answers on is kept by record (`subject.said`), so that a redraw does not take the answer away.
function recordRow(row, subject) {
  const f = row.facts || {};
  const div = mk("div", "records-row");
  div.dataset.code = row.code;
  if (!subject.said.has(row.code)) subject.said.set(row.code, mk("div", "panel-status"));
  const status = subject.said.get(row.code);
  const head = mk("div", "records-head");
  head.appendChild(mk("div", "records-kind", recordKindWord(row)));
  // only a record the project holds; the file itself, or the folder of the variable cards
  if (recordIsBackedUp(row) && f.exists && row.path.charAt(0) !== "/") {
    head.appendChild(mkButton(t("在 Finder 中显示"), "btn btn-small", () => revealRecord(row.path, status)));
  }
  div.append(head, mk("div", "records-count", recordCountText(row)));
  const backup = recordBackupText(row);
  if (backup) div.appendChild(mk("div", "records-backup", backup));
  const problem = recordIssueText(row);
  if (problem) div.appendChild(mk("div", "records-problem", problem));
  const details = recordDetails(row, subject);
  if (details) div.appendChild(details);
  div.appendChild(status);
  return div;
}

async function openRecordsPanel() {
  const subject = { kind: "records", open: new Set(), said: new Map() };
  state.panelSubject = subject;
  panelTitle.textContent = t("你的记录与备份");
  panelTitle.title = "";
  panelSubtitle.textContent = "";   // the title says what the panel is; its first line says what is kept (21.7)
  panelBody.innerHTML = '<p class="empty-note">' + t("载入中…") + "</p>";
  openPanel();
  await renderRecordsPanel(subject);
}

async function renderRecordsPanel(subject) {
  let data;
  try {
    data = await apiGet("/api/records");
  } catch (err) {
    if (state.panelSubject !== subject) return;
    renderErrorBox(panelBody, err);
    return;
  }
  if (state.panelSubject !== subject) return;
  const top = panelBody.scrollTop; // drawn again whenever the project moves: the folds, the answers and the place read stay
  panelBody.innerHTML = "";
  panelBody.appendChild(mk("p", "records-intro", t("Research OS 为这个项目保存了这些记录，并在它们变化时备份。")));
  orderedRecordRows(data.rows || []).forEach((row) => panelBody.appendChild(recordRow(row, subject)));
  panelBody.scrollTop = top;
}

document.getElementById("records-btn").addEventListener("click", () => { if (mayReplacePanel()) openRecordsPanel(); });

// -- 设置 (DESIGN.md 21.7) ---------------------------------------------------------------------
// One page for this Mac, opened from the sidebar's foot: AI 执行者 (the form 项目首页 used to carry, drawn by workspace.js into
// the box this page gives ROWorkspace.mountSettings), 本地模型（辅助填写）, 联网查询 and 界面语言. Every setting has this one
// form, with the storage and the routes it always had; the places that held a form say 「在设置里修改」 and open this page.
// All four are this Mac's, so the page needs no project. What belongs to one project stays in the project menu.

function settingsSection(key, title, note) {
  const section = mk("section", "settings-section");
  section.dataset.section = key;
  section.appendChild(mk("h3", "settings-title", title));
  if (note) section.appendChild(mk("p", "settings-note", note));
  return section;
}

// 「本地模型（辅助填写）」 (16.2): this Mac's model server for 新增尝试's 生成草稿. Each field shows the value saved here (empty:
// none saved) with the one in effect as its placeholder; 保存 sends both, an empty one returning to the default. The
// attempt form's 辅助填写 reads the setting to say where a draft goes and links here; this is the one form. Returns { el, load }.
function llmSettingForm() {
  const box = mk("div", "settings-llm");
  const url = mk("input", "form-input form-mono");
  const model = mk("input", "form-input form-mono");
  const status = mk("div", "panel-status");
  const save = mkButton(t("保存"), "btn btn-small", doSave);
  let loaded = false, saving = false;
  function sync() { save.disabled = saving || !loaded; }
  function show(s) {
    const saved = s.saved || {};
    url.value = saved.base_url || "";
    model.value = saved.model || "";
    url.placeholder = s.base_url || "";
    model.placeholder = s.model || "";
    // The leave guard (14.3) counts only words not saved yet.
    [url, model].forEach((f) => { f.dataset.initial = f.value; delete f.dataset.typed; });
    loaded = true;
    sync();
  }
  async function load() {
    let s;
    try {
      s = await apiGet("/api/settings/llm");
    } catch (err) {
      setFormStatus(status, "err", t("没能读到模型设置"), err);
      return;
    }
    show(s);
  }
  async function doSave() {
    if (save.disabled) return;
    saving = true;
    sync();
    try {
      show(await apiPost("/api/settings/llm", { base_url: url.value.trim(), model: model.value.trim() }));
      setFormStatus(status, "ok", t("已保存"));
    } catch (err) {
      setFormStatus(status, "err", err && err.state === "draft_bad_setting"
        ? t("服务地址要用 http 或 https，写明主机，不带用户名和密码") : t("设置没有保存"), err);
    }
    saving = false;
    sync();
  }
  // Enter saves the setting, except the Enter that ends an input method's composition.
  [url, model].forEach((f) => f.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); doSave(); }
  }));
  box.append(formFieldEl(t("服务地址"), url), formFieldEl(t("模型"), model), save, status);
  sync();
  return { el: box, load };
}

// 「联网查询」 (11.4, 21.7): whether DOIs may be looked up on Crossref and OpenAlex. It is stored per Mac (settings.json), so every
// project shares it; the 文献 page says where it stands and links here. Read by GET /api/settings/lookup, written by the
// route the 文献 page always used (POST /api/citations/lookup-setting).
function lookupSettingForm() {
  const box = mk("div", "lit-setting");
  const label = mk("label", "lit-setting-label");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.id = "settings-lookup";

  label.append(input, mk("span", null, t("用 DOI 联网查文献信息")));

  const status = mk("div", "panel-status");
  box.appendChild(status);
  (async () => {
    try {
      input.checked = !!((await apiGet("/api/settings/lookup")).lookup || {}).enabled;
      input.disabled = false;
    } catch (err) {
      setFormStatus(status, "err", t("没能读到这个设置"), err);
    }
  })();
  input.addEventListener("change", async () => {
    const wanted = input.checked;

    setFormStatus(status, "", t("正在保存…"));
    try {
      const res = await apiPost("/api/citations/lookup-setting", { on: wanted });

      setFormStatus(status, "ok", input.checked ? t("已打开：下次扫描时查询") : t("已关闭：不会联网查询"));
      // the 文献 page, if it holds the project's answer, follows the setting: on either tab, both of which say where it stands
      if (litState.data) {

        if (currentView === "literature") {
          views.literature.replaceChildren();
          renderLiterature(views.literature, litState.data);

    } catch (err) {
      input.checked = !wanted;
      setFormStatus(status, "err", t("没能保存这个设置"), err);
    }
    input.disabled = false;
  });
  return box;
}

// -- 变量 (9.11 "In the app"; task V5 phase 9) ------------------------------------
// The cards, the version in use set as a readable document, the history
// from the log, each check with its result, what is under review, the kept
// code. The page writes only what Research OS authors -- confirm (with the
// researcher's own answer to the attestation question), 「口径未变」, open
// the next draft, abandon / revive with a note, the two questions' answers
// -- through POST /api/variables/<action>; never the researcher's text: a
// card is written in its file (「在编辑器中打开」). Engine text and file
// content are inserted as text, never as HTML.

// -- Variable wording (pure; 9.11) -----------------------------------------------
// tests/test_v5_phase9.py loads this block into node.
const ATTESTED_WORDS = { yes: "是", no: "否", unknown: "不确定" };
const CHECK_LABELS = { script: "实现脚本", writes: "写出输出文件", field: "表头字段" };
const ACT_WORDS = {
  confirmed: "确认", corrected: "更正", reaffirmed: "实现变动后确认口径未变",
  abandoned: "弃用", revived: "恢复", removed: "以文件为准移除", settled: "两份记录合并后，指明以哪几条为准",
};
const VIA_WORDS_CARD = { app: "在应用里", cli: "在命令行里", mcp: "通过 MCP", recovered: "补回" };

function atText(at) {
  return stampText(at);
}

// The researcher's own statement at confirmation -- worded as theirs, never
// as Research OS's finding. A 是 beside a 不符 is shown as exactly that.
function attestedText(attested, checked) {
  const base = "你当时的说明：输出按此口径生成 — " + (ATTESTED_WORDS[attested] || ATTESTED_WORDS.unknown);
  if (attested !== "yes" || !checked) return base;
  const items = [];
  ["script", "writes", "field"].forEach((k) => { if (checked[k]) items.push([k, checked[k]]); });
  (checked.reads || []).forEach((r) => items.push(["reads", r]));
  const mismatch = items.filter(([, v]) => v && v.result === "不符");
  if (!mismatch.length) return base;
  return base + "；同时，确认时的核对是：" + mismatch.map(([k, v]) => checkLine(k, v)).join("；") +
    "。两者并存，Research OS 不替你判断哪一个对。";
}

// One check of a confirmation: 已核对 / 不符 / 未核对, with its reason.
function checkLine(kind, item) {
  const label = kind === "reads" ? "读取 " + (item.dataset || "") : (CHECK_LABELS[kind] || kind);
  let text = label + " · " + (item.result || "未核对");
  if (item.call) text += "（" + item.call + "）";
  if (item.reason) text += " · " + item.reason;
  return text;
}

// What was on disk at confirmation (or at a correction: `moment`) -- an
// observation, nothing more.
function observedLine(kind, item, moment) {
  const when = moment || "确认时";
  const head = kind === "output" ? when + "磁盘上的输出文件：" + (item.path || "")
    : when + "磁盘上的输入文件：" + (item.dataset || "");
  if (item.result === "未核对") return head + " · 未核对 · " + (item.reason || "");
  const parts = [];
  if (item.sha256) parts.push("内容指纹 " + String(item.sha256).slice(0, 8));
  if (typeof item.size === "number") parts.push(item.size + " 字节");
  if (!item.sha256 && item.mtime) parts.push("修改时间 " + atText(item.mtime) + "（未计算内容指纹）");
  return head + (parts.length ? " · " + parts.join(" · ") : "");
}

// How a confirmed version's record reads (9.11 "What each thing proves").
// The attestation was the researcher's answer AT CONFIRMATION, about the
// text confirmed and the output then on disk: it is set beside that
// confirmation's own checks. When the text in force is a correction, the
// checks and observations shown are the correction's, and say so -- with
// its time -- never "确认时".
function confirmationWording(v) {
  const corrected = v.checked_act === "corrected";
  const moment = corrected ? atText(v.checked_at) + " 更正时" : "确认时";
  return {
    moment: moment,
    statement: attestedText(v.attested, corrected ? v.attested_checked : v.checked) +
      (corrected ? "（这是确认时的说明，针对当时确认的文字和当时的输出，不针对后来的更正）" : ""),
    checksTitle: moment + "对照文件的核对",
    observedTitle: "观察（只说明" + moment + "磁盘上有什么，不说明文件由这一版生成）",
  };
}

// A stage-(b) comparison, always with how far it looked.
function coverageLine(item, kind) {
  const text = item.text || t("未比对");
  if (kind === "script") return item.path ? t("实现脚本 {path}：{text}", { path: item.path, text: text }) : t("实现脚本：{text}", { text: text });
  return t("输入 {dataset}：{text}", { dataset: item.dataset || "", text: text });
}

function cardActText(entry) {
  const what = (ACT_WORDS[entry.act] || entry.act) + (entry.version ? " v" + entry.version : "");
  const via = VIA_WORDS_CARD[entry.via] ? "（" + VIA_WORDS_CARD[entry.via] + "）" : "";
  // 12.13: who, by the name the team gives them.
  const who = entry.by_label ? " · " + entry.by_label + (entry.approved_by_label ? "，经 " + entry.approved_by_label + " 批准" : "") : "";
  return atText(entry.at) + " · " + what + via + who;
}
// -- end of variable wording ----------------------------------------------------

const varState = {

async function loadVariablesView() {
  const host = views.variables;
  const epoch = state.dataEpoch;
  views.variables.dataset.loaded = "1";
  if (!host.childElementCount) host.appendChild(mk("p", "empty-note", "载入中…"));
  let data;
  try {
    data = varState.card
      ? await apiGet("/api/variables/card?id=" + encodeURIComponent(varState.card))
      : await apiGet("/api/variables");
  } catch (err) {
    if (epoch !== state.dataEpoch) return;
    if (varState.card && err.state === "card_no_such_card") {
      varState.card = null; // the card went away: back to the list
      return loadVariablesView();
    }
    renderViewFailure(host, err);
    return;
  }
  if (epoch !== state.dataEpoch || currentView !== "variables") {
    if (epoch === state.dataEpoch) delete views.variables.dataset.loaded;
    return;
  }
  clearProjectState(); // the project answered as itself: whatever was wrong is over
  const top = window.scrollY;
  // The id field of 新建变量卡 keeps the caret through the redraw: it is drawn anew below.
  const typing = host.querySelector(".var-new-id");
  const refocus = !!typing && document.activeElement === typing;
  host.innerHTML = "";
  if (varState.card) renderVariableCard(host, data);
  else renderVariableList(host, data);
  const field = refocus ? host.querySelector(".var-new-id") : null;
  if (field) {
    field.focus();
    if (field.setSelectionRange) field.setSelectionRange(field.value.length, field.value.length);
  }
  window.scrollTo(0, top);
}

function openVariableCard(id) {
  varState.card = id;
  varState.version = null;
  varState.asking = null;
  closePanel();
  delete views.variables.dataset.loaded; // the list may be what was loaded last
  if (currentView !== "variables") activateView("variables");
  else loadVariablesView();
  if (currentView === "variables") window.scrollTo(0, 0);
}

function cardChips(row) {
  const chips = [];
  if (row.state && row.state !== "ok") chips.push([row.reason === "conflict" ? "两份历史待处理" : "无法读取", "bad"]);
  if (row.abandoned) chips.push(["已弃用", "dead"]);
  else if (row.in_use != null) chips.push(["使用 v" + row.in_use, "in-use"]);
  if (row.draft != null) chips.push(["草稿 v" + row.draft, "is-draft"]);
  if (row.in_use == null && row.draft == null && !row.abandoned && row.state === "ok") chips.push(["还没有版本", ""]);
  return chips;
}

// 「新建变量卡」 (DESIGN.md 21.7): the draft card is made by the engine's own code for `researchos variable new`
// (POST /api/variables/new), so the page asks for the id and says the command's rules in words. Nothing of the
// researcher's text is written: the card begins as the commented template, and its definition is written in the editor.
// A member's card is made in their working copy, as it is today, and goes to the PI as a proposal (12.4).
// The form and the id typed in it outlive a redraw (`varState.newCard`); the opener is the quiet button while the form is open.
function newCardBlock(onlyAction) {
  const box = mk("div", "var-new");
  const blocked = cardsBlocked();
  if (blocked) {
    box.appendChild(mk("span", "review-note", blocked));
    return box;
  }
  const kept = varState.newCard;
  const form = mk("form", "var-new-form hidden");
  const id = mk("input", "form-input form-mono var-new-id");
  id.value = kept.id;
  id.addEventListener("input", () => { kept.id = id.value; });
  id.setAttribute("aria-label", t("变量编号"));
  id.placeholder = t("例如 topicshift");
  id.setAttribute("autocomplete", "off");
  const rules = mk("p", "var-new-rules", t("编号是这张卡的名字：1 到 64 个字符，只能用字母、数字、下划线、短横线和点，不能以下划线、点或短横线开头，也不能有连续的两个点；不分大小写，不能和已有的卡重名。"));
  const after = mk("p", "var-new-rules", t("创建以后会打开这张卡的草稿：它从带说明的模板开始，定义由你在编辑器里写，写好后在卡片页确认。"));
  const status = mk("div", "notice-status");
  const make = mkButton(t("创建"), "btn btn-primary btn-small");
  make.type = "submit";
  const cancel = mkButton(t("取消"), "btn btn-small", () => {
    kept.open = false;
    form.classList.add("hidden");
    open.className = openClass;
    status.textContent = "";
  });
  const actions = mk("div", "var-new-actions");
  actions.append(make, cancel);
  form.append(mk("label", "var-new-label", t("变量编号")), id, rules);
  if (window.ROTeam && ROTeam.mode() === "member") {
    form.appendChild(mk("p", "var-new-rules", t("你是这个项目的成员：新建的卡先写进你的工作副本。写好定义后，在「提议」里选「变量定义」，把它交给 PI。")));
  }
  form.append(after, actions, status);
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const epoch = state.dataEpoch, wanted = id.value.trim();
    make.disabled = cancel.disabled = true;
    setStatus(status, "", t("正在创建…"));
    let res;
    try {
      res = await apiPost("/api/variables/new", { id: wanted });
    } catch (err) {
      if (epoch !== state.dataEpoch) return;
      make.disabled = cancel.disabled = false;
      setStatus(status, "err", t("没能新建变量卡"), err);
      return;
    }
    if (epoch !== state.dataEpoch) return;
    if (res && typeof res.generation === "number") lastGeneration = res.generation;
    kept.open = false;
    kept.id = "";
    openVariableCard(res.id);
  });
  // One primary button at a time (21.8): while the form is open its 创建 is it, and the opener goes quiet.
  const openClass = onlyAction ? "btn btn-primary" : "btn btn-small";
  const open = mkButton(t("新建变量卡"), openClass, () => {
    kept.open = true;
    form.classList.remove("hidden");
    open.className = "btn btn-small";
    id.focus();
  });
  if (kept.open) {
    form.classList.remove("hidden");
    open.className = "btn btn-small";
  }
  box.append(open, form);
  return box;
}

function renderVariableList(host, data) {
  if (data.outputs) renderRegisteredOutputs(host, data.outputs, true);
  const rows = data.cards || [];
  const registered = !!(data.outputs && (data.outputs.items || []).length);
  host.appendChild(mk("h2", "section-title", t("变量定义卡")));
  host.appendChild(newCardBlock(!rows.length && !registered));
  if (!rows.length) {
    if (registered) return; // the registered drafts above are what there is to do
    const card = mk("div", "guide-card");
    card.appendChild(mk("h2", null, t("还没有变量定义卡")));
    card.appendChild(mk("p", null, t("变量定义卡记下一个变量是什么、怎样构建、为什么这样构建：研究口径由你书写，实现依据由 Research OS 对照文件核对。")));
    card.appendChild(mk("p", null, t("每张卡存放在项目里 Research OS 自己的记录文件夹中，由你在编辑器中填写；页面只显示它，并记录确认、弃用等动作。")));
    card.appendChild(storageDetails(".researchos/variables/<id>/"));   // 21.7: the folder's name is for 详情, not for the sentence
    // the button is named only where it is drawn
    card.appendChild(mk("p", null, cardsBlocked()
      ? t("为真正进入模型、图表或论断的变量建卡。这个项目现在不能新建变量卡，原因在上面。")
      : t("为真正进入模型、图表或论断的变量建卡。点上面的「新建变量卡」创建第一张。")));
    host.appendChild(card);
    return;
  }
  host.appendChild(mk("p", "var-intro", "研究口径由你在卡片文件里书写；Research OS 只记录确认、弃用等动作，并对照文件核对实现依据。"));
  rows.forEach((row) => {
    const div = mk("div", "var-row");
    div.append(mk("span", "var-name", row.name), mk("span", "var-id", row.id));
    cardChips(row).forEach(([text, cls]) => div.appendChild(mk("span", "var-chip " + cls, text)));
    if (row.under_review) div.appendChild(mk("span", "var-chip wait", "待复核 · " + row.review_labels.join("、")));
    if (row.questions) div.appendChild(mk("span", "var-chip wait", "有 " + row.questions + " 个版本在确认后被改动"));
    if (row.state !== "ok" && row.message) div.appendChild(mk("span", "var-chip bad", row.message));
    else if (row.trust_state && row.trust_state !== "ok" && row.message) div.appendChild(mk("span", "var-chip bad", row.message));
    (row.dead_flags || []).forEach((f) => div.appendChild(mk("span", "var-chip wait", f.message)));
    // 12.9: a variable opens its node page (its trace, changes and notes);
    // the card itself is one click further, 「打开定义卡」.
    div.addEventListener("click", () => RONode.openNode("variable:" + row.id));
    host.appendChild(div);
  });
}

// 「打开结果」 on a registered row (DESIGN.md 19.6, 19.10 item 1): the record is read on 项目首页, where the writing area
// is, not in that page while it is hidden. The page's own view switch decides whether the home is shown: a view that
// asks to be kept (the desk with half-typed words) refuses, and then the page stays where it is and opens nothing.
// A home that has not read this project yet is read first. The record opens as the task row's own 打开结果 opens it.
async function openResultOnHome(path) {

  if (epoch !== state.dataEpoch || currentView !== "workspace" || !views.workspace.dataset.loaded) return;
  await ROWorkspace.openReport(path);
}

// 「在这条尝试下加任务」 (DESIGN.md 21.1): the task form on 项目首页, with the attempt (and, for a task that continues

function renderRegisteredOutputs(host, bundle, variableDrafts) {
  if (!(bundle.items || []).length && !bundle.error) return;
  const box = mk("section", "registered-outputs");
  box.appendChild(mk("h2", "section-title", variableDrafts ? t("待确认的变量草稿") : t("任务输出")));
  if (bundle.error) {  // 19.6: the other catalogs' rows still show below; the line names the catalogs it is about
    const line = mk("p", "notice-status err", t("输出列表暂时无法读取。"));
    (bundle.broken || []).slice(0, 3).forEach((file) => line.appendChild(mk("span", "mono lit-hint", " " + file)));
    box.appendChild(line);
  }
  const items = bundle.items || []; let shown = 0;
  // 19.12 item 3: the rows stand under one heading per task, the same wherever the rows are (a task's rows may come on
  // different pages of 「显示更多」). The heading says what the task is -- the first heading of its result record, else its
  // first line cut as before, 「任务已移除」 when the task is gone -- and when its run was (the date of its newest row that
  // has a run; the rows come newest first), with 「打开结果」 once. Rows with no task and no record have no heading.
  const tasks = new Map();
  items.forEach((item) => {
    const key = item.task || item.report || "";
    const found = tasks.get(key) || tasks.set(key, { title: "", at: "", fromRun: false, handed: false, report: "", node: null }).get(key);
    if (!found.title) found.title = item.task_removed ? t("任务已移除") : (item.report_title || item.task_title || "");
    if (item.at && (!found.at || (!found.fromRun && item.run))) { found.at = item.at; found.fromRun = !!item.run; }
    if (item.run) found.handed = true;   // 21.2: a record an agent run handed back is read as a handback
    if (!found.report && item.report) found.report = item.report;
  });
  function taskGroup(item) {
    const found = tasks.get(item.task || item.report || "");
    if (found.node) return found.node;
    found.node = mk("div", "registered-task-group");
    const head = mk("div", "registered-task-head");
    if (found.title) head.appendChild(mk("h3", "registered-task-title", found.title));
    if (found.at) head.appendChild(mk("span", "lit-hint registered-time", atText(found.at)));
    if (found.report) head.appendChild(mkButton(t("打开结果"), "ws-text-link", () => (found.handed ? ROWorkspace.openHandback(found.report) : openResultOnHome(found.report))));
    if (head.children.length) found.node.appendChild(head);
    box.appendChild(found.node);
    return found.node;
  }
  const more = mkButton(t("显示更多"), "btn btn-small", appendNext);
  function appendNext() {
    more.remove();
    items.slice(shown, shown + 50).forEach((item) => {
      const row = mk("div", "registered-output"), found = tasks.get(item.task || item.report || "");
      row.appendChild(mkButton(item.title || item.path, "ws-text-link ws-file-link", () => openFilePanel(item.path)));
      row.appendChild(mk("span", "mono lit-hint", item.path));
      if (item.agent) row.appendChild(mk("span", "lit-hint", item.agent));
      // a row made at another time than its heading says (a later run's file, a person's own registration) says so
      if (item.at && item.at !== found.at) row.appendChild(mk("span", "lit-hint registered-time", atText(item.at)));
      if (item.state === "changed") row.appendChild(mk("span", "lit-hint", t("文件已改动")));
      if (item.kind === "figure" && /\.(png|jpe?g|gif|webp)$/i.test(item.path)) {
        const image = mk("img", "registered-figure"); image.alt = item.title || item.path; image.loading = "lazy";
        image.src = "/api/workspace/asset?path=" + encodeURIComponent(item.path); row.appendChild(image);
      }
      if ((item.table_preview || []).length) {
        const preview = mk("div", "registered-table"), table = mk("table");
        // 21.8: the values are the file's, drawn by the one number function (a long one to four significant digits, the value as
        // written on hover); the first row is the file's own header, as written
        const D = typeof window !== "undefined" ? window.RODesk : null;
        item.table_preview.forEach((cells, index) => {
          const tr = mk("tr");
          cells.forEach((cell) => {
            const td = mk(index ? "td" : "th", null, cell);
            if (index && D && typeof D.showNumber === "function") D.showNumber(td, cell);
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        preview.appendChild(table); row.appendChild(preview);
        row.appendChild(mk("span", "lit-hint", t("表格预览：最多显示 10 行、20 列。")));
      }
      if (variableDrafts && item.variable_card) {
        row.appendChild(mkButton(t("打开定义卡"), "ws-text-link", () => openVariableCard(item.variable_card)));
      } else if (variableDrafts) {
        const definition = item.definition || {};
        row.appendChild(mk("p", null, [definition.name, definition.meaning, definition.unit, definition.granularity].filter(Boolean).join(" · ")));
        if (definition.construction && definition.construction.formula) row.appendChild(mk("pre", null, definition.construction.formula));
        const id = mk("input", "form-input"); id.setAttribute("aria-label", t("变量 ID"));
        id.value = (item.path.split("/").pop() || "variable").replace(/\.toml$/i, "").replace(/[^A-Za-z0-9_-]/g, "_");
        const status = mk("p", "notice-status");
        const action = mkButton(t("导入为变量草稿"), "btn btn-small", async () => {
          const epoch = state.dataEpoch, project = state.currentPath;
          action.disabled = true;
          try {
            const saved = await apiPost("/api/outputs/variable", { project: project, path: item.path, id: id.value });
            if (epoch !== state.dataEpoch) return;
            openVariableCard(saved.id);
          } catch (err) { if (epoch === state.dataEpoch) { action.disabled = false; setStatus(status, "err", t("没能导入变量草稿。"), err); } }
        });
        action.disabled = item.state !== "current" || !!humanRecordsBlocked();
        row.append(id, action, status);
      }
      taskGroup(item).appendChild(row);
    });
    shown += 50;
    if (shown < items.length) box.appendChild(more);
  }
  appendNext();
  host.appendChild(box);
}

function versionLabel(v) {
  if (v.status === "unknown") return "v" + v.version + " · 状态暂不可知";
  if (v.status === "draft") return "v" + v.version + " · 草稿";
  if (v.status === "in_use") return "v" + v.version + " · 使用中";
  if (v.status === "superseded") return "v" + v.version + " · 已被 v" + v.superseded_by.version + " 取代（" + atText(v.superseded_by.at) + "）";
  if (v.status === "removed") return "v" + v.version + " · 已移除";
  if (v.status === "orphan_draft") return "v" + v.version + " · 未确认（不是最新编号）";
  return "v" + v.version + " · 已确认";
}

function defaultVersion(card) {
  const numbers = card.versions.map((v) => v.version);
  if (varState.version != null && numbers.indexOf(varState.version) >= 0) return varState.version;
  if (card.in_use != null) return card.in_use;
  if (card.draft != null) return card.draft;
  return numbers.length ? numbers[numbers.length - 1] : null;
}

function fieldRow(parent, label, value, cls) {
  const row = mk("div", "var-field");
  row.appendChild(mk("div", "var-field-label", label));
  const blank = value == null || (typeof value === "string" && !value.trim()) || (Array.isArray(value) && !value.length);
  const shown = blank ? "（未填写）" : Array.isArray(value) ? value.join("、") : String(value);
  row.appendChild(mk("div", "var-field-value" + (blank ? " var-empty-value" : cls ? " " + cls : ""), shown));
  parent.appendChild(row);
}

function varBlock(doc, title) {
  const block = mk("div", "var-block");
  block.appendChild(mk("h3", "var-block-title", title));
  doc.appendChild(block);
  return block;
}

// The five blocks of 9.11, as the researcher wrote them.
function renderDefinition(doc, content) {
  const c = content || {};
  const meaning = varBlock(doc, "含义");
  fieldRow(meaning, "含义", c.meaning);
  fieldRow(meaning, "单位", c.unit);
  fieldRow(meaning, "粒度", c.granularity);
  const inputs = varBlock(doc, "输入");
  if (!(c.input || []).length) inputs.appendChild(mk("div", "var-line soft", "（未填写）"));
  (c.input || []).forEach((item) => {
    const box = mk("div", "var-input");
    if (item.variable) fieldRow(box, "变量", item.variable, "path");
    else fieldRow(box, "数据文件", item.dataset, "path");
    if (item.fields) fieldRow(box, "字段", item.fields, "path");
    if (item.data_version != null) fieldRow(box, "数据版本", item.data_version);
    inputs.appendChild(box);
  });
  const cons = varBlock(doc, "构建口径");
  const k = c.construction || {};
  fieldRow(cons, "公式", k.formula, "formula");
  [["filter", "筛选"], ["aggregation", "聚合"], ["missing", "缺失处理"], ["transform", "变换"], ["params", "参数"]]
    .forEach(([key, label]) => fieldRow(cons, label, k[key]));
  const impl = varBlock(doc, "实现依据");
  const m = c.implementation || {};
  fieldRow(impl, "脚本", m.script, "path");
  if (m.chunk) fieldRow(impl, "代码块", m.chunk, "path");
  if (m.function) fieldRow(impl, "函数", m.function, "path");
  fieldRow(impl, "输出文件", m.output, "path");
  fieldRow(impl, "字段", m.field, "path");
  if (m.code_version) fieldRow(impl, "代码版本", m.code_version);
  const dec = varBlock(doc, "人工决策");
  const d = c.decision || {};
  fieldRow(dec, "理由", d.why);
  fieldRow(dec, "决定人", d.decided_by);
  fieldRow(dec, "采用日期", d.adopted_on);
}

async function openVariableCopy(cardId, entry, kind) {
  const subject = { kind: "variable-copy" };
  state.panelSubject = subject;
  panelTitle.textContent = kind === "code" ? "当时的代码" : "当时的文字";
  panelTitle.title = "";
  panelSubtitle.textContent = cardId + " · " + cardActText(entry);
  panelBody.innerHTML = "";
  panelBody.appendChild(mk("p", "empty-note", "载入中…"));
  openPanel();
  let data;
  try {
    data = await apiGet("/api/variables/" + (kind === "code" ? "code" : "frozen") +
      "?id=" + encodeURIComponent(cardId) + "&entry=" + encodeURIComponent(entry.id));
  } catch (err) {
    if (state.panelSubject !== subject) return;
    panelBody.innerHTML = "";
    const box = mk("div", "notice-status err");
    renderBlockingError(box, kind === "code" ? "无法读取当时的代码副本" : "无法读取当时的文字副本", err);
    panelBody.appendChild(box);
    return;
  }
  if (state.panelSubject !== subject) return;
  panelBody.innerHTML = "";
  panelBody.appendChild(mk("div", "fact-line", kind === "code"
    ? "确认时复制下来的脚本：.researchos/variables/" + data.copy + "（不会被改动）"
    : "确认时冻结的版本文字：" + data.frozen + "（不会被改动）"));
  if (data.truncated) panelBody.appendChild(mk("div", "truncated-note", "只显示了开头的部分。"));
  panelBody.appendChild(mk("pre", "var-code", data.text));
}

function confirmationSection(host, card, v) {
  const sec = mk("div", "var-section");
  sec.appendChild(mk("div", "var-section-title", "确认记录"));
  const entry = v.entry || {};
  sec.appendChild(mk("div", "var-line", "确认于 " + atText(v.confirmed_at) +
    (entry.act === "corrected" ? "；当前文字来自 " + atText(entry.at) + " 的更正" : "")));
  // The attestation was given at the confirmation, about the text confirmed
  // and the output then on disk: it is set beside THAT confirmation's own
  // checks, never beside a later correction's (9.11).
  const words = confirmationWording(v);
  const moment = words.moment;
  sec.appendChild(mk("div", "var-statement", words.statement));
  const checked = v.checked || {};
  const lines = [];
  ["script", "writes"].forEach((k) => { if (checked[k]) lines.push([k, checked[k]]); });
  (checked.reads || []).forEach((r) => lines.push(["reads", r]));
  if (checked.field) lines.push(["field", checked.field]);
  if (lines.length) sec.appendChild(mk("div", "var-section-title", words.checksTitle));
  lines.forEach(([k, item]) => {
    const cls = item.result === "已核对" ? " ok" : item.result === "不符" ? " bad" : " soft";
    const line = mk("div", "var-line" + cls, checkLine(k, item));
    if (k === "script" && item.copy && !v.code_missing) {
      line.appendChild(mkButton("查看当时的代码", "ws-text-link", () => openVariableCopy(card.id, entry, "code")));
    }
    sec.appendChild(line);
  });
  const observed = v.observed || {};
  if (observed.output || (observed.inputs || []).length) sec.appendChild(mk("div", "var-section-title", words.observedTitle));
  if (observed.output) sec.appendChild(mk("div", "var-line soft", observedLine("output", observed.output, moment)));
  (observed.inputs || []).forEach((i) => sec.appendChild(mk("div", "var-line soft", observedLine("input", i, moment))));
  if (v.copy_missing) sec.appendChild(mk("div", "var-line bad", v.copy_missing));
  if (v.reference) {
    sec.appendChild(mk("div", "var-line soft", "引用这一版：" + v.reference.label +
      (v.reference.resolves === false ? "（引用暂不可解析）" : "")));
  }
  (v.upstream || []).forEach((u) => sec.appendChild(mk("div", "var-line soft", "建立在 " + u.ref + " 之上" + (u.resolves ? "" : "（" + u.unresolvable + "）"))));
  (v.upstream_notes || []).forEach((n) => sec.appendChild(mk("div", "var-line", n)));
  host.appendChild(sec);
}

function draftActions(host, card, v) {
  const actions = mk("div", "var-actions");
  const status = mk("div", "notice-status");
  const buttons = [];
  const path = ".researchos/variables/" + card.id + "/" + v.file;
  const open = mkButton("在编辑器中打开", "btn", () => runOpenAction(path, false, status));
  actions.appendChild(open);
  const blocked = humanRecordsBlocked();
  const key = card.id + ":v" + v.version;
  if (blocked) {
    actions.appendChild(mk("span", "review-note", blocked));
  } else if (v.status === "draft") {
    const ask = mkButton("确认这一版", "btn btn-primary", () => {
      varState.asking = key;
      varState.askingHash = v.content_hash;
      loadVariablesView();
    });
    buttons.push(ask);
    actions.appendChild(ask);
  }
  host.append(actions);
  // 9.12: an answer belongs to the question that was shown. The draft was
  // saved again since the question opened: the question closes, and the
  // researcher reads the new text before answering.
  if (varState.asking === key && v.content_hash !== varState.askingHash) {
    varState.asking = null;
    varState.askingHash = null;
    host.appendChild(mk("div", "notice-status err", "草稿在提问之后又被改动了：请先看一遍现在的内容，再点「确认这一版」。"));
  }
  if (varState.asking === key && !blocked && v.status === "draft") {
    const box = mk("div", "var-ask");
    box.appendChild(mk("div", "notice-title", "确认之前，回答一个问题（只问这一次）"));
    box.appendChild(mk("p", null, "输出文件现在的内容，是按这一版口径生成的吗？你的回答会作为你本人的说明记下来；Research OS 不会凭文件指纹替你推断。"));
    const row = mk("div", "var-actions");
    [["yes", "是"], ["no", "否"], ["unknown", "不确定"]].forEach(([answer, label]) => {
      const b = mkButton(label, "btn", async () => {
        const res = await variableAction("confirm", { id: card.id, attested: answer, content_hash: varState.askingHash },
          status, buttons, "没能确认这一版");
        if (res) { varState.asking = null; varState.askingHash = null; varState.version = res.version; }
      });
      buttons.push(b);
      row.appendChild(b);
    });
    const cancel = mkButton("先不确认", "btn", () => { varState.asking = null; varState.askingHash = null; loadVariablesView(); });
    row.appendChild(cancel);
    box.appendChild(row);
    host.appendChild(box);
  }
  host.appendChild(status);
}

function inUseActions(host, card, v) {
  const blocked = humanRecordsBlocked();
  const actions = mk("div", "var-actions");
  const status = mk("div", "notice-status");
  if (blocked) {
    actions.appendChild(mk("span", "review-note", blocked));
    host.append(actions);
    return;
  }
  const buttons = [];
  if (card.draft == null) {
    const revise = mkButton("修订口径", "btn", () => variableAction("revise", { id: card.id }, status, buttons, "没能打开下一版草稿")
      .then((res) => { if (res) { varState.version = res.version; loadVariablesView(); } }));
    revise.title = "把这一版的文件原样复制为下一版草稿，在草稿里改";
    buttons.push(revise);
    actions.appendChild(revise);
  } else {
    actions.appendChild(mk("span", "review-note", "已有草稿 v" + card.draft + "：在草稿里改，确认后它取代这一版"));
  }
  const note = varNote("abandon:" + card.id, "弃用的理由（必填，用你自己的话）");
  const abandon = mkButton("弃用", "btn", () => {
    if (!note.value.trim()) { setStatus(status, "err", "请写下弃用的理由"); return; }
    variableAction("abandon", { id: card.id, note: note.value }, status, buttons, "没能弃用这个变量")
      .then((res) => { if (res) varState.notes.delete("abandon:" + card.id); });
  });
  buttons.push(abandon);
  actions.append(note, abandon);
  host.append(actions, status);
}

function renderVersion(host, card, v) {
  const doc = mk("div", "var-doc");
  if (v.status === "draft" || v.status === "orphan_draft") doc.appendChild(mk("div", "var-doc-label", v.label || "草稿 · 改动不留版本"));
  // A card whose log.toml cannot be trusted: no status is derived from it
  // -- never 「草稿」, which would say confirmed text may be edited freely.
  if (v.status === "unknown") doc.appendChild(mk("div", "var-doc-label", v.label || "记录文件无法使用，这一版的状态暂不可知"));
  if (v.error) {
    const err = mk("div", "notice-status err");
    renderBlockingError(err, v.file_state === "invalid"
      ? "这个版本文件有一处无法读取" + (v.line ? "（第 " + v.line + " 行）" : "")
      : "这个版本文件现在无法读取", v.error);
    doc.appendChild(err);
  }
  if (v.question && v.question_kind === "absent") {
    doc.appendChild(mk("div", "var-doc-label", "版本文件在确认后不见了；下面是确认时冻结的文字。"));
  } else if (v.question) {
    doc.appendChild(mk("div", "var-doc-label", "文件在确认后被改动了；下面是确认时的文字，改动没有生效。"));
  }
  if (v.content) renderDefinition(doc, v.content);
  else if (!v.error) doc.appendChild(mk("div", "var-line soft", "这个版本的文件不在了。"));
  host.appendChild(doc);
  if (v.status === "draft" || v.status === "orphan_draft") draftActions(host, card, v);
  if (v.entry) confirmationSection(host, card, v);
  if (v.status === "in_use" && !card.abandoned) inUseActions(host, card, v);
}

function questionNotice(card, q) {
  const box = notice("warn");
  noticeHead(box, q.message);
  box.appendChild(mk("p", null, q.kind === "absent"
    ? "现在生效的仍是确认时冻结的那一份文字。要把版本文件放回原处吗？"
    : q.kind === "unreadable"
      ? "这个文件现在读不出文字，Research OS 没有采用它，现在生效的仍是确认时冻结的那一份。"
      : "Research OS 没有采用改动后的文字，现在生效的仍是确认时的那一份。请告诉 Research OS 这次改动是什么："));
  const status = mk("div", "notice-status");
  const buttons = [];
  const help = q.kind === "absent" ? {
    new: "v" + q.version + " 的文件不在了，没有改动可以保留：按确认时冻结的副本原样放回。",
  } : q.kind === "unreadable" ? {
    new: "读不出的文件内容原样存为新草稿 v" + card.next_version + "（不丢任何字节）；v" + q.version + " 的文件按冻结副本原样放回。",
  } : {
    new: "改动后的文件原样成为新草稿 v" + card.next_version + "；v" + q.version + " 的文件按冻结副本原样放回。",
    correct: "这是更正（错字、表述更清楚、脚本换了位置）：记一条更正，前后两种文字都保留可读。",
  };
  if (humanRecordsBlocked()) {
    box.appendChild(mk("p", null, humanRecordsBlocked()));
    return box;
  }
  q.answers.forEach((answer) => {
    const row = mk("div", "answer");
    const b = mkButton(q.answer_labels[answer], "btn", () =>
      variableAction("answer", { id: card.id, question: "edited", answer: answer, version: q.version, content_hash: q.content_hash },
        status, buttons, "没能完成这个回答"));
    buttons.push(b);
    row.append(b, mk("span", "answer-help", help[answer] || ""));
    box.appendChild(row);
  });
  box.appendChild(status);
  return box;
}

function cardTrustNotice(card) {
  const trust = card.trust || {};
  if (card.state === "ok" && (!trust.state || trust.state === "ok")) return null;
  if (card.state === "frozen" && card.reason === "conflict" && card.dispute) return disputeNotice(card);
  if (trust.state === "shrunk") {
    const missing = trust.missing || [];
    const box = notice("warn");
    noticeHead(box, trust.message || "变量卡的记录文件比图谱少了 " + missing.length + " 条记录");
    box.appendChild(mk("p", null, "图谱记得下面这些记录，但卡片的 log.toml 里没有了。Research OS 什么都没改，等你决定以哪一份为准。"));
    const list = mk("ul", "entry-list");
    missing.forEach((m) => list.appendChild(mk("li", null, cardActText(m) + (m.note ? " · " + m.note : ""))));
    box.appendChild(list);
    const ids = missing.map((m) => m.id);
    const status = mk("div", "notice-status");
    const buttons = [];
    [["file", "以文件为准", "图谱忘掉这些记录；被移除的版本编号不再使用。"],
     ["restore", "把缺少的补回文件", "把这些记录按原样追加回 log.toml 末尾（标为补回）。"]].forEach(([answer, label, help]) => {
      const row = mk("div", "answer");
      const b = mkButton(label, "btn", () =>
        variableAction("answer", { id: card.id, question: "shrunk", answer: answer, missing: ids }, status, buttons, "没能完成这个回答"));
      buttons.push(b);
      row.append(b, mk("span", "answer-help", help));
      box.appendChild(row);
    });
    box.appendChild(status);
    return box;
  }
  const box = notice("bad");
  noticeHead(box, card.message || trust.message || "这张变量卡当前无法读取");
  box.appendChild(mk("p", null, "修好之前，这张卡的确认、弃用等动作都不会被记录；其他卡片照常。"));
  const raw = [card.detail || trust.detail].concat(card.problems || []).filter(Boolean).join("\n");
  if (raw) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", raw);
    box.appendChild(d);
  }
  return box;
}

// 9.12: two histories in a card's log are settled by naming what stands.
// Both histories side by side; 「以这一条为准」 beside each disputed
// confirmation; one confirm step that lists what will stand. Nothing is
// chosen for the researcher -- not by position, not by time.
const settleChoice = new Map(); // card id -> {version: entry id}

function disputeNotice(card) {
  const d = card.dispute;
  const box = notice("warn");
  noticeHead(box, "这张卡的记录里有两份历史（两处的记录被合并了）");
  box.appendChild(mk("p", null, "两台电脑（或两个副本）各自记下了不同的确认，同步后合在了一个 log.toml 里。" +
    "Research OS 不按先后、不按时间替你选：请为每个有争议的版本指明以哪一条为准。其余记录留在历史里，标为不再生效。"));
  const chosen = settleChoice.get(card.id) || {};
  settleChoice.set(card.id, chosen);
  const candidateOf = {};
  d.versions.forEach((v) => v.candidates.forEach((id) => { candidateOf[id] = v.version; }));
  const status = mk("div", "notice-status");
  const blocked = humanRecordsBlocked();
  const entryLine = (e) => {
    const line = mk("div", "var-line" + (chosen[candidateOf[e.id]] === e.id ? " chosen" : ""), cardActText(e));
    if (e.content) line.appendChild(mk("span", "var-id", " · 内容 " + String(e.content).slice(7, 15)));
    if (e.attested) line.appendChild(mk("span", "var-id", " · 说明：输出按此口径生成 — " + (ATTESTED_WORDS[e.attested] || e.attested)));
    if (e.frozen) line.appendChild(mkButton("查看这一条的文字", "ws-text-link", () => openVariableCopy(card.id, e, "frozen")));
    if (candidateOf[e.id] != null && !blocked) {
      const pick = mkButton(chosen[candidateOf[e.id]] === e.id ? "已选：以这一条为准" : "以这一条为准", "btn btn-small", () => {
        chosen[candidateOf[e.id]] = e.id;
        loadVariablesView();
      });
      line.appendChild(pick);
    }
    return line;
  };
  if (d.common.length) {
    const shared = mk("div", "var-history");
    shared.appendChild(mk("div", "var-history-title", "两份历史共有的记录"));
    d.common.forEach((e) => shared.appendChild(entryLine(e)));
    box.appendChild(shared);
  }
  const cols = mk("div", "var-histories");
  d.branches.forEach((branch, i) => {
    const col = mk("div", "var-history");
    col.appendChild(mk("div", "var-history-title", "第 " + (i + 1) + " 份历史（分开之后）"));
    if (!branch.length) col.appendChild(mk("div", "var-line soft", "这份历史在分开之后没有关于这张卡的记录"));
    branch.forEach((e) => col.appendChild(entryLine(e)));
    cols.appendChild(col);
  });
  box.appendChild(cols);
  if (blocked) { box.appendChild(mk("p", null, blocked)); return box; }
  const byId = {};
  const where = {};
  d.common.forEach((e) => { byId[e.id] = e; where[e.id] = "两份历史共有"; });
  d.branches.forEach((branch, i) => branch.forEach((e) => { byId[e.id] = e; where[e.id] = "第 " + (i + 1) + " 份历史"; }));
  const label = (id) => where[id] + "：" + cardActText(byId[id]) + (byId[id].content ? " · 内容 " + String(byId[id].content).slice(7, 15) : "");
  const missing = d.versions.filter((v) => !chosen[v.version]).map((v) => "v" + v.version);
  if (missing.length) {
    box.appendChild(mk("p", null, "还需要选：" + missing.join("、")));
  } else {
    const keeps = d.versions.map((v) => chosen[v.version]);
    const confirmBox = mk("div", "var-ask");
    confirmBox.appendChild(mk("div", "notice-title", "确认之后，以这些为准："));
    const list = mk("ul", "entry-list");
    d.versions.forEach((v) => list.appendChild(mk("li", null, "v" + v.version + " — " + label(chosen[v.version]))));
    confirmBox.appendChild(list);
    const off = d.shown.filter((id) => keeps.indexOf(id) < 0 && byId[id] && d.common.indexOf(byId[id]) < 0);
    // Shown in file order, as both histories list them.
    off.sort((x, y) => (byId[x].seq || 0) - (byId[y].seq || 0));
    if (off.length) {
      confirmBox.appendChild(mk("div", null, "这些记录留在历史里，但不再生效："));
      const offList = mk("ul", "entry-list");
      off.forEach((id) => offList.appendChild(mk("li", null, label(id))));
      confirmBox.appendChild(offList);
    }
    const buttons = [];
    const actions = mk("div", "var-actions");
    const go = mkButton("确认，以这些为准", "btn", () =>
      variableAction("settle", { id: card.id, keeps: keeps, shown: d.shown }, status, buttons, "没能记下这个选择")
        .then((res) => { if (res) settleChoice.delete(card.id); }));
    const clear = mkButton("重新选", "btn", () => { settleChoice.delete(card.id); loadVariablesView(); });
    buttons.push(go, clear);
    actions.append(go, clear);
    confirmBox.appendChild(actions);
    box.appendChild(confirmBox);
  }
  box.appendChild(status);
  return box;
}

function abandonedNotice(card) {
  const a = card.abandoned;
  const box = notice("");
  noticeHead(box, "已弃用 · " + atText(a.at));
  box.appendChild(mk("p", null, "你当时写下的理由：" + (a.note || "")));
  box.appendChild(mk("p", null, "弃用期间没有版本在使用；每个确认过的版本仍可被引用、仍可阅读。"));
  const status = mk("div", "notice-status");
  const blocked = humanRecordsBlocked();
  if (blocked) { box.appendChild(mk("p", null, blocked)); return box; }
  const actions = mk("div", "var-actions");
  const note = varNote("revive:" + card.id, "恢复的理由（必填）");
  const buttons = [];
  const revive = mkButton("恢复", "btn", () => {
    if (!note.value.trim()) { setStatus(status, "err", "请写下恢复的理由"); return; }
    variableAction("revive", { id: card.id, note: note.value }, status, buttons, "没能恢复这个变量")

  });

  actions.append(note, revive);

  return box;
}

// The stage-(b) comparison of one card's version in use: how far it looked,
// and -- when something moved -- the two answers.
function implementationSection(host, card, review) {
  const sec = mk("div", "var-section");
  sec.appendChild(mk("div", "var-section-title", "实现依据现在的样子（与 v" + review.version + " 最近一次" +
    (review.baseline_act === "reaffirmed" ? "确认口径未变" : review.baseline_act === "corrected" ? "更正" : "确认") +
    "时相比，" + atText(review.baseline_at) + "）"));
  sec.appendChild(mk("div", "var-line" + (review.script.state === "same" ? "" : review.script.state === "changed" || review.script.state === "region_missing" ? " bad" : " soft"),
    coverageLine(review.script, "script")));
  review.inputs.forEach((i) => sec.appendChild(mk("div", "var-line" + (i.state === "changed" ? " bad" : i.state === "same" ? "" : " soft"), coverageLine(i, "input"))));
  const large = review.inputs.some((i) => i.large && i.state === "same" && i.coverage !== "full");
  const status = mk("div", "notice-status");
  if (large && !humanRecordsBlocked()) {
    const actions = mk("div", "var-actions");
    const full = mkButton("完整比对", "btn btn-small", () =>
      variableAction("full-compare", { id: card.id }, status, [full], "没能完成完整比对"));
    full.title = "逐字节计算大文件的内容指纹，与确认时记下的比较（可能要一会儿）";
    actions.append(full, mk("span", "answer-help", "大文件只比较了大小；需要时可以逐字节比对。"));
    sec.appendChild(actions);
  }
  sec.appendChild(status);
  if (review.under_review) sec.appendChild(cardReviewMember(review, true));
  host.appendChild(sec);
}

// One card under review, with 「口径未变」 / 「口径已变」.
function cardReviewMember(review, standalone) {
  const box = mk("div", standalone ? "var-ask" : "var-member");
  const title = mk("div", "review-link", (review.name || review.card) + " · " + review.card + " v" + review.version);
  if (!standalone) {
    title.classList.add("clickable");
    title.addEventListener("click", () => openVariableCard(review.card));
  }
  box.appendChild(title);
  review.reasons.forEach((r) => box.appendChild(mk("span", "review-reason", r.label)));
  if (!standalone) {
    box.appendChild(mk("div", "var-line soft", coverageLine(review.script, "script")));
    review.inputs.forEach((i) => box.appendChild(mk("div", "var-line soft", coverageLine(i, "input"))));
  }
  box.appendChild(mk("p", "review-note", review.cannot_tell));
  const status = mk("div", "notice-status");
  const blocked = humanRecordsBlocked();
  if (blocked) {
    box.appendChild(mk("p", "review-note", blocked));
    return box;
  }
  const actions = mk("div", "var-actions");
  const buttons = [];
  const region = review.reasons.some((r) => r.code === "chunk_missing" || r.code === "function_missing");
  let dataVersion = null;
  if (review.needs_data_version && !region) {
    dataVersion = varNote("dv:" + review.card + ":" + review.signature, t("新的数据版本说明（必填），例：2017-01 至 2024-12，2026-10 重新下载"));
    actions.appendChild(dataVersion);
  }
  if (region) {
    box.appendChild(mk("p", "review-note", t("卡片指定的代码块或函数找不到了：如果只是改了名字，在卡片文件里改正 chunk / function，再回答「这是更正」；否则选「口径已变」。")));
  } else {
    const same = mkButton(t("口径未变"), "btn", () => {
      if (dataVersion && !dataVersion.value.trim()) { setStatus(status, "err", t("输入数据变了：请写下新的数据版本说明")); return; }
      const item = { id: review.card, version: review.version, signature: review.signature };
      if (dataVersion) item.data_version = dataVersion.value.trim();
      variableAction("reaffirm", { items: [item] }, status, buttons, t("没能记下口径未变"));
    });
    same.title = t("记下：实现变了，但这一版的口径没有变（附上现在的指纹）");
    buttons.push(same);
    actions.appendChild(same);
  }
  if (review.draft != null) {
    actions.appendChild(mk("span", "review-note", review.draft_note));
  } else {
    const changed = mkButton(t("口径已变"), "btn", () =>
      variableAction("revise", { id: review.card }, status, buttons, t("没能打开下一版草稿")));
    changed.title = t("打开下一版草稿，在草稿里写下新的口径");
    buttons.push(changed);
    actions.appendChild(changed);
  }
  box.append(actions, status);
  return box;
}

// The cards' part of the 待复核 list: one item per changed script.
function renderCardReviewGroups(host, cardItems) {
  host.appendChild(mk("div", "review-quiet-title", t("变量卡：实现依据有变化")));
  cardItems.groups.forEach((group) => {
    const box = mk("div", "review-item");
    if (group.script) {
      box.appendChild(mk("div", "review-link", group.script));
      box.appendChild(mk("span", "review-reason", group.message));
    } else {
      box.appendChild(mk("div", "review-link", t("输入数据")));
    }
    if (!group.counted) box.appendChild(mk("div", "review-note", t("已为它打开下一版草稿，不计入待复核数；确认草稿之后这一项自然消失。")));
    const status = mk("div", "notice-status");
    const answerable = group.cards.filter((m) => m.draft == null);
    const together = group.cards.length > 1 && answerable.length > 1 && !humanRecordsBlocked() &&
      answerable.every((m) => !m.needs_data_version && !m.reasons.some((r) => r.code !== "script_changed"));
    if (together) {
      const actions = mk("div", "var-actions");
      const all = mkButton(t("全部口径未变"), "btn btn-primary", () => variableAction("reaffirm", {
        items: answerable.map((m) => ({ id: m.card, version: m.version, signature: m.signature })),
      }, status, [all], t("没能全部记下口径未变")));
      all.title = t("为下面每张卡各记一条「口径未变」");
      actions.append(all, mk("span", "answer-help", t("下面 {n} 张卡各记一条；也可以逐个回答。", { n: answerable.length })));
      box.append(actions, status);
    }
    group.cards.forEach((m) => box.appendChild(cardReviewMember(m, false)));
    host.appendChild(box);

}

function renderVariableCard(host, card) {
  const back = mkButton("返回全部变量", "var-back", () => { varState.card = null; varState.version = null; loadVariablesView(); });
  host.appendChild(back);
  const head = mk("div", "var-head");
  head.append(mk("h2", "var-title", card.name), mk("span", "var-id", card.id));
  head.appendChild(mkButton("来龙去脉与备注", "var-back", () => RONode.openNode("variable:" + card.id)));
  cardChips({ state: card.state, reason: card.reason, abandoned: !!card.abandoned, in_use: card.in_use, draft: card.draft })
    .forEach(([text, cls]) => head.appendChild(mk("span", "var-chip " + cls, text)));
  host.appendChild(head);
  const related = mk("div", "var-research-records"), relatedEpoch = state.dataEpoch, relatedProject = state.currentPath;
  host.appendChild(related);
  apiGet("/api/workspace/research-records?variable=" + encodeURIComponent(card.id) + "&project=" + encodeURIComponent(relatedProject)).then((result) => {
    if (relatedEpoch === state.dataEpoch && relatedProject === state.currentPath && varState.card === card.id && window.ROWorkspace) window.ROWorkspace.renderResearchLinks(related, result.records);
  }).catch(() => {});
  const shownVersion = card.versions.find((v) => v.version === card.in_use) || card.versions[card.versions.length - 1];
  const aliases = shownVersion && shownVersion.content && shownVersion.content.aliases;
  if (aliases && aliases.length) host.appendChild(mk("div", "var-aliases", "尝试表里的写法：" + aliases.join("、")));
  const notes = mk("div", "notices");
  const trust = cardTrustNotice(card);
  if (trust) notes.appendChild(trust);
  if (card.abandoned) notes.appendChild(abandonedNotice(card));
  (card.questions || []).forEach((q) => notes.appendChild(questionNotice(card, q)));
  (card.dead_flags || []).forEach((f) => {
    const box = notice("warn");
    noticeHead(box, f.message);
    box.appendChild(mk("p", null, f.direction === "card_only"
      ? "这张卡已弃用，但 .researchos/attempts.toml 的已弃用变量列表里没有它的任何写法。"
      : "attempts.toml 把「" + (f.dead || []).join("、") + "」列为已弃用，但这张卡没有弃用。两处说法不一致，Research OS 不替你统一。"));
    notes.appendChild(box);
  });
  if (notes.childElementCount) host.appendChild(notes);
  if (!card.versions.length) {
    host.appendChild(mk("p", "empty-note", "这张卡还没有版本文件。"));
    return;
  }
  const selected = defaultVersion(card);
  const tabs = mk("div", "var-versions");
  card.versions.forEach((v) => {
    const b = mkButton(versionLabel(v), "var-version-btn" + (v.version === selected ? " active" : ""), () => {
      varState.version = v.version;
      loadVariablesView();
    });
    tabs.appendChild(b);
  });
  host.appendChild(tabs);
  const v = card.versions.find((x) => x.version === selected);
  if (card.implementation && v && v.version === card.implementation.version) implementationSection(host, card, card.implementation);
  if (v) renderVersion(host, card, v);
  const hist = mk("div", "var-section");
  // 21.7: the card's record is named in words (it is in the order it was written, which is the order of time); the file is under 详情
  hist.appendChild(mk("div", "var-section-title", t("这张卡的记录（按时间先后）")));
  if (!(card.history || []).length) hist.appendChild(mk("div", "var-line soft", card.state === "ok"
    ? t("还没有记录：草稿确认之前，这里什么都没有。")
    : t("这张卡的记录现在无法读取，暂时看不到（文件本身没有被改动）。")));
  (card.history || []).forEach((e) => {
    const line = mk("div", "var-line" + (e.in_force === false ? " off" : ""), cardActText(e) + (e.in_force === false ? "（不再生效）" : ""));
    if (e.attested) line.appendChild(mk("span", "var-id", " · 说明：输出按此口径生成 — " + (ATTESTED_WORDS[e.attested] || e.attested)));
    if (e.note) line.appendChild(mk("div", "entry-sub", "理由：" + e.note));
    if (e.frozen) line.appendChild(mkButton("查看这一版当时的文字", "ws-text-link", () => openVariableCopy(card.id, e, "frozen")));
    hist.appendChild(line);
  });
  hist.appendChild(storageDetails(".researchos/variables/" + card.id + "/log.toml"));
  host.appendChild(hist);
}
