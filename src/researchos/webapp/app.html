.basis-col { border: 1px solid var(--line); background: var(--paper); padding: 0.35rem 0.5rem; font-size: 0.78rem; word-break: break-word; }
.basis-col-title { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 0.1rem; }
.review-cands { margin: 0.5rem 0 0.2rem; font-size: 0.8rem; }
.review-cands-title { font-size: 0.75rem; color: var(--ink-soft); }
.review-cand { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: baseline; padding: 0.25rem 0; border-top: 1px dashed var(--line); }
.review-cand .review-link { flex: 1; min-width: 12rem; }
.review-branches { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
.review-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.55rem; align-items: center; }
.review-actions .form-input { flex: 1 1 100%; font-size: 0.8rem; }
.review-quiet-title { font-size: 0.8rem; color: var(--ink-soft); margin: 1.4rem 0 0.4rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--line); }
.review-quiet { font-size: 0.8rem; color: var(--ink-soft); padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
.review-quiet .review-link { color: var(--ink); }

.records-intro { font-size: 0.8rem; color: var(--ink-soft); margin: 0 0 0.4rem; }
.records-row { border-bottom: 1px solid var(--line); padding: 0.7rem 0; }
.records-head { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; justify-content: space-between; }
.records-kind { font-weight: 600; font-size: 0.88rem; }
.records-count { font-size: 0.84rem; margin-top: 0.15rem; }
.records-backup { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.15rem; }
.records-problem { font-size: 0.8rem; color: var(--clay); margin-top: 0.2rem; }
/* 12.13: the file names and the engine's own words, folded. */
.records-fold { margin-top: 0.2rem; }
.records-fold > .res-draft-summary { padding: 0.15rem 0; font-size: 0.8rem; color: var(--ink-soft); }
.records-fold[open] > .res-draft-summary .res-chevron { transform: rotate(90deg); }
.records-detail { display: flex; flex-wrap: wrap; gap: 0.2rem 0.6rem; align-items: baseline; font-size: 0.75rem; color: var(--ink-soft); padding: 0.1rem 0 0.1rem 1.1rem; overflow-wrap: anywhere; }
.records-engine { white-space: pre-wrap; }

/* -- 变量 (DESIGN.md 9.11, task V5 phase 9): the cards, set as a readable
   document. Ochre = waits for you (a question, a review), clay = wrong,
   olive = 已核对; the formula in mono; long text wraps. */
.var-intro { color: var(--ink-soft); font-size: 0.86rem; margin: 0 0 1rem; max-width: 720px; }
.var-new { margin: 0 0 1.1rem; }
.var-new-form { margin: 0.7rem 0 0; max-width: 640px; border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 0.8rem 1rem; }
.var-new-label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.3rem; }
.var-new-rules { font-size: 0.8rem; color: var(--ink-soft); margin: 0.45rem 0 0; }
.var-new-actions { display: flex; gap: 0.5rem; margin: 0.8rem 0 0; }

/* -- 设置 (DESIGN.md 21.7): this Mac's settings in the side panel, one section each -- */
.settings-section { margin: 0 0 1.6rem; }
.settings-title { font-family: var(--font-serif); font-size: 1rem; font-weight: normal; margin: 0 0 0.4rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--line); }
.settings-note { font-size: 0.8rem; color: var(--ink-soft); margin: 0.3rem 0 0.6rem; }
.settings-section .ws-agent-settings { margin: 0; padding: 0; background: none; }
.settings-llm .form-field { margin: 0 0 0.6rem; }
.attempt-draft-setting-link { font-size: 0.8rem; margin: 0.2rem 0 0.4rem; }
.lit-setting-line { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.9rem; }
.var-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem; padding: 0.65rem 0.35rem; margin: 0 -0.35rem; border-bottom: 1px solid var(--line); cursor: pointer; }
.var-row:hover { background: var(--paper-alt); }
.var-name { font-family: var(--font-serif); font-size: 1.02rem; }
.var-id { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); }
/* 12.11: the same quiet tinted text labels as the verdicts (.status-label),
   no outlined badges. */
.var-chip { font-size: 0.75rem; line-height: 1.5; padding: 0 0.4rem; background: var(--paper-alt); color: var(--ink-soft); white-space: nowrap; }
.var-chip.in-use { background: var(--olive-soft); color: var(--olive); }
.var-chip.is-draft { background: var(--ochre-soft); color: var(--ochre); }
.var-chip.dead { background: var(--gray-soft); color: var(--gray); }
.var-chip.bad { background: var(--clay-soft); color: var(--clay); }
.var-chip.wait { background: var(--ochre-soft); color: var(--ochre); }
.var-back { font: inherit; font-size: 0.82rem; color: var(--ink-soft); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; margin-bottom: 0.9rem; }
.var-back:hover { color: var(--ink); }
.var-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.7rem; margin-bottom: 0.4rem; }

.var-ask { border: 1px solid var(--ochre); background: var(--ochre-soft); padding: 0.7rem 0.9rem; margin-top: 0.7rem; font-size: 0.86rem; }
.var-code { margin: 0; padding: 0.7rem 0.8rem; background: var(--paper-alt); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.76rem; line-height: 1.5; white-space: pre; overflow-x: auto; }
.var-member { border-top: 1px dashed var(--line); padding-top: 0.5rem; margin-top: 0.5rem; }
/* 9.12: two histories of a card's log, side by side, and what will stand */
.var-histories { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.8rem; margin: 0.6rem 0; }
.var-history { border: 1px solid var(--line-strong); background: var(--paper); padding: 0.55rem 0.7rem; min-width: 0; }

/* -- 文献 (DESIGN.md 11.4): per draft, its citations. Olive = 已对上, ochre =
   waits for you (candidates), gray = 未找到; the text as written in the
   serif, the reference beneath it in small sans. */
.lit-setting { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 0.6rem 0.85rem; margin: 0 0 0.9rem; max-width: 820px; }
.lit-setting-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer; }
.lit-setting-note { font-size: 0.8rem; color: var(--ink-soft); margin: 0.2rem 0 0 1.6rem; }
.lit-zotero { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 0.6rem; }
.lit-summary { font-family: var(--font-serif); font-size: 1.08rem; margin: 0.4rem 0 0.8rem; }
.lit-note { font-size: 0.82rem; color: var(--clay); margin: -0.4rem 0 0.8rem; }

.lit-draft-head { padding: 0.6rem 0.35rem; color: var(--ink-soft); font-size: inherit; }

.lit-draft-head:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.lit-file { font-family: var(--font-mono); font-size: 0.82rem; word-break: break-all; }
.lit-counts { font-size: 0.78rem; color: var(--ink-soft); }
.lit-cites { padding: 0 0 0.6rem 1.6rem; }
.lit-cite { padding: 0.5rem 0; border-top: 1px dashed var(--line); }
.lit-cite:first-child { border-top: none; }
.lit-cite-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.6rem; }
.lit-line { font-size: 0.75rem; color: var(--ink-soft); white-space: nowrap; }
.lit-text { font-family: var(--font-serif); font-size: 0.98rem; word-break: break-word; }
.lit-ref { margin: 0.25rem 0 0 0; padding-left: 0.7rem; border-left: 2px solid var(--olive); }
.lit-cands .lit-ref { border-left-color: var(--ochre); margin-top: 0.35rem; }
.lit-ref-text { font-size: 0.84rem; word-break: break-word; }
.lit-ref-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.8rem; font-size: 0.76rem; margin-top: 0.1rem; }
.lit-how { color: var(--ink-soft); }
.lit-link, .lit-link-btn { font: inherit; font-size: 0.76rem; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.lit-link:hover, .lit-link-btn:hover { color: var(--ink); }
.lit-judge { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 0.3rem; }
.lit-hint { font-size: 0.76rem; color: var(--ink-soft); }
.lit-quiet { font-size: 0.8rem; color: var(--ink-soft); margin: 0.3rem 0 1rem; }
.lit-quiet-file { font-family: var(--font-mono); font-size: 0.78rem; padding: 0.1rem 0; word-break: break-all; }
.lit-tabs { display: flex; gap: 1rem; border-bottom: 1px solid var(--line); margin-bottom: 1.2rem; }
.lit-tab { font: inherit; color: var(--ink-soft); border: 0; border-bottom: 2px solid transparent; background: none; padding: 0.4rem 0; cursor: pointer; }
.lit-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.lit-library-tools { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
.lit-search { width: min(100%, 420px); box-sizing: border-box; font: inherit; font-size: 0.86rem; padding: 0.5rem 0.6rem; color: var(--ink); background: var(--paper-alt); border: 1px solid var(--line-strong); border-radius: 0; }
.lit-search:focus-visible { outline: 1px solid var(--ink); outline-offset: 1px; }
.lit-library-grid { display: grid; grid-template-columns: minmax(230px, 34%) minmax(0, 1fr); gap: 1.8rem; align-items: start; }
.lit-library-list { max-height: 72vh; overflow-y: auto; border-right: 1px solid var(--line); padding-right: 0.8rem; }
.lit-library-item { display: block; width: 100%; box-sizing: border-box; font: inherit; text-align: left; color: var(--ink); background: none; border: 0; border-left: 2px solid transparent; border-bottom: 1px solid var(--line); padding: 0.8rem; cursor: pointer; }
.lit-library-item:hover, .lit-library-item.active { background: var(--paper-alt); }
.lit-library-item.active { border-left-color: var(--ink); }
.lit-library-item-title { display: block; font-family: var(--font-serif); line-height: 1.5; overflow-wrap: anywhere; }
.lit-library-meta { display: block; font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.35rem; overflow-wrap: anywhere; }
.lit-reader { min-width: 0; }
.lit-reader h2 { font-family: var(--font-serif); font-weight: normal; font-size: 1.4rem; line-height: 1.5; margin: 0 0 0.6rem; overflow-wrap: anywhere; }
.lit-reader h3 { font-weight: normal; font-size: 1rem; margin: 1.5rem 0 0.7rem; }
.lit-abstract { white-space: pre-wrap; line-height: 1.8; overflow-wrap: anywhere; margin: 0 0 0.7rem; }
.lit-reader-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin: 1rem 0; }
.lit-reader-sources { margin-top: 1.5rem; font-size: 0.8rem; color: var(--ink-soft); }
.lit-reader-sources button { display: block; overflow-wrap: anywhere; text-align: left; margin-top: 0.5rem; }
.word-preview { font-size: .95rem; line-height: 1.85; overflow-wrap: anywhere; }
.word-preview p { white-space: pre-wrap; }
.word-preview h1, .word-preview h2, .word-preview h3 { font-family: var(--font-serif); font-weight: normal; line-height: 1.5; }
.word-preview h1 { font-size: 1.5rem; }
.word-preview h2 { font-size: 1.3rem; }
.word-preview h3 { font-size: 1.1rem; }
.preview-format-note { font-family: var(--font-sans); font-size: .78rem; color: var(--ink-soft); margin: 0 0 1.2rem; }
.word-table-wrap { max-width: 100%; overflow-x: auto; margin: 1rem 0; }
.word-table { border-collapse: collapse; font-size: .84rem; }
.word-table td { padding: .4rem .6rem; border: 1px solid var(--line); white-space: pre-wrap; min-width: 3rem; }
@media (max-width: 850px) {
  .lit-library-grid { grid-template-columns: minmax(0, 1fr); }
  .lit-library-list { max-height: 32vh; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
}

/* 研究路线, 提议, 成员 (DESIGN.md 12.3, 12.4, 12.9; V8 U4, team.js): weight
   and space carry the hierarchy (12.11); labels are quiet tints. */
.routes, .team { display: flex; flex-direction: column; gap: 1.9rem; max-width: 860px; }
.route-group-title { margin: 0 0 0.45rem; font-weight: 600; font-size: 1rem; }
.route-group-title.serif, .team-title { font-family: var(--font-sans); font-weight: 600; font-size: 1rem; margin: 0 0 0.45rem; }
.route-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.route-row { padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
.route-head { display: flex; flex-wrap: wrap; gap: 0.3rem 0.7rem; align-items: baseline; }
.route-num { flex: none; min-width: 2.6rem; color: var(--ink-soft); }
.route-date { flex: none; min-width: 4.6rem; font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.route-title { font: inherit; font-size: 0.92rem; font-weight: 500; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer; text-align: left; border-bottom: 1px solid transparent; }
.route-title:hover { border-bottom-color: var(--ink); }
.route-title:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.route-basis { margin: 0.3rem 0 0 3.3rem; }
.route-fact { font-size: 0.84rem; margin: 0.1rem 0; white-space: pre-wrap; word-break: break-word; }
.route-src { font-size: 0.75rem; color: var(--ink-soft); margin-left: 0.6rem; }
.route-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: baseline; margin-top: 0.3rem; }
.route-proposals { border-left: 2px solid var(--ochre); padding-left: 0.9rem; }
.team-line { font-size: 0.86rem; margin: 0.25rem 0; word-break: break-word; }
.team-line .mono { margin: 0 0.25rem; }
.team-flash { display: flex; flex-direction: column; gap: 0.3rem; border-left: 2px solid var(--olive); padding-left: 0.8rem; }
.team-line.quiet { color: var(--ink-soft); }
.team-line.warn { color: var(--clay); }
.team-line.strong, .strong { font-weight: 600; }
.team-line.writes { color: var(--ink-soft); font-size: 0.8rem; border-left: 2px solid var(--line-strong); padding-left: 0.6rem; margin: 0.5rem 0; }
.team-help { font-size: 0.76rem; color: var(--ink-soft); }
.team-done { font-size: 0.88rem; color: var(--olive); margin: 0; }
.team-path-row { display: flex; gap: 0.5rem; align-items: center; }
.team-path-row .form-input { flex: 1; min-width: 0; }
.team-block .form-field, .compose .form-field, .decide .form-field, .panel-body .form-field { margin: 0.45rem 0; max-width: 560px; }
.team-block > .btn, .decide > .btn, .draft > .btn { margin-top: 0.3rem; }
.team-table { border-collapse: collapse; font-size: 0.84rem; width: 100%; max-width: 820px; }
.team-table th { text-align: left; font-weight: normal; color: var(--ink-soft); font-size: 0.76rem; padding: 0.3rem 0.8rem 0.3rem 0; border-bottom: 1px solid var(--line-strong); }
.team-table td { padding: 0.4rem 0.8rem 0.4rem 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.team-table td.team-name, .team-table td.team-role { white-space: nowrap; }
.team-table td.team-email { overflow-wrap: break-word; }
.team-table td.team-fp { word-break: break-all; }
.team-you { font-size: 0.75rem; color: var(--ink-soft); margin-left: 0.4rem; }
.team-me { display: flex; gap: 0.8rem; align-items: baseline; margin: 0.2rem 0; }
.team-me-name { font-weight: 600; }
.team-key { white-space: pre-wrap; word-break: break-all; background: var(--paper-alt); border: 1px solid var(--line); padding: 0.5rem 0.6rem; margin: 0.4rem 0; max-width: 640px; user-select: all; }
.team-pending summary, .proposal-diff summary { cursor: pointer; font-size: 0.82rem; color: var(--ink-soft); margin: 0.3rem 0; }
.team-pending > .res-draft-summary, .proposal-diff > .res-draft-summary, .lit-reader-sources > .res-draft-summary { padding: 0.15rem 0; gap: 0.45rem; }
.evidence { padding: 0.6rem 0 0.9rem; border-bottom: 1px solid var(--line); }
.evidence-files, .proposal-files { list-style: none; margin: 0; padding: 0; }
.evidence-file, .proposal-file { padding: 0.45rem 0; border-bottom: 1px solid var(--line); }
.evidence-role { font-size: 0.75rem; color: var(--ink-soft); flex: none; }
.evidence-sha { color: var(--ink-soft); font-size: 0.75rem; word-break: break-all; }
.evidence-text { font-family: var(--font-mono); font-size: 0.75rem; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); padding: 0.5rem 0.6rem; max-height: 360px; overflow: auto; white-space: pre; }
.evidence-file > .btn { margin-top: 0.3rem; }
.proposal-page .node-sec { max-width: 860px; }
.proposal-part { margin: 0 0 0.9rem; }
.proposal-h4 { font-size: 0.82rem; font-weight: 600; margin: 0.9rem 0 0.3rem; }
.decide { padding: 0.5rem 0 0.8rem; border-bottom: 1px solid var(--line); }
.compose { display: flex; flex-direction: column; gap: 0.2rem; max-width: 640px; }
.compose > .btn { align-self: flex-start; margin-top: 0.4rem; }
.compose-kinds { display: flex; flex-direction: column; gap: 0.3rem; margin: 0.3rem 0 0.4rem; }
.compose-kind { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.86rem; cursor: pointer; }
.compose-kind-name { min-width: 5.5rem; }
.compose-result:not(:empty), .join-result:not(:empty) { margin-top: 0.9rem; }
.draft { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; }
.draft > .btn { align-self: flex-start; }
.draft .node-sec-title { font-size: 1rem; }
.draft-file { padding: 0.2rem 0; border-bottom: 1px solid var(--line); }
.draft-file label { cursor: pointer; }
.join-fp { margin: 0.5rem 0; padding: 0.5rem 0.7rem; border-left: 2px solid var(--ink); background: var(--paper); }
.join-fp .mono { font-size: 0.86rem; word-break: break-all; }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }

@media (max-width: 720px) {
  main#main { padding: 1.25rem 1rem 3rem; }
  .topbar { padding: 1rem 1rem 0.75rem; }
  .sidebar { width: 196px; }
}
/* A narrow window: the column below the map, the two scrolled together. */
@media (max-width: 960px) {
  .desk-layout { flex-direction: column; overflow-y: auto; }
  .desk-map { flex: none; height: 62vh; }
  .routes-pane { flex: none; overflow-y: visible; }
  .desk-column { width: auto; overflow-y: visible; border-left: none; border-top: 1px solid var(--line-strong); }
  .desk-column.folded { width: auto; padding: 0.6rem 2rem; align-items: flex-start; }
  .desk-column.folded .desk-column-title { writing-mode: horizontal-tb; letter-spacing: 0; }
}

<div id="app">
  <!-- DESIGN.md 12.9: the sidebar replaces the tabs -- the project switcher

<script>
"use strict";

// -- The interface language (DESIGN.md 13.6) ---------------------------------
// t() gives the words for the screen, looked up at call time in /i18n.js's
// table; without it (a block run alone) the Chinese, its {name} values
// filled. uiLang() is the language every API request names (apiGet/apiPost).
function fillVars(s, v) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { return v && Object.prototype.hasOwnProperty.call(v, k) ? String(v[k]) : m; }); }
function t(s, v) { var I = typeof window !== "undefined" && window.ROI18N; return I ? I.t(s, v) : fillVars(s, v); }
function uiLang() { return typeof window !== "undefined" && window.ROI18N && window.ROI18N.lang === "en" ? "en" : "zh"; }
// A stored time as this Mac's own time (DESIGN.md 21.8), through RODesk.whenWords, the one function that converts: "full" is
// 2026-10-30 16:33, "day" 2026-10-30. What is no time with hours and minutes -- a label, a day, nothing -- comes back as it was
// written (a block run alone, without desk.js, shows every time as written).
function stampText(at, form) {
  const text = at == null ? "" : String(at);
  const D = typeof window !== "undefined" ? window.RODesk : null;
  return (D && typeof D.whenWords === "function" && D.whenWords(text, new Date(), form || "full")) || text;
}

// -- Small shared state ------------------------------------------------------
// attemptsById is populated once per Tree-view load from /api/attempts (which
// carries the full record -- attrs, verdict, result) and keyed by node id so
// clicking an attempt row in the tree (built from /api/tree, a slimmer shape)
// can show the complete record without a second round trip per click.
// projectLabel is the current project's registry label (task V3 phase 1),
// filled by loadProjects() and shown in the header line instead of the raw
// path (which stays reachable as the line's hover title).
// panelSubject remembers what the slide-out panel is currently showing
// ({kind: "attempt", id}, {kind: "file", path}, or {kind: "attempt-form"},
// null when closed), so an auto-refresh (task V3 phase 2) can re-validate
// it: an attempt whose record survived the re-ingest is re-rendered in
// place, one that vanished closes the panel instead of showing stale data.
// An open edit form is left alone entirely -- yanking a half-typed form
// out from under the user is never acceptable, and the write path
// re-validates against the file's real state server-side anyway.
// attemptStatuses are /api/attempts' `statuses` (DESIGN.md 21.3), read with the records: what the status chooser offers.
// attemptsConfig is /api/summary's echo of .researchos/attempts.toml (file +
// [columns] names, task V3 phase 3) -- the edit form is built from these,
// never from hardcoded column labels; null means no usable config.
// projectState is the degraded-project condition currently on screen
// ("graph_missing" / "graph_downloading", null when healthy) -- it decides
// whether the header chip shows.
// dataEpoch counts project switches so a fetch that started for the
// previous project never lands in this one -- see "Attempt records" below.
const state = {
  attemptsById: new Map(), projectLabel: "", panelSubject: null,
  attemptStatuses: [], // the statuses a research assessment can have here (21.3), with /api/attempts' records
  attemptsConfig: null, projectState: null,
  dataEpoch: 0,
  headerError: false, // the header line holds a blocking error (showHeaderError)
  // V5 (DESIGN.md 9.3-9.6): the last /api/summary (what the record needs
  // from the researcher: a migration, an untrusted ledger, the shrink
  // question, a read-only open), the migration preview fetched for it,
  // a write refused because the folder moved under the page, and notes
  // an answer left to read (dismissed by the researcher).
  summary: null, migrationInfo: null, projectMoved: false, sessionNotes: [],
  noticeBusy: false, noticeSig: null, reviewOffer: null,
  // DESIGN.md Section 10 (task V6): /api/projects as last read (the menu is
  // built from it when opened), whether the engine serves no project at
  // all (10.1), and the last scan end this page has accounted for
  // (undefined: take the next status as the baseline; null: none yet).
  projects: [], currentPath: "", currentId: null, currentEntry: null, noProject: false,
  scanSeen: undefined,
  // DESIGN.md 11.2 (task V7): GET /api/github as last read (null: not yet),
  // and whether 「从 GitHub 获取最新状态」 is running.
  github: null, githubFetching: false,
};

// -- fetch wrappers: every failure becomes a readable Error, never a console-only one --
// A failure additionally carries the server's machine-readable `state` when
// it named one (see researchos/webapp/server.py's ApiError.state): the two
// degraded-project conditions DESIGN.md section 8.10 rule 2 gives this page
// its own product language for. Matching on that name rather than on the
// English message is the whole point -- a reworded engine string must never
// silently change what the user reads.

const PROJECT_STATES = {
  graph_missing: {
    chip: "项目不可用 — 图谱文件已不存在",
    title: "图谱文件已不存在",
    body: "这个项目的图谱文件不在了。可以在上方切换到别的项目；要重建图谱，在项目目录里运行 researchos init，再运行 researchos ingest。",
  },
  graph_downloading: {
    chip: "图谱文件正在从云端下载…",
    title: "图谱文件正在从云端下载",
    body: "系统把图谱文件收进了 iCloud，正在取回。下载完成后页面会自动恢复，不用重开。",
  },
  // DESIGN.md 9.4: the identity check found a question to answer first (a
  // copy, an original that cannot be checked, a lost identity file) or the
  // project folder is gone. The engine's own sentence for the situation
  // (body.situation.message) is shown under this one.
  project_blocked: {
    chip: "项目需要你先确认",
    title: "打开这个项目之前，需要你先做一个选择",
    body: "确认之前 Research OS 不会写入任何东西。可以在上方切换到别的项目；也可以在终端里运行 researchos status 查看原因和可用的 researchos project 命令。",
  },
};

function apiError(path, res, body) {
  const err = new Error((body && body.error) ? body.error : ("请求 " + path + " 失败：HTTP " + res.status));
  err.status = res.status;
  if (body && typeof body.state === "string") err.state = body.state;
  if (body && body.situation && typeof body.situation === "object") err.situation = body.situation;
  // A refusal that names its own product sentence (a variable card's,
  // `message_zh`): shown in place of the caller's framing.
  if (body && typeof body.message_zh === "string" && body.message_zh) err.messageZh = body.message_zh;
  // DESIGN.md Section 10's refusals carry their Chinese sentence as
  // `message` and the engine's own text as `detail` (shown behind 「详情」);
  // an add refusal carries the fresh look at the folder (`inspection`).
  if (body && typeof body.message === "string" && body.message) err.engineMessage = body.message;
  if (body && typeof body.detail === "string" && body.detail) err.detail = body.detail;
  if (body && typeof body.file === "string" && body.file) err.file = body.file; // 16.2: the file a draft refused, as typed
  if (body && body.inspection && typeof body.inspection === "object") err.inspection = body.inspection;
  // 11.2: a file panel refused (a binary file) still carries its GitHub link.
  if (body && body.github && typeof body.github === "object") err.github = body.github;
  // 11.3: a refused push carries its refusals, the command to run, the new plan.
  if (body && Array.isArray(body.blockers)) err.blockers = body.blockers;
  if (body && typeof body.command === "string" && body.command) err.command = body.command;
  if (body && body.plan && typeof body.plan === "object") err.plan = body.plan;
  return err;
}

function projectStateOf(err) {
  return (err && err.state && PROJECT_STATES[err.state]) ? err.state : null;
}

async function apiGet(path) {
  let res;
  try {
    res = await fetch(path, { headers: { "Accept": "application/json", "X-ResearchOS-Lang": uiLang() } });
  } catch (err) {
    throw new Error("请求 " + path + " 时网络出错：" + err.message);
  }
  const text = await res.text();
  let body = null;
  if (text) {
    try {
      body = JSON.parse(text);
    } catch (err) {
      throw new Error("无法把 " + path + " 的响应解析为 JSON：" + err.message);
    }
  }
  if (!res.ok) {
    const err = apiError(path, res, body);
    // 9.4: the folder moved (or was claimed) under this page -- said once,
    // above the views, with 「重新打开」, whichever request found it.
    if (err.state === "project_moved" && !state.projectMoved) {
      state.projectMoved = true;
      renderNotices();
    }
    throw err;
  }
  return body;
}

async function apiPost(path, payload) {
  let res;
  try {
    res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-ResearchOS-Lang": uiLang() },
      body: JSON.stringify(payload),
    });
  } catch (err) {
    throw new Error("请求 " + path + " 时网络出错：" + err.message);
  }
  const text = await res.text();
  let body = null;
  if (text) {
    try {
      body = JSON.parse(text);
    } catch (err) {
      throw new Error("无法把 " + path + " 的响应解析为 JSON：" + err.message);
    }
  }
  if (!res.ok) {
    const err = apiError(path, res, body);
    // 9.4: a write refused because the folder moved (or was claimed
    // elsewhere) under this page -- the page says so until it is reopened.
    if (err.state === "project_moved" && !state.projectMoved) {
      state.projectMoved = true;
      renderNotices();
    }
    throw err;
  }
  return body;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// -- Judgment wording (pure; DESIGN.md 9.3, 9.6, 9.12) -----------------------
// How a ledger entry, a basis and a link under review read in product
// language. Pure functions of their arguments -- tests/test_v5_phase7.py
// loads this block into node -- used by the 待复核 list, the shrink
// question and (at run time) canvas.js's link card and hover text. A
// migrated entry's time is the migration's, so it is never shown as when
// the researcher judged (9.12): it reads MIGRATED_AT_LABEL instead. What the
// desk's 待复核 panel shows is in the screen's language (14.6): the maps'
// words through t() where they are read (each has an English entry).
const MIGRATED_AT_LABEL = "迁移自旧索引（原连线确认的时间未知）";
const VERDICT_WORDS = { confirmed: "确认", rejected: "否决", withdrawn: "撤回", undone: "撤销" };
const VIA_WORDS = { canvas: "在关系图上", cli: "在命令行里", mcp: "通过 MCP" };
const LINK_VERBS = {
  reads: "读取", writes: "写出", generates: "生成", backed_by: "依据", includes: "引用",
  cites: "引用文献", produces: "产出", implements: "实现", uses: "使用", supports: "支持",
  authored_by: "作者是", belongs_to: "属于", derives_from: "源自",
};
const NODE_KIND_WORDS = { claim: "论断", experiment: "实验", commit: "提交", paper: "论文", reference: "文献", attempt: "尝试" };
const BASIS_RECORDED_WORDS = {
  "at-migration": "（迁移时核对过）", "last-known": "（最近一次读到时）", "old-index": "（旧索引里的记录）",
};

// A 9.6 candidate the old verdict was already applied to (its link now
// carries that verdict): said, never offered again -- one click, one entry.
function candidateApplied(candidate, verdict) {
  return !!candidate && (verdict === "confirmed" || verdict === "rejected") && candidate.status === verdict;
}

function verdictWord(verdict) {
  return Object.prototype.hasOwnProperty.call(VERDICT_WORDS, verdict) ? t(VERDICT_WORDS[verdict]) : String(verdict || "");
}

// When an entry was made, in this Mac's time (9.3 kept the machine's own words; 21.8 reads the instant). An entry a
// migration made has no time of its own: it shows its label (9.12).
function whenText(entry) {
  if (!entry) return "";
  if (entry.migrated) return entry.at_label || t("迁移自旧索引（原连线确认的时间未知）");
  return stampText(entry.at);
}

// The facts a judgment rested on (9.6's table), one readable line each.
function basisLines(basis) {
  if (basis == null || typeof basis !== "object") return [];
  const keys = Object.keys(basis);
  if (!keys.length) return [t("只凭这条关联本身")];
  const series = (xs) => [].concat(xs).join(t("、"));
  return keys.map((k) => {
    const v = basis[k];
    if (k === "calls") return t("调用：{calls}", { calls: series(v) });
    if (k === "artifacts") return t("产物：{artifacts}", { artifacts: series(v) });
    if (k === "sentence") return t("论断：「{sentence}」", { sentence: v });
    if (k === "number") return t("数值：{number}", { number: v });
    if (k === "old_index") {
      // 9.5 step 2: the old index held several bases at once; each is kept
      // as it was stored (canonical JSON), never merged into one.
      const each = [].concat(v).map((b) => {
        let parsed = b;
        try { parsed = typeof b === "string" ? JSON.parse(b) : b; } catch (err) { return String(b); }
        return parsed && typeof parsed === "object" ? basisLines(parsed).join(t("，")) : String(b);
      });
      return t("旧索引里记着几种不同的依据：{bases}", { bases: each.join(" / ") });
    }
    if (k === "metrics") {
      const names = v && typeof v === "object" ? Object.keys(v).map((n) => n + " = " + v[n]) : [];
      return t("指标：{metrics}", { metrics: names.length ? series(names) : t("没有对得上的指标") });
    }
    // 11.4: a `cites` link rests on how the draft wrote the citation, the
    // DOI of the reference-list entry it matched, and that entry's text.
    if (k === "cited") return t("文中的引用：{cited}", { cited: series([].concat(v).map(citedText)) });
    if (k === "entry_dois") {
      const dois = [].concat(v).filter(Boolean);
      return dois.length ? t("文末条目的 DOI：{dois}", { dois: series(dois) }) : "";
    }
    if (k === "entries") return t("文末条目：{entries}", { entries: series([].concat(v).map((e) => t("「{entry}」", { entry: e }))) });
    return t("{key}：{value}", { key: k, value: typeof v === "string" ? v : JSON.stringify(v) });
  }).filter(Boolean);
}

// One citation as a `cites` basis holds it -- `doi:<doi>` or the folded
// `surname|year` -- in the reader's terms: 「DOI 10.x/y」, 「holland 1986」.
function citedText(key) {
  const s = String(key || "");
  if (s.startsWith("doi:")) return "DOI " + s.slice(4);
  const bar = s.lastIndexOf("|");
  return bar > 0 ? s.slice(0, bar) + " " + s.slice(bar + 1) : s;
}

function basisText(basis) {
  const lines = basisLines(basis);
  return lines.length ? lines.join("；") : "（没有记录依据）";
}

// One end of a link, as a person names it: the file's basename, or for a
// claim / experiment / ... its kind and file; a reference (11.4) by its
// title when the payload carries it, else by what its id says -- the whole
// DOI, the draft's reference-list entry, or 「Zotero 里的一篇文献」.
function endName(id, title) {
  const s = String(id || "");
  if (s.startsWith("ref:")) return refEndName(s, title);
  const colon = s.indexOf(":");
  const kind = colon > 0 ? s.slice(0, colon) : "";
  const rest = colon > 0 ? s.slice(colon + 1) : s;
  const file = rest.split("#")[0];
  const base = file.split("/").filter(Boolean).pop() || file || rest;
  return Object.prototype.hasOwnProperty.call(NODE_KIND_WORDS, kind) ? t("{kind}（{name}）", { kind: t(NODE_KIND_WORDS[kind]), name: base }) : base;
}

function refEndName(id, title) {
  const shown = title ? String(title) : "";
  if (shown) return t("文献《{title}》", { title: shown.length > 60 ? shown.slice(0, 59) + "…" : shown });
  if (id.startsWith("ref:doi:")) return t("文献（DOI {doi}）", { doi: id.slice("ref:doi:".length) });
  if (id.startsWith("ref:entry:")) {
    const rest = id.slice("ref:entry:".length);
    const hash = rest.lastIndexOf("#");
    const draft = hash >= 0 ? rest.slice(0, hash) : rest;
    const base = draft.split("/").filter(Boolean).pop() || draft;
    return hash >= 0 ? t("{draft} 的文末条目第 {n} 条", { draft: base, n: rest.slice(hash + 1) }) : t("{draft} 的文末条目", { draft: base });
  }
  return t("Zotero 里的一篇文献");
}

// A link {src, dst, type} in product language: 「17.Rmd 读取 panel.csv」.
function linkText(key) {
  const verb = Object.prototype.hasOwnProperty.call(LINK_VERBS, key.type) ? t(LINK_VERBS[key.type]) : t("关联");
  return endName(key.src, key.src_title) + " " + verb + " " + endName(key.dst, key.dst_title);
}

// Who did what, when, from where: 「2026-10-04 21:15 · 你在画布上否决」.
function historyEntryText(entry) {
  const what = entry.verdict === "undone" ? t("撤销了上一步")
    : entry.verdict === "withdrawn" ? t("撤回了连线确认") : verdictWord(entry.verdict);
  const when = whenText(entry);
  if (entry.migrated) return when + " · " + what;
  if (entry.via === "recovered") return t("{when} · 补回文件里缺少的连线确认：{what}", { when: when, what: what });
  const via = Object.prototype.hasOwnProperty.call(VIA_WORDS, entry.via) ? t(VIA_WORDS[entry.via]) : "";
  return via ? t("{when} · 你{via}{what}", { when: when, via: via, what: what }) : t("{when} · 你{what}", { when: when, what: what });
}

// The basis a verdict was made on, for its history line ("" for an undo
// or a withdrawal, which rest on nothing of their own).
function historyBasisText(entry) {
  if (entry.verdict !== "confirmed" && entry.verdict !== "rejected") return "";
  if (entry.basis_recorded === "not-produced") return "依据：当时的扫描没有得出这条关联";
  if (entry.basis == null) return "依据：没有记录";
  return "依据 · " + basisText(entry.basis) + (BASIS_RECORDED_WORDS[entry.basis_recorded] || "");
}

// The hover line of a link whose old judgment waits (9.6): 「你曾于
// 2026-10-04 否决 · 依据已变化，待复核」. `j` is a link's `judgement`.
function reviewHoverText(j) {
  if (!j) return "";
  if (j.outcome === "conflict") return "记录冲突，待处理";
  const who = j.migrated
    ? "你曾" + verdictWord(j.verdict) + "（" + (j.at_label || MIGRATED_AT_LABEL) + "）"
    : "你曾于 " + stampText(j.at, "day") + " " + verdictWord(j.verdict);
  return who + " · " + (j.label || "依据已变化") + "，待复核";
}

// DESIGN.md Section 10: the add-project endpoints' codes. Their sentence
// comes from the engine (`message`), because some name a project (「这个
// 文件夹在项目「X」里面」) or a rule (a display name's three limits).
const ENGINE_SENTENCE_CODES = new Set([
  "inspected_changed", "waiting_permission", "missing", "not_a_folder", "unreadable", "top_level",
  "system_folder", "researchos_home", "inside_project", "contains_project", "bad_path", "bad_label", "bad_request",
  "unknown_project", "not_registered", "scan_running", "frozen", "blocked", "not_a_project", "no_index",
  "lock_failed", "no_project",
]);

function blockingErrorText(framing, err) {
  const code = err && typeof err === "object" ? err.state : null;
  if (typeof code === "string" && Object.prototype.hasOwnProperty.call(BLOCKING_ERROR_TEXT, code)) return BLOCKING_ERROR_TEXT[code];
  if (err && typeof err === "object" && typeof err.messageZh === "string" && err.messageZh) return err.messageZh;
  if (typeof code === "string" && ENGINE_SENTENCE_CODES.has(code) && typeof err.engineMessage === "string" && err.engineMessage) {
    return err.engineMessage;
  }
  return framing;
}

// Replaces `el`'s content with the sentence, the 「详情」 toggle and the
// (collapsed) raw text. `err` is an Error from apiGet/apiPost or a plain
// engine string (a contained post-write ingest failure).
function renderBlockingError(el, framing, err) {
  el.textContent = "";
  el.title = "";
  const text = document.createElement("span");
  text.className = "err-text";
  // In the screen's language where the sentence has an English entry (the
  // desk's refusals, 14.6) -- its key is its Chinese, as every t() key is:
  // the page's table, the engine's Chinese, or a framing already worded by
  // its caller; the others stay Chinese until 13.7's increment for errors.
  text.textContent = t(blockingErrorText(framing, err));
  el.appendChild(text);
  const raw = (err && typeof err === "object" && typeof err.detail === "string" && err.detail) ? err.detail
    : err instanceof Error ? err.message : (err == null ? "" : String(err));
  if (!raw) return;
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "err-detail-toggle has-chevron";
  toggle.textContent = t("详情");
  toggle.setAttribute("aria-expanded", "false");
  const detail = document.createElement("span");
  detail.className = "err-detail hidden";
  detail.textContent = raw;
  toggle.addEventListener("click", (e) => {
    e.stopPropagation(); // a canvas chip dismisses on click; this click is not that
    const open = detail.classList.toggle("hidden") === false;
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  el.append(toggle, detail);
}

// DESIGN.md 8.8: what the user reads is the Chinese framing; the engine's
// English stays out of the visible text (adversarial review of the V4 work)
// and sits one click away behind 「详情」 (8.8 "Errors": a view that failed
// to show is as blocked as a failed action, so no hover-only reason). This
// box is what any view (the canvas included) falls back to for an error
// that is not one of the project states -- e.g. a legacy graph whose
// migration failed its integrity check.
function renderErrorBox(container, err) {
  container.innerHTML = "";
  const box = document.createElement("div");
  box.className = "error-box";
  const title = document.createElement("div");
  title.className = "error-title";
  title.textContent = "出了点问题";
  const msg = document.createElement("div");
  renderBlockingError(msg, "引擎返回了错误，这一页没能显示。", err);
  box.append(title, msg);
  container.appendChild(box);
}

// -- Degraded project state (DESIGN.md section 8.10 rules 1-2) ---------------
// A read that fails with a known state does NOT get the generic error box:
// it gets one clay chip in the header (raw engine message on hover) and one
// product-language note where the view would have been. The project menu
// (「项目：<名称> ▾」, shown always since DESIGN.md 10.1) stays usable,
// because switching away is the one action that can fix this from here.

const projectStateChip = document.getElementById("project-state");

function setProjectState(err) {
  const name = projectStateOf(err);
  if (!name) return false;
  state.projectState = name;
  // 9.4: a registry entry whose folder is gone says exactly that.
  projectStateChip.textContent = (err.situation && err.situation.situation === "missing")
    ? SITUATION_TITLES.missing : PROJECT_STATES[name].chip;
  projectStateChip.title = err.message;
  projectStateChip.classList.remove("hidden");
  // Rule 2's one-message rule, applied the moment the state appears rather
  // than on the next poll tick (refreshChip is declared further down; this
  // only ever runs after the whole script has loaded).
  if (refreshChip.classList.contains("err")) hideRefreshChip();
  return true;
}

function clearProjectState() {
  if (!state.projectState) return;
  state.projectState = null;
  projectStateChip.classList.add("hidden");
  projectStateChip.textContent = "";
  projectStateChip.title = "";
}

function renderStateNote(container, err) {
  const name = projectStateOf(err);
  container.innerHTML = "";
  if (name === "project_blocked" && err.situation && typeof err.situation === "object") {
    // DESIGN.md 9.4: the question itself, with its answers as buttons.
    container.appendChild(renderSituation(err));
    return;
  }
  const box = document.createElement("div");
  box.className = "state-note";
  box.title = err.message; // the engine's own English, folded onto the hover
  const title = document.createElement("div");
  title.className = "state-note-title";
  title.textContent = PROJECT_STATES[name].title;
  const body = document.createElement("p");
  body.textContent = PROJECT_STATES[name].body;
  box.append(title, body);
  if (err.situation && typeof err.situation.message === "string" && err.situation.message) {
    const why = document.createElement("p");
    why.textContent = err.situation.message;
    box.insertBefore(why, body);
  }
  container.appendChild(box);
}

// Every view load funnels its failure through here: a known project state
// degrades in product language, anything else is still an error box.
function renderViewFailure(container, err) {
  if (setProjectState(err)) renderStateNote(container, err);
  else renderErrorBox(container, err);
}

// 研究路线 (18.3) is one view, "desk" -- the name Section 14 gave the route
// map's page --, showing the route map or the grouped list beside 等你处理;
// 数据与代码 is the lineage report with 关系图 (the canvas) beside it.
const views = {

  canvas: document.getElementById("view-canvas"),

  proposals: document.getElementById("view-proposals"),

  node: document.getElementById("view-node"),
};
let currentView = null;

const SECTION_OF_VIEW = {
  workspace: "workspace",
  desk: "routes", results: "results", lineage: "data", canvas: "data",
  variables: "variables", literature: "literature", proposals: "proposals", members: "members",
  node: null, // the section it was opened from (RONode.section)

const SECTION_TITLES = {
  workspace: "项目首页",
  routes: "研究路线", results: "图表与论断", variables: "变量", literature: "文献",

// language. SECTION_TITLES above stays the Chinese, which node.js's
// 「返回…」 link still reads until the node page's increment (13.7).
function sectionTitle(section) {
  const titles = {
    workspace: t("项目首页"),
    routes: t("研究路线"), results: t("图表与论断"), variables: t("变量"), literature: t("文献"),
    data: t("数据与代码"), proposals: t("提议"), members: t("成员"),

let lastDataView = "lineage"; // 数据与代码 reopens on the list or 关系图, as last left

// The last view (tab) is remembered per browser: a per-viewer convenience
// Section 8 does not decide either way, so every storage access is wrapped
// -- a private window or blocked site data simply starts on 决策树. The
// canvas's SCOPE is deliberately NOT remembered: 8.7 decides it defaults to
// the current attempt (see canvas.js, fetchCanvas).
const VIEW_STORAGE_KEY = "rce.view";

function storedView() {
  try {
    const stored = window.localStorage.getItem(VIEW_STORAGE_KEY);
    const v = stored === "tree" ? "desk" : stored; // 18.3: the old 研究路线 list is a mode of the one page
    return v && v !== "node" && Object.prototype.hasOwnProperty.call(views, v) ? v : null;
  } catch (err) {
    return null;
  }
}

const FULL_WINDOW_VIEWS = ["canvas", "desk"];

// Returns the canvas's load when this call started one, so a command that
// acts on the canvas (适应全部 from the menu) can wait for it.
function activateView(name) {
  if (!Object.prototype.hasOwnProperty.call(views, name)) name = "workspace";
  // 18.3: a project of one person has no 提议 page. Whatever asks for it -- a menu built before 18.3, a view
  // kept from another project -- lands on 开始协作, the team setup, instead of on a page about nothing.
  if (name === "proposals" && window.RODesk && RODesk.onePerson && RODesk.onePerson()) return startCollaborating();
  if (currentView === name) return null;
  if (currentView === "workspace" && window.ROWorkspace && !ROWorkspace.mayLeave()) return null;
  // 14.3: the desk's panel (no backdrop) belongs to the desk -- leaving it
  // closes it, after asking when something in it is half typed; declined,
  // the desk stays. Every way to another view comes through here.
  if (currentView === "desk" && window.RODesk && RODesk.leaveDesk && !RODesk.leaveDesk()) return null;
  currentView = name;
  // A node page is not remembered: it reopens on the section it came from.
  try { window.localStorage.setItem(VIEW_STORAGE_KEY, name === "node" ? RONode.section() : name); } catch (err) { /* convenience only */ }
  const section = name === "node" ? SECTION_OF_VIEW[RONode.section()] : SECTION_OF_VIEW[name];
  if (section === "data") lastDataView = name;
  document.querySelectorAll(".side-item").forEach((btn) => {
    if (btn.dataset.section === section) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
  document.querySelectorAll(".subnav-item[data-subview]").forEach((btn) => {
    btn.setAttribute("aria-selected", String(btn.dataset.subview === name));
  });
  document.getElementById("data-switch").classList.toggle("hidden", section !== "data" || name === "node");
  // 研究路线's switch (18.3) belongs to the page, not to a node page opened from it.
  document.getElementById("routes-switch").classList.toggle("hidden", section !== "routes" || name === "node");
  document.getElementById("page-title").textContent = sectionTitle(section);
  // 新增尝试 belongs to the attempts (研究路线); the native menu still
  // reaches the form from anywhere.
  document.getElementById("new-attempt-btn").classList.toggle("hidden", section !== "routes");
  Object.entries(views).forEach(([key, node]) => node.classList.toggle("hidden", key !== name));
  // The canvas and the desk's route map (14.1) want the whole window below
  // the header, not the reading column the text views use.
  document.body.classList.toggle("canvas-mode", FULL_WINDOW_VIEWS.includes(name) && !state.noProject);
  if (state.noProject) return null; // 10.1: every section shows only the welcome
  if (name === "workspace" && !views.workspace.dataset.loaded) return ROWorkspace.load(views.workspace);
  // 17.3: an agent run may have moved on while another section was shown; the
  // project home follows it again (its own poll stops when it is not on screen).
  if (name === "workspace" && typeof ROWorkspace.resume === "function") ROWorkspace.resume();
  if (name === "desk" && !views.desk.dataset.loaded) RODesk.loadDesk(views.desk);
  else if (name === "desk") RODesk.resume(); // drawn already: shown the way it is now kept
  if (name === "node" && !views.node.dataset.loaded) RONode.loadNode(views.node);
  if (name === "results" && !views.results.dataset.loaded) RONode.loadResults(views.results);
  if (name === "proposals" && !views.proposals.dataset.loaded) ROTeam.loadProposals(views.proposals);
  if (name === "members" && !views.members.dataset.loaded) ROTeam.loadMembers(views.members);
  if (name === "lineage" && !views.lineage.dataset.loaded) loadLineageView();
  if (name === "variables" && !views.variables.dataset.loaded) loadVariablesView();
  if (name === "literature" && !views.literature.dataset.loaded) loadLiteratureView();
  if (name === "canvas") {
    if (!views.canvas.dataset.loaded) return RCECanvas.load(views.canvas);
    RCECanvas.activate();
  }
  return null;
}

// a member sent, the official version) are read afresh each time the
// researcher goes to them: those acts do not move the project's generation
// on this machine. 提议 always opens on the list (inbox or 我的提议).
const SHARED_STATE_VIEWS = ["desk", "proposals", "members"];
document.querySelectorAll(".side-item").forEach((btn) => {

// block, or 建立成员名单 -- whose sidebar item such a project does not show. Read afresh, as the sidebar's own

// -- Project summary line (decorative; a failure here is not shown as an
// error box since neither view depends on it -- /api/tree and /api/lineage
// surface the same "project not initialized" failure prominently already
// whenever it actually matters) -------------------------------------------

function basename(path) {
  const parts = String(path).split("/").filter(Boolean);
  return parts.length ? parts[parts.length - 1] : String(path);
}

// A blocked action's error in the header line (8.8 "Errors": switching
// project, removing missing ones, stopping the service, the Finder
// commands). It stays until the researcher clicks the line or a later
// action of theirs rewrites it: the summary refresh every generation bump
// makes (an editor autosave, a knit) must not wipe it unread (verifier
// finding), so loadProjectSummary leaves the line alone meanwhile.
// Since DESIGN.md 10.1 the line is two parts: the project menu's button
// (always there) and the message part beside it, which holds either the
// counts or such an error.
function showHeaderError(framing, err) {
  renderBlockingError(document.getElementById("project-line-msg"), framing, err);
  state.headerError = true;
}

document.getElementById("project-line-msg").addEventListener("click", (e) => {
  if (!state.headerError || e.target.closest(".err-detail")) return; // reading the detail is not dismissing
  loadProjectSummary(true);
});

// `force`: a researcher's action rewrites the line, a header error included.
async function loadProjectSummary(force) {
  const line = document.getElementById("project-line-msg");
  if (force) state.headerError = false;
  if (state.noProject) {
    // 10.1: no project, no summary to ask for (it would only be refused).
    state.summary = null;
    renderNotices();
    if (!state.headerError) { line.textContent = ""; line.title = ""; }
    return;
  }
  try {
    const data = await fetchSummary();
    if (!data) return; // the project was switched meanwhile; its own refresh is under way
    // V5: what the record needs from the researcher rides on the same
    // fetch (notices above the views), whatever the header line shows.
    state.summary = data;
    renderNotices();
    if (data.needs_migration) ensureMigrationInfo(data);
    if (state.headerError) return;
    // The project's name is the menu button's (registry label, else the
    // folder's name -- never the raw path, which lives on as its hover
    // title); this part carries the counts.
    if (!state.projectLabel) setProjectMenuLabel(basename(data.project_root), data.project_root);
    line.textContent = "";
    line.title = "";
    const part = (text) => {
      const span = document.createElement("span");
      span.className = "line-part";
      span.textContent = text;
      return span;
    };
    // 12.0: no counters for their own sake -- only what the researcher can
    // act on from here (the old judgments whose basis changed).
    void part;
    if (typeof data.review === "number" && data.review > 0) {
      // 9.6: an old judgment waiting for review (or a record conflict) is
      // counted here, never in 待确认; the count opens the list.
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "review-count-btn line-part has";
      btn.id = "review-count";
      // 13.5: a plural in English, its thousands separated ("1,497"); the Chinese as it was.
      btn.textContent = t("{n} 项待复核", { n: uiLang() === "en" ? groupedNumber(data.review) : data.review });
      btn.title = t("查看依据变了的旧连线确认和变量卡");
      btn.addEventListener("click", (e) => { e.stopPropagation(); if (mayReplacePanel()) openReviewPanel(null); });
      line.append(btn);
    }
    // The edit form's column names (attemptsConfig, above) ride along on
    // this same fetch (task V3 phase 3) -- kept fresh so a config edit
    // mid-serve is picked up by the next summary refresh, not only by a
    // full page reload.
  } catch (err) {
    state.summary = null;
    renderNotices();
    if (state.headerError) return;
    line.textContent = "";
    line.title = "";
  }
}

// -- The project menu (DESIGN.md 10.1, 10.4; task V6) --------------------------
// 「项目：<名称> ▾」 is the project line's one button, shown always -- with
// one project, with none, while degraded (switching away is the one repair
// a degraded project offers from here). It replaces the V3 <select> and the
// separate 「移除失效项目」 button. Its menu offers only entries
// /api/projects returned -- the server additionally enforces registry
// membership on switch, rename and remove, so the menu can never introduce
// a path; a new folder comes in only through the add dialog, which has the
// engine look at it first. Keyboard: Enter / Space / ↓ on the button opens
// it on its first item, ↑ ↓ Home End move, Esc closes (or leaves the rename
// / remove step), Tab and a click outside close it.

const projectMenuBtn = document.getElementById("project-menu-btn");
const projectMenu = document.getElementById("project-menu");
const projectMenuWrap = document.getElementById("project-menu-wrap");
// The name shown for no project: looked up when it is drawn, in the language then in force (13.6), not once when the
// page loads.
function noProjectName() { return t("还没有项目"); }
let projectMenuMode = "list"; // "list" | "rename" | "remove"

// 12.11: the button is the project's display name and nothing else; that
// it opens a menu is said by the control itself (aria-haspopup) and by the
// 「项目」 line above it, never by a glyph.
function setProjectMenuLabel(label, path) {
  projectMenuBtn.textContent = label || noProjectName();
  projectMenuBtn.title = path ? path + "\n" + t("切换项目或管理列表") : t("添加项目");
}

// The menu's mark for the open project: a drawn check (12.11), not a glyph
// (inline SVG through the HTML parser, which needs no namespace URL).
const CHECK_MARK_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2 6.5l2.5 2.5L10 3"/></svg>';

// 10.1: no project yet. Every tab shows only the welcome; nothing asks
// the engine for a project's data (it would only be refused).
function setNoProject(flag) {
  state.noProject = !!flag;
  document.body.classList.toggle("no-project", state.noProject);
  document.body.classList.toggle("canvas-mode", !state.noProject && FULL_WINDOW_VIEWS.includes(currentView));
  if (state.noProject) clearProjectState();
}

async function loadProjects() {
  let data;
  try {
    data = await apiGet("/api/projects");
  } catch (err) {
    // A registry hiccup must not take the header down: the button stays,
    // with what it last knew. Each view surfaces its own real errors.
    postShellTitle();
    return;
  }
  const projects = Array.isArray(data.projects) ? data.projects : [];
  const noProject = !!data.no_project || data.current == null;
  const current = noProject ? "" : String(data.current);
  const currentId = noProject ? null : (data.current_id || null);
  if (state.currentPath && current !== state.currentPath && window.ROWorkspace && ROWorkspace.isDirty()) {
    ROWorkspace.projectChangedElsewhere();
    return false;
  }
  state.projects = projects;
  state.currentPath = current;
  state.currentId = currentId;
  state.currentBlocked = !!data.blocked;
  state.currentEntry = noProject ? null : (projects.find(matchesCurrent) || null);
  // Registry label, else the folder's name -- never the raw path, which
  // lives on as the button's hover title.
  state.projectLabel = noProject ? "" : (state.currentEntry ? state.currentEntry.label : (data.current_label || basename(current)));
  state.projectCount = projects.length;
  setProjectMenuLabel(state.projectLabel, current);
  setNoProject(noProject);
  if (projectMenuOpen() && projectMenuMode === "list") {
    // Re-rendered with what is true now, keeping the keyboard where it was.
    const focused = menuItems().indexOf(document.activeElement);
    renderProjectMenu();
    if (focused >= 0) focusMenuItem(focused);
  }
  postShellTitle(); // on load and after every switch (reloadAllViews)
}

function projectMenuOpen() {
  return !projectMenu.classList.contains("hidden");
}

function isCurrentEntry(p) {
  return !state.noProject && matchesCurrent(p);
}

// Whether the registry entry `p` is the served folder (state.currentPath /
// currentId / currentBlocked, as loadProjects just set them).
function matchesCurrent(p) {
  if (p.path === state.currentPath && (!state.currentId || !p.id || p.id === state.currentId)) return true;
  // The same project at another spelling of its folder -- but never while
  // a question is open: a copy carries its original's id from another
  // folder, and is not that entry (10.2: it shows the name chosen for it).
  return !state.currentBlocked && !!(state.currentId && p.id && p.id === state.currentId);
}

function menuItems() {
  return Array.from(projectMenu.querySelectorAll('[role="menuitem"], [role="menuitemradio"]')).filter((el) => !el.disabled);
}

function focusMenuItem(index) {
  const items = menuItems();
  if (items.length) items[(index + items.length) % items.length].focus();
}

function openProjectMenu(focusFirst) {
  projectMenuMode = "list";
  renderProjectMenu();
  projectMenu.classList.remove("hidden");
  projectMenuBtn.setAttribute("aria-expanded", "true");
  if (focusFirst) focusMenuItem(0);
  loadProjects(); // a folder can come back or go away between two opens
  loadGitHub(); // 11.2: local refs only, no network
}

function closeProjectMenu(returnFocus) {
  if (!projectMenuOpen()) return;
  projectMenu.classList.add("hidden");
  projectMenu.innerHTML = "";
  projectMenuMode = "list";
  projectMenuBtn.setAttribute("aria-expanded", "false");
  if (returnFocus) projectMenuBtn.focus();
}

function pmItem(text, onClick, opts) {
  const o = opts || {};
  const b = mk("button", "pm-item" + (o.cls ? " " + o.cls : ""));
  b.type = "button";
  b.tabIndex = -1;
  b.setAttribute("role", o.role || "menuitem");
  if (!o.noMark) {
    const mark = mk("span", "pm-mark");
    if (o.mark) mark.innerHTML = CHECK_MARK_SVG;
    b.appendChild(mark);
  }
  b.appendChild(mk("span", "pm-label", text));
  if (o.flag) b.appendChild(mk("span", "pm-flag", o.flag));
  if (o.title) b.title = o.title;
  b.disabled = !!o.disabled;
  b.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!b.disabled) onClick();
  });
  return b;
}

function renderProjectMenu() {
  projectMenu.innerHTML = "";
  if (projectMenuMode === "rename" && state.currentEntry) { renderRenameStep(); return; }
  if (projectMenuMode === "remove" && (state.projects || []).length) { renderRemoveStep(); return; }
  projectMenuMode = "list";
  const projects = state.projects || [];
  if (!projects.length && (state.noProject || state.currentEntry)) {
    projectMenu.appendChild(mk("div", "pm-empty", t("列表里还没有项目")));
  }
  if (!state.noProject && !state.currentEntry && state.currentPath) {
    // Served, but not in the list (a folder opened read-only from the add
    // dialog, say): said, so the menu never claims another one is open.
    const it = pmItem(state.projectLabel || basename(state.currentPath), () => closeProjectMenu(true), {
      role: "menuitemradio", mark: true, flag: t("不在列表里"), title: state.currentPath,
    });
    it.setAttribute("aria-checked", "true");
    projectMenu.appendChild(it);
  }
  projects.forEach((p) => {
    const current = isCurrentEntry(p);
    const gone = !!(p.missing || !p.available);
    // A pre-V5 entry with no index cannot be opened from here (`researchos init`
    // first); an entry with an id and no index is rebuilt on open (9.4).
    const uninitialized = !gone && !p.initialized && !p.id;
    const row = mk("div", "pm-row" + (gone ? " pm-missing" : ""));
    const main = pmItem(p.label, () => chooseProject(p), {
      role: "menuitemradio", mark: current, title: p.path,
      flag: gone ? t("找不到文件夹") : (uninitialized ? t("未初始化") : ""),
      disabled: !current && (gone || uninitialized),
    });
    main.setAttribute("aria-checked", current ? "true" : "false");
    row.appendChild(main);
    if (gone && p.id) row.appendChild(pmItem(t("选择新位置…"), () => relocateFromMenu(p), { cls: "pm-sub", noMark: true }));
    projectMenu.appendChild(row);
  });
  const rule = mk("hr", "pm-rule");
  rule.setAttribute("role", "separator");
  projectMenu.appendChild(rule);
  if (renderGitHubMenu()) {
    const gitRule = mk("hr", "pm-rule");
    gitRule.setAttribute("role", "separator");
    projectMenu.appendChild(gitRule);
  }
  // 11.3: for every served project -- linked, without a remote (a private
  // repository is offered), or not a git repository (the panel explains).
  projectMenu.appendChild(pmItem(t("推送到 GitHub…"), () => { closeProjectMenu(false); openPushDialog(); }, { disabled: state.noProject }));
  // 18.3: a project of one person has no 成员 in the sidebar; the team setup is opened from here.
  if (window.RODesk && RODesk.onePerson && RODesk.onePerson()) {
    projectMenu.appendChild(pmItem(t("开始协作…"), () => { closeProjectMenu(false); startCollaborating(); }));
  }
  projectMenu.appendChild(pmItem(t("新建项目…"), () => { closeProjectMenu(false); ROWorkspace.openCreateProject(); }));
  projectMenu.appendChild(pmItem(t("添加项目…"), () => { closeProjectMenu(false); openAddDialog(); }));
  projectMenu.appendChild(pmItem(t("从公盘加入项目…"), () => { closeProjectMenu(false); ROTeam.openJoinDialog(); }));
  const status = mk("div", "pm-status");
  const rescan = pmItem(t("重新扫描这个项目"), () => rescanFromMenu(status, rescan), { disabled: state.noProject });
  projectMenu.appendChild(rescan);
  projectMenu.appendChild(pmItem(t("重命名显示名称…"), () => {
    projectMenuMode = "rename";
    renderProjectMenu();
  }, { disabled: !state.currentEntry }));
  projectMenu.appendChild(pmItem(t("从列表中移除…"), () => {
    projectMenuMode = "remove";
    renderProjectMenu();
  }, { disabled: !projects.length }));
  projectMenu.appendChild(status);
}

// -- GitHub in the project menu (DESIGN.md 11.2, task V7) ----------------------
// A project whose git remote is on GitHub gets one line, 「GitHub：owner/repo」
// (a link to the repository, opened outside the app), its state as of the
// last fetch, and 「从 GitHub 获取最新状态」 -- the only network Research OS does
// here, only on that click (POST /api/github/fetch; `git fetch`, never a
// pull or a merge). Nothing for a project that is not linked.

// Only a link the engine built for github.com is ever put in an href.
function githubHref(url) {
  if (typeof url !== "string") return null;
  let u;
  try {
    u = new URL(url);
  } catch (err) {
    return null;
  }
  return (u.protocol === "https:" && u.host === "github.com" && !u.username && !u.password) ? u.href : null;
}

function externalLink(text, url) {
  const href = githubHref(url);
  if (!href) return mk("span", null, text);
  const a = mk("a", null, text);
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

async function loadGitHub() {
  if (state.noProject) { state.github = null; return; }
  const epoch = state.dataEpoch;
  let data;
  try {
    data = await apiGet("/api/github");
  } catch (err) {
    return; // the menu simply has no GitHub line; the views say their own errors
  }
  if (epoch !== state.dataEpoch) return;
  state.github = data && typeof data === "object" ? data : null;
  if (projectMenuOpen() && projectMenuMode === "list") {
    const focused = menuItems().indexOf(document.activeElement);
    renderProjectMenu();
    if (focused >= 0) focusMenuItem(focused);
  }
}

// Appends the GitHub lines; true when there were any.
function renderGitHubMenu() {
  const gh = state.github;
  if (state.noProject || !gh || !gh.linked) return false;
  const line = mk("div", "pm-github");
  line.append(t("GitHub："), externalLink(gh.owner + "/" + gh.repo, gh.url));
  projectMenu.appendChild(line);
  projectMenu.appendChild(mk("div", "pm-github-state", state.githubFetching ? t("正在从 GitHub 获取…") : (gh.message || "")));
  const status = mk("div", "pm-status");
  const fetchItem = pmItem(state.githubFetching ? t("正在从 GitHub 获取…") : t("从 GitHub 获取最新状态"),
    () => fetchGitHub(status, fetchItem), { disabled: state.githubFetching });
  projectMenu.appendChild(fetchItem);
  projectMenu.appendChild(status);
  return true;
}

async function fetchGitHub(statusEl, button) {
  if (state.githubFetching) return;
  state.githubFetching = true;
  button.disabled = true;
  button.querySelector(".pm-label").textContent = t("正在从 GitHub 获取…");
  const epoch = state.dataEpoch;
  try {
    const data = await apiPost("/api/github/fetch", {});
    state.githubFetching = false;
    if (epoch !== state.dataEpoch) return;
    state.github = data;
    if (projectMenuOpen() && projectMenuMode === "list") renderProjectMenu();
  } catch (err) {
    state.githubFetching = false;
    button.disabled = false;
    button.querySelector(".pm-label").textContent = t("从 GitHub 获取最新状态");
    // 8.8 "Errors": the sentence, git's own text behind 「详情」.
    renderBlockingError(statusEl, "没能从 GitHub 获取", err);
  }
}

// -- 「推送到 GitHub…」 (DESIGN.md 11.3, task V7) ---------------------------------
// The side panel shows what a push would do -- GET /api/github/push-plan,
// which reads only and touches no network -- in plain Chinese: the branch,
// the commits GitHub does not have yet (their first lines), the uncommitted
// files a push does not carry, whether the human records (.researchos/) are
// committed with the one tick 「先把你的记录提交一次」, every refusal with its
// sentence (and the command to run, when there is one), and -- without a
// remote -- the PRIVATE repository to create, its name editable. 「推送」 is
// the only control that pushes (POST /api/github/push with the plan's
// token: a project that changed since is refused and shown again); nothing
// is remembered as "always push". After a push the GitHub line refreshes.

let pushDialog = null; // {subject, plan, tick, name, nameEdited, busy}

// The plan as lines of plain Chinese: {text, tone, command?, commits?, more?}.
function pushPlanLines(plan) {
  const lines = [];
  if (!plan || typeof plan !== "object") return lines;
  if (!plan.git) {
    const ng = plan.not_git || {};
    lines.push({ text: (ng.message || "这个文件夹还不是 git 仓库，Research OS 不会把它变成仓库") + "。", tone: "bad" });
    if (ng.sync_message) lines.push({ text: ng.sync_message + "。", tone: "warn" });
    if (ng.way_forward) lines.push({ text: "可以这样做：" + ng.way_forward + "。", tone: "" });
    if (ng.large_message) lines.push({ text: ng.large_message + "。", tone: "warn" });
    return lines;
  }
  if (plan.needs_repo) {
    lines.push({ text: "分支 " + (plan.branch || "（无）") + "；这个项目还没有 GitHub 仓库。", tone: "" });
  } else if (plan.target) {
    lines.push({ text: "把分支 " + plan.branch + " 推送到 " + plan.target + (plan.set_upstream ? "（推送后设为它的上游分支）" : ""), tone: "" });
  } else if (plan.branch) {
    lines.push({ text: "分支 " + plan.branch, tone: "" });
  }
  if (plan.commit_count) {
    const shown = Array.isArray(plan.commits) ? plan.commits : [];
    lines.push({ text: "GitHub 还没有的提交：" + plan.commit_count + " 个", tone: "", commits: shown, more: plan.commit_count - shown.length });
  } else if (plan.nothing_to_push) {
    lines.push({ text: "GitHub 已经有全部提交，没有要推送的。", tone: "" });
  }
  if (plan.uncommitted_message) lines.push({ text: plan.uncommitted_message + "。", tone: "warn" });
  const rec = plan.records || {};
  if (rec.message) lines.push({ text: rec.message + "。", tone: (rec.changed && rec.changed.length) ? "warn" : "" });
  (plan.blockers || []).forEach((b) => lines.push({ text: b.message + "。", tone: "bad", command: b.command || null }));
  return lines;
}

// Whether 「推送」 may be pressed: no refusal, a remote on GitHub, and
// something to send (the planned commits, or the records the tick commits).
function pushCanSend(plan, tick) {
  if (!plan || !plan.git || plan.needs_repo || (plan.blockers || []).length) return false;
  if (plan.can_push) return true;
  return !!(tick && plan.records && Array.isArray(plan.records.changed) && plan.records.changed.length);
}

function openPushDialog() {
  closeProjectMenu(false);
  const subject = { kind: "github-push" };
  state.panelSubject = subject;
  pushDialog = { subject: subject, plan: null, tick: false, name: "", nameEdited: false, busy: false };
  panelTitle.textContent = "推送到 GitHub";
  panelTitle.title = "";
  panelSubtitle.textContent = "先看一看会推送什么；你按「推送」之前，什么都不会发送";
  panelBody.innerHTML = "";
  const status = mk("div", "notice-status");
  status.id = "push-status";
  const result = mk("div", "add-result");
  result.id = "push-result";
  result.appendChild(mk("div", "add-busy", "正在检查这个项目……"));
  panelBody.append(status, result);
  openPanel();
  loadPushPlan(subject);
}

function pushDialogLive(subject) {
  return !!pushDialog && pushDialog.subject === subject && state.panelSubject === subject && !panel.classList.contains("hidden");
}

function pushStatus(cls, text, err) {
  const el = document.getElementById("push-status");
  if (el) setStatus(el, cls, text, err);
}

async function loadPushPlan(subject) {
  let plan;
  try {
    plan = await apiGet("/api/github/push-plan"); // reads only, no network
  } catch (err) {
    if (!pushDialogLive(subject)) return;
    const result = document.getElementById("push-result");
    if (result) result.innerHTML = "";
    pushStatus("err", "没能检查这个项目", err);
    return;
  }
  if (!pushDialogLive(subject)) return;
  showPushPlan(subject, plan);
}

function showPushPlan(subject, plan) {
  pushDialog.plan = plan;
  if (!pushDialog.nameEdited) pushDialog.name = plan.suggested_name || "";
  const rec = plan.records || {};
  if (!(Array.isArray(rec.changed) && rec.changed.length)) pushDialog.tick = false;
  renderPushPlan(subject);
}

function renderPushPlan(subject) {
  const result = document.getElementById("push-result");
  const plan = pushDialog && pushDialog.plan;
  if (!result || !plan) return;
  result.innerHTML = "";
  if (plan.root) result.appendChild(mk("div", "add-root", plan.root));
  if (plan.remote && githubHref(plan.remote.url)) {
    const line = mk("div", "push-remote");
    line.append("GitHub：", externalLink(plan.remote.owner + "/" + plan.remote.repo, plan.remote.url));
    result.appendChild(line);
  }
  pushPlanLines(plan).forEach((l) => {
    const p = mk("p", "add-note" + (l.tone ? " " + l.tone : ""), l.text);
    if (l.command) {
      p.append(" ");
      p.appendChild(mk("code", "push-cmd", l.command));
    }
    result.appendChild(p);
    if (l.commits && l.commits.length) {
      const list = mk("ul", "push-commits");
      l.commits.forEach((c) => {
        const li = mk("li");
        li.append(mk("code", null, c.short || ""), c.subject || "");
        list.appendChild(li);
      });
      if (l.more > 0) list.appendChild(mk("li", null, "……还有 " + l.more + " 个"));
      result.appendChild(list);
    }
  });
  const rec = plan.records || {};
  if (plan.git && Array.isArray(rec.changed) && rec.changed.length) {
    const tick = mk("label", "push-tick");
    const box = mk("input");
    box.type = "checkbox";
    box.id = "push-tick";
    box.checked = !!pushDialog.tick;
    box.disabled = pushDialog.busy;
    box.addEventListener("change", () => {
      pushDialog.tick = box.checked;
      const go = document.getElementById("push-go");
      if (go) go.disabled = pushDialog.busy || !pushCanSend(pushDialog.plan, pushDialog.tick);
    });
    tick.append(box, "先把你的记录提交一次（只提交 .researchos/ 里的 " + rec.changed.length + " 个文件，提交说明「Research OS：人工记录」）");
    result.appendChild(tick);
  }
  if (plan.git && plan.needs_repo) result.appendChild(renderCreateRepoStep(subject, plan));
  const actions = mk("div", "add-actions");
  if (plan.git && !plan.needs_repo) {
    const go = mkButton(pushDialog.busy ? "正在推送…" : "推送", "btn", () => sendPush(subject, go));
    go.id = "push-go";
    go.disabled = pushDialog.busy || !pushCanSend(plan, pushDialog.tick);
    actions.appendChild(go);
  }
  actions.appendChild(mkButton("关闭", "btn", closePanel));
  result.appendChild(actions);
}

// Without a remote (11.3): a PRIVATE repository under the account gh is
// logged in to, added as origin; Research OS never creates a public one.
function renderCreateRepoStep(subject, plan) {
  const box = mk("div", "add-confirm");
  box.appendChild(mk("p", "add-note", "先在 gh 登录的 GitHub 账户下创建一个私有仓库，添加为 origin，然后再推送。Research OS 不会创建公开仓库。"));
  const row = mk("label", "push-name");
  const input = mk("input", "form-input");
  input.id = "push-name";
  input.type = "text";
  input.value = pushDialog.name;
  input.setAttribute("aria-label", "仓库名");
  input.disabled = pushDialog.busy;
  input.addEventListener("input", () => { pushDialog.name = input.value; pushDialog.nameEdited = true; });
  row.append("仓库名", input);
  box.appendChild(row);
  const actions = mk("div", "add-actions");
  const create = mkButton("创建私有仓库", "btn", () => createRepo(subject, create));
  create.id = "push-create";
  create.disabled = pushDialog.busy || !plan.can_create_repo;
  actions.appendChild(create);
  box.appendChild(actions);
  return box;
}

async function createRepo(subject, button) {
  if (pushDialog.busy) return;
  const name = (pushDialog.name || "").trim();
  if (!/^[A-Za-z0-9._-]{1,100}$/.test(name) || /^[.-]/.test(name)) {
    pushStatus("err", "仓库名只能用英文字母、数字和 . _ -，不能以 . 或 - 开头，不超过 100 个字符");
    return;
  }
  pushDialog.busy = true;
  button.disabled = true;
  button.textContent = "正在创建…";
  pushStatus("", "正在 GitHub 上创建私有仓库……");
  let res;
  try {
    res = await apiPost("/api/github/create-repo", { name: name, token: pushDialog.plan.token });
  } catch (err) {
    pushDialog.busy = false;
    if (!pushDialogLive(subject)) return;
    renderPushPlan(subject);
    pushStatus("err", "没能在 GitHub 上创建仓库", err);
    return;
  }
  pushDialog.busy = false;
  loadGitHub();
  if (!pushDialogLive(subject)) return;
  if (res.plan) showPushPlan(subject, res.plan);
  pushStatus("ok", res.message || "已在 GitHub 上创建私有仓库");
}

async function sendPush(subject, button) {
  if (pushDialog.busy || !pushCanSend(pushDialog.plan, pushDialog.tick)) return;
  pushDialog.busy = true;
  button.disabled = true;
  button.textContent = "正在推送…";
  pushStatus("", "正在推送到 GitHub……");
  let res;
  try {
    res = await apiPost("/api/github/push", { token: pushDialog.plan.token, commit_records: !!pushDialog.tick });
  } catch (err) {
    pushDialog.busy = false;
    if (!pushDialogLive(subject)) return;
    if (err && err.plan) showPushPlan(subject, err.plan);
    else renderPushPlan(subject);
    // 8.8 "Errors": the sentence, git's own text behind 「详情」.
    pushStatus("err", "没能推送到 GitHub", err);
    return;
  }
  pushDialog.busy = false;
  if (res.state && typeof res.state === "object") state.github = res.state;
  loadGitHub(); // 11.3: after a push the GitHub line refreshes
  if (!pushDialogLive(subject)) return;
  pushDialog.tick = false;
  if (res.plan) showPushPlan(subject, res.plan);
  pushStatus("ok", res.message || "已推送到 GitHub");
}

// `opts.scanStarted`: a scan of the project being opened has just begun, so
// its end is news even if it lands before the first status poll.
async function reloadAllViews(opts) {
  // Everything on screen belongs to the previous project: drop the cached
  // attempt records, mark both views stale, and re-fetch the one currently
  // visible (the other reloads lazily on its next activation). The attempt
  // records and the map config are dropped, and the epoch moves so a fetch
  // still in flight for the previous project is discarded.
  state.dataEpoch += 1;
  ROWorkspace.reset();
  state.attemptsById = new Map();
  state.attemptsConfig = null;
  state.attemptStatuses = [];
  state.summary = null;
  state.migrationInfo = null;
  state.projectMoved = false;
  state.reviewOffer = null;
  state.github = null;

  litState.data = null;

  litState.query = "";
  litState.selected = null;
  litState.abstractBatch = null;
  varState.card = null;
  varState.version = null;
  varState.asking = null;
  varState.newCard.open = false;
  varState.newCard.id = "";
  RCECanvas.reset();
  closePanel();
  clearProjectState();
  resetScanChip(opts && opts.scanStarted);
  // The switch itself bumped the server's generation (watcher.retarget);
  // resync the poller's notion of "current" so the next tick doesn't
  // immediately re-fetch everything this function just fetched.
  await loadProjects();
  await syncGeneration();
  loadProjectSummary(true); // the switch succeeded: the line is the new project's
  RODesk.refreshSidebar();
  if (state.noProject) return; // 10.1: the welcome is all there is to show
  if (currentView === "node") activateView("workspace"); // the node belonged to the previous project
  else if (currentView === "workspace") ROWorkspace.load(views.workspace);
  else if (currentView === "desk") RODesk.loadDesk(views.desk);
  else if (currentView === "results") RONode.loadResults(views.results);
  else if (currentView === "lineage") loadLineageView();
  else if (currentView === "canvas") RCECanvas.load(views.canvas);
  else if (currentView === "variables") loadVariablesView();
  else if (currentView === "literature") loadLiteratureView();
  else if (currentView === "proposals") ROTeam.loadProposals(views.proposals);
  else if (currentView === "members") ROTeam.loadMembers(views.members);
}
