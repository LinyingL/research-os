// -- 文献 (DESIGN.md 11.4, last paragraph; task V7 phase D) -----------------------
// Per draft, its citations: the text as written, what it was resolved to and
// how, or 「未找到」, or 「N 个候选，待确认」 with 确认 / 否决 per candidate --
// ledger entries through POST /api/judgements (the one write path), one per
// link the candidate has in the graph. The summary at the top, drafts with
// the most not yet resolved first; each draft renders its citations only
// when opened (a thousand citations stay fast). 打开 DOI is a plain https
// link; 在 Zotero 中打开 (only when the program is installed) and 打开 PDF
// (only when the attachment is on this machine) go through the engine,
// which takes keys, never a path. The online setting lives at the top.
// Draft text and reference metadata are inserted as text, never as HTML.

// -- Literature wording (pure; 11.4) ------------------------------------------------
// tests/test_v7_literature_view.py loads this block into node.
function litSummaryText(totals) {
  const t = totals || {};
  return (t.citations || 0) + " 处引用：已对上 " + (t.resolved || 0) + "，待确认 " + (t.pending || 0) +
    "，未找到 " + (t.unresolved || 0) +
    (t.unanchored ? "；另有 " + t.unanchored + " 处在文稿第一个标题之前，不建立关联" : "");
}

function litDraftCountText(counts) {
  const c = counts || {};
  const parts = [(c.citations || 0) + " 处"];
  if (c.resolved) parts.push("已对上 " + c.resolved);
  if (c.pending) parts.push("待确认 " + c.pending);
  if (c.unresolved) parts.push("未找到 " + c.unresolved);
  if (c.unanchored) parts.push("标题前 " + c.unanchored);
  return parts.join(" · ");
}

const LIT_SOURCE_WORDS = { zotero: "Zotero", crossref: "DOI 联网", entry: "文末条目" };

// How one reference was reached: 「Zotero」「文末条目」「DOI 联网」 (11.4), a
// DOI written in the text that nothing describes yet as 「文中 DOI」, and a
// candidate the researcher confirmed as such.
function litHowText(c, t) {
  const words = [];
  if (c.how === "entry" || c.how === "entry_candidates") words.push("文末条目");
  else if (c.how === "zotero_candidates") words.push("Zotero");
  else if (c.how === "doi") words.push(LIT_SOURCE_WORDS[t && t.source] || "文中 DOI");
  if (t && (c.how === "entry" || c.how === "entry_candidates") && (t.source === "zotero" || t.source === "crossref")) {
    words.push(LIT_SOURCE_WORDS[t.source]);
  }
  if (t && t.judged === "confirmed") words.push("你已确认");
  return words.join(" · ");
}

function litBadge(c) {
  const n = (c.targets || []).length;
  if (c.state === "unanchored") return { text: "不建立关联", tone: "dead" };
  if (c.state === "resolved") return { text: "已对上", tone: "in-use" };
  if (c.state === "pending") return { text: n + " 个候选，待确认", tone: "wait" };
  if (n && (c.targets || []).every((t) => t.judged === "rejected")) return { text: "未找到（候选都已否决）", tone: "dead" };
  return { text: "未找到", tone: "dead" };
}

// A reference as one line: authors, year, title, journal -- or the entry's
// own text, or the bare DOI when nothing describes it.
function litRefText(t) {
  if (!t) return "";
  const authors = Array.isArray(t.authors) ? t.authors.filter(Boolean) : [];
  const parts = [];
  if (t.title || t.venue) {
    if (authors.length) parts.push(authors.slice(0, 3).join("、") + (authors.length > 3 ? " 等" : ""));
    if (t.year) parts.push(String(t.year) + (t.letter || ""));
    if (t.title) parts.push(t.title);
    if (t.venue) parts.push(t.venue);
    return parts.join(" · ");
  }
  if (t.entry_text) return t.entry_text;
  if (t.doi) return "DOI " + t.doi;
  return t.node || "";
}

function litZoteroText(z) {
  if (!z) return "";
  if (z.status === "read") return "Zotero 文献库：" + (z.items || 0) + " 个条目";
  if (z.status === "absent") return "没有找到 Zotero 文献库：只用文稿自己的参考文献和 DOI 对照";
  return "Zotero 文献库这次没能读取：只用文稿自己的参考文献和 DOI 对照";
}

// The links a 确认 / 否决 / 撤销 writes for one candidate: one ledger entry
// each. 撤销 undoes only the links whose last act was the researcher's.
function litLinksFor(t, verdict) {
  const links = (t && t.links) || [];
  if (verdict === "undone") return links.filter((l) => l.status === "confirmed" || l.status === "rejected");
  return links.filter((l) => l.status !== verdict);
}
// -- end of literature wording ----------------------------------------------------

const litState = {
  data: null,
  open: new Set(),   // drafts shown opened, kept across re-renders
  quiet: false,      // the drafts without citations, shown
  tab: "library",
  query: "",
  selected: null,
  abstractBatch: null,
};

async function loadLiteratureView() {
  const host = views.literature;
  const epoch = state.dataEpoch;
  views.literature.dataset.loaded = "1";
  if (!host.childElementCount) host.appendChild(mk("p", "empty-note", "载入中…"));
  let data;
  try {
    data = await apiGet("/api/citations");
  } catch (err) {
    if (epoch !== state.dataEpoch) return;
    renderViewFailure(host, err);
    return;
  }
  if (epoch !== state.dataEpoch || currentView !== "literature") {
    if (epoch === state.dataEpoch) delete views.literature.dataset.loaded;
    return;
  }
  clearProjectState();
  litState.data = data;
  const top = window.scrollY;
  host.innerHTML = "";
  renderLiterature(host, data);
  window.scrollTo(0, top);
}

function renderLiterature(host, data) {
  const tabs = mk("div", "lit-tabs");
  [["library", t("文献列表")], ["citations", t("引用核对")]].forEach(([id, label]) => {
    const button = mkButton(label, "lit-tab" + (litState.tab === id ? " active" : ""), () => {
      litState.tab = id;
      host.replaceChildren();
      renderLiterature(host, data);
    });
    button.setAttribute("aria-pressed", String(litState.tab === id));
    tabs.appendChild(button);
  });
  host.appendChild(tabs);
  if (litState.tab === "citations") renderCitationAudit(host, data);
  else renderLiteratureLibrary(host, data);
}

function renderLiteratureLibrary(host, data) {
  const library = data.library || {};
  const items = library.items || [];
  const tools = mk("div", "lit-library-tools");
  const search = document.createElement("input");
  search.type = "search";
  search.className = "lit-search";
  search.placeholder = t("搜索标题、作者、年份或 DOI");
  search.setAttribute("aria-label", search.placeholder);
  search.value = litState.query;
  const count = mk("span", "lit-hint");
  const fetchMissing = mkButton(t("补全缺失摘要"), "btn btn-small lit-fill-abstracts", () => fillMissingAbstracts(data));
  tools.append(search, count, fetchMissing);
  host.appendChild(tools);
  host.appendChild(mk("p", "lit-hint lit-abstract-progress"));
  const grid = mk("div", "lit-library-grid");
  const list = mk("div", "lit-library-list");
  list.setAttribute("aria-label", t("文献列表"));
  const reader = mk("article", "lit-reader");
  grid.append(list, reader);
  host.appendChild(grid);
  let shown = 100;
  function fill() {
    const scroll = list.scrollTop;
    const query = search.value.trim().toLocaleLowerCase();
    litState.query = search.value;
    const found = items.filter((item) => [item.title, ...(item.authors || []), item.year, item.doi, item.venue]
      .filter(Boolean).join(" ").toLocaleLowerCase().includes(query));
    count.textContent = t("{n} 篇文献", { n: found.length });
    list.replaceChildren();
    reader.replaceChildren();
    if (!found.length) {
      reader.appendChild(mk("p", "empty-note", items.length ? t("没有匹配的文献。") : t("还没有项目文献。可在项目中加入 BibTeX 或 references.csv / references.json，再重新扫描。")));
      return;
    }
    if (!found.some((item) => item.id === litState.selected)) litState.selected = found[0].id;
    const selected = found.find((item) => item.id === litState.selected);
    found.slice(0, shown).forEach((item) => {
      const active = item.id === litState.selected;
      const button = mkButton("", "lit-library-item" + (active ? " active" : ""), () => {
        litState.selected = item.id;
        fill();
      });
      button.setAttribute("aria-pressed", String(active));
      button.append(mk("span", "lit-library-item-title", item.title || item.doi),
        mk("span", "lit-library-meta", [...(item.authors || []).slice(0, 3), item.year].filter(Boolean).join(" · ")));
      list.appendChild(button);
    });
    if (found.length > shown) list.appendChild(mkButton(t("显示更多"), "btn btn-small", () => { shown += 100; fill(); }));
    list.scrollTop = scroll;
    renderLiteratureReader(reader, selected, data);
  }
  search.addEventListener("input", () => { shown = 100; fill(); });
  fill();
  updateAbstractBatch(data);
  if ((library.warnings || []).length) {
    const warning = mk("details", "lit-reader-sources");
    warning.appendChild(chevronSummary(t("部分文献文件未能读取")));
    library.warnings.forEach((item) => warning.appendChild(mk("p", null, item.file + ": " + item.detail)));
    host.appendChild(warning);
  }
  host.appendChild(lookupSettingLine(data.lookup || {}));
  if (data.outputs) renderRegisteredOutputs(host, data.outputs);
}

function applyAbstractResult(item, result) {
  item.abstract = result.abstract;
  item.abstract_source = result.abstract ? result.source : null;
  item.abstract_source_url = result.source_url;
  item.abstract_checked = true;
}

function updateAbstractBatch(data) {
  const host = views.literature;
  const batch = litState.abstractBatch;
  const button = host.querySelector(".lit-fill-abstracts");
  if (button) button.disabled = !(data.lookup && data.lookup.enabled) || !!(batch && batch.running) ||
    !(data.library && data.library.items || []).some((item) => item.doi && !item.abstract);
  const progress = host.querySelector(".lit-abstract-progress");
  if (progress && batch) progress.textContent = t("已查 {done}/{total} 篇，补全 {found} 篇，失败 {failed} 篇", batch);
}

async function fillMissingAbstracts(data) {
  if (litState.abstractBatch && litState.abstractBatch.running) return;
  const epoch = state.dataEpoch;
  const wanted = (data.library && data.library.items || []).filter((item) => item.doi && !item.abstract);
  const batch = { running: true, done: 0, total: wanted.length, found: 0, failed: 0 };
  litState.abstractBatch = batch;
  function redrawReader() {
    if (epoch !== state.dataEpoch || currentView !== "literature") return;
    const active = litState.data || data;
    updateAbstractBatch(active);
    const reader = views.literature.querySelector(".lit-reader");
    const selected = (active.library && active.library.items || []).find((item) => item.id === litState.selected);
    if (reader && selected) { reader.replaceChildren(); renderLiteratureReader(reader, selected, active); }
  }
  redrawReader();
  for (const item of wanted) {
    if (epoch !== state.dataEpoch || currentView !== "literature") break;
    try {
      const result = await apiPost("/api/literature/abstract", { doi: item.doi, refresh: !!item.abstract_checked });
      if (epoch !== state.dataEpoch) break;
      applyAbstractResult(item, result);
      const current = (litState.data && litState.data.library && litState.data.library.items || []).find((i) => i.doi === item.doi);
      if (current && current !== item) applyAbstractResult(current, result);
      if (result.abstract) batch.found += 1;
    } catch (err) {
      if (epoch !== state.dataEpoch) break;
      batch.failed += 1;
    }
    batch.done += 1;
    redrawReader();
  }
  batch.running = false;
  if (litState.abstractBatch === batch) redrawReader();
}

function renderLiteratureReader(host, item, data) {
  host.appendChild(mk("h2", null, item.title || item.doi));
  host.appendChild(mk("p", "lit-library-meta", [...(item.authors || []), item.year, item.venue].filter(Boolean).join(" · ")));
  const actions = mk("div", "lit-reader-actions");
  const status = mk("div", "notice-status");
  if (item.doi_url) {
    const a = mk("a", "lit-link", t("打开 DOI"));
    a.href = item.doi_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    actions.appendChild(a);
  }
  if (item.pdf) actions.appendChild(mkButton(t("打开 PDF"), "lit-link-btn", () =>
    litOpen("/api/zotero/open-attachment", { item_key: item.pdf.item_key, attachment_key: item.pdf.attachment_key }, status, t("没能打开这个 PDF"))));
  if (item.zotero_url && data.zotero && data.zotero.installed) actions.appendChild(mkButton(t("在 Zotero 中打开"), "lit-link-btn", () =>
    litOpen("/api/zotero/open-item", { item_key: item.zotero_key }, status, t("没能在 Zotero 中打开"))));
  if (item.node) actions.appendChild(mkButton(t("关联与引用"), "lit-link-btn", () => RONode.openNode(item.node)));
  host.append(actions, status, mk("h3", null, t("摘要")));
  if (item.abstract) {
    host.appendChild(mk("p", "lit-abstract", item.abstract));
    if (item.abstract_source) {
      const source = mk("p", "lit-hint", t("摘要来源：{source}", { source: item.abstract_source }));
      if (/^https:\/\/openalex\.org\/W\d+$/.test(item.abstract_source_url || "")) {
        const link = mk("a", "lit-link", t("查看来源"));
        link.href = item.abstract_source_url; link.target = "_blank"; link.rel = "noopener noreferrer";
        source.append(" · ", link);
      }
      host.appendChild(source);
    }
  } else {
    host.appendChild(mk("p", "lit-hint", item.abstract_checked ? t("暂未查到摘要，可以稍后重试。") : t("该条目尚无摘要。")));
    if (item.doi) {
      const button = mkButton(item.abstract_checked ? t("重新查询摘要") : t("获取摘要"), "btn btn-small", async () => {
        const epoch = state.dataEpoch;
        button.disabled = true;
        setStatus(status, "", t("正在获取摘要…"));
        try {
          const result = await apiPost("/api/literature/abstract", { doi: item.doi, refresh: !!item.abstract_checked });
          if (epoch !== state.dataEpoch) return;
          applyAbstractResult(item, result);
          updateAbstractBatch(data);
          if (litState.selected === item.id && currentView === "literature" && host.isConnected) {
            host.replaceChildren();
            renderLiteratureReader(host, item, data);
          }
        } catch (err) {
          if (epoch !== state.dataEpoch || !host.isConnected) return;
          button.disabled = false;
          setStatus(status, "err", t("没能获取摘要"), err);
        }
      });
      button.disabled = !(data.lookup && data.lookup.enabled) || !!(litState.abstractBatch && litState.abstractBatch.running);
      host.appendChild(button);
      if (!(data.lookup && data.lookup.enabled)) host.appendChild(mk("p", "lit-hint", t("在设置里开启联网查询后，可按 DOI 获取摘要。")));
    }
  }
  if ((item.files || []).length) {
    const sources = mk("details", "lit-reader-sources");
    sources.appendChild(chevronSummary(t("项目中的文献文件")));
    item.files.forEach((file) => {
      const source = mk("div", "lit-reader-source"); source.appendChild(mkButton(file, "lit-link-btn", () => openFilePanel(file)));
      if (window.ROWorkspace) window.ROWorkspace.renderResearchLinks(source, (data.research_records_by_file || {})[file], t("提到这个文件的笔记与报告"));
      sources.appendChild(source);
    });
    host.appendChild(sources);
  }
}

function renderCitationAudit(host, data) {
  // The page title above says 文献 (12.9); the view starts with its content.
  host.appendChild(lookupSettingLine(data.lookup || {}));
  const zline = mk("p", "lit-zotero", litZoteroText(data.zotero));
  if (data.zotero && data.zotero.data_dir) zline.title = data.zotero.data_dir;
  if (data.zotero && data.zotero.status === "unreadable" && data.zotero.reason) {
    renderBlockingError(zline, litZoteroText(data.zotero), { detail: data.zotero.reason });
  }
  host.appendChild(zline);
  const drafts = data.drafts || [];
  if (!data.scanned) {
    host.appendChild(litEmpty("还没有读过文稿里的引用", [
      "在项目菜单里「重新扫描」一次，这里就会列出每份文稿引用了什么、各自对上了哪篇文献。",
    ]));
    return;
  }
  if (!drafts.length) {
    host.appendChild(litEmpty("这个项目里没有文稿", ["Research OS 读取项目里的 Markdown（.md）和 LaTeX（.tex）文稿中的引用。"]));
    return;
  }
  const totals = data.totals || {};
  if (!totals.citations && !totals.unreadable) {
    host.appendChild(litEmpty("文稿里没有找到引用", [
      "Research OS 读取 DOI 和拉丁字母的作者–年份引用，例如 Simon（1955）、（Hansen, 2000）。",
      "中文作者名的引用（如 张川川（2020））暂不读取。",
    ]));
    return;
  }
  host.appendChild(mk("p", "lit-summary", litSummaryText(totals)));
  if (totals.unreadable) {
    // 11.1: a draft only in a synced folder's cloud, its client not running,
    // says so in the provider's own sentence.
    const clouds = (Array.isArray(data.cloud) ? data.cloud : []).filter(Boolean).map((m) => m + "。").join("");
    host.appendChild(mk("p", "lit-note", totals.unreadable + " 份文稿这次没能读取，不在上面的数字里。" + clouds));
  }
  const list = mk("div", "lit-drafts");
  const quiet = [];
  drafts.forEach((d) => {
    if (d.readable && !(d.counts && d.counts.citations)) quiet.push(d);
    else list.appendChild(renderLitDraft(d));
  });
  host.appendChild(list);
  if (quiet.length) {
    const more = mkButton((litState.quiet ? "收起" : "另有 " + quiet.length + " 份文稿没有找到引用"), "var-back has-chevron", () => {   // 12.13: the chevron, turned while the list is shown
      litState.quiet = !litState.quiet;
      host.innerHTML = "";
      renderLiterature(host, data);
    });
    more.setAttribute("aria-expanded", String(!!litState.quiet));
    host.appendChild(more);
    if (litState.quiet) {
      const box = mk("div", "lit-quiet");
      quiet.forEach((d) => box.appendChild(mk("div", "lit-quiet-file", d.file)));
      host.appendChild(box);
    }
  }
}

function litEmpty(title, lines) {
  const card = mk("div", "guide-card");
  card.appendChild(mk("h2", null, title));
  lines.forEach((l) => card.appendChild(mk("p", null, l)));
  return card;
}

// 21.7: the online lookup is this Mac's setting and has its one form on the 设置 page; the 文献 page says where it stands and links there.
function lookupSettingLine(lookup) {
  const line = mk("p", "lit-setting-line");
  line.append(mk("span", null, lookup.enabled ? t("联网查询：已打开") : t("联网查询：已关闭")), " ", settingsPageLink("lookup"));
  return line;
}

// 12.11: a draft opens with the platform's own disclosure (<details>), its
// citations built the first time it is opened.
function renderLitDraft(d) {
  const box = mk("details", "lit-draft");
  const head = mk("summary", "res-draft-summary lit-draft-head"); // 12.13: the chevron, not the browser's triangle
  const opened = litState.open.has(d.file);
  box.open = opened;
  head.appendChild(chevronIcon());
  head.appendChild(mk("span", "lit-file", d.file));
  if (!d.readable) head.appendChild(mk("span", "var-chip bad", "这次没能读取"));
  else head.appendChild(mk("span", "lit-counts", litDraftCountText(d.counts)));
  box.appendChild(head);
  const body = mk("div", "lit-cites");
  box.appendChild(body);
  const fill = () => {
    body.innerHTML = "";
    if (!d.readable) {
      const note = mk("p", "empty-note");
      renderBlockingError(note, d.message_zh
        ? d.message_zh + "。这份文稿的引用没有列出。"
        : "这份文稿这次没能读取，它的引用没有列出。", d.detail ? { detail: d.detail } : null);
      body.appendChild(note);
      return;
    }
    (d.citations || []).forEach((c) => body.appendChild(renderLitCitation(c)));
  };
  if (opened) fill();
  box.addEventListener("toggle", () => {
    if (box.open === litState.open.has(d.file)) return; // the state it was built in
    if (box.open) { litState.open.add(d.file); fill(); } else { litState.open.delete(d.file); body.innerHTML = ""; }
  });
  return box;
}

function renderLitCitation(c) {
  const row = mk("div", "lit-cite");
  const top = mk("div", "lit-cite-head");
  top.appendChild(mk("span", "lit-line", "第 " + c.line + " 行"));
  top.appendChild(mk("span", "lit-text", c.text));
  const badge = litBadge(c);
  top.appendChild(mk("span", "var-chip " + badge.tone, badge.text));
  row.appendChild(top);
  const status = mk("div", "notice-status");
  const targets = c.targets || [];
  if (c.state === "unanchored") {
    // 11.4: a `cites` link starts at a section or a claim; before the
    // first heading there is neither, so nothing is linked -- or offered.
    row.appendChild(mk("div", "lit-hint", "这处引用在文稿的第一个标题之前，不属于任何一节，Research OS 不为它建立关联；把它移到某个标题下面，重新扫描后就会列入。"));
    targets.forEach((t) => row.appendChild(renderLitRef(c, t, status, false)));
  } else if (c.status === "auto") {
    targets.forEach((t) => row.appendChild(renderLitRef(c, t, status, false)));
  } else if (targets.length) {
    const cands = mk("div", "lit-cands");
    targets.forEach((t) => cands.appendChild(renderLitRef(c, t, status, true)));
    row.appendChild(cands);
  }
  row.appendChild(status);
  return row;
}

function renderLitRef(c, t, status, candidate) {
  const box = mk("div", candidate ? "lit-ref lit-cand" : "lit-ref");
  // 12.9: a reference opens its node page (who cites it, the judgments).
  if (t.node) {
    const name = mkButton(litRefText(t), "lit-ref-text lit-ref-open", () => RONode.openNode(t.node));
    name.title = "打开这篇文献的页面";
    box.appendChild(name);
  } else box.appendChild(mk("div", "lit-ref-text", litRefText(t)));
  const line = mk("div", "lit-ref-line");
  line.appendChild(mk("span", "lit-how", litHowText(c, t)));
  if (t.doi_url) {
    const a = mk("a", "lit-link", "打开 DOI");
    a.href = t.doi_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    line.appendChild(a);
  }
  const data = litState.data || {};
  if (t.zotero_url && data.zotero && data.zotero.installed) {
    line.appendChild(mkButton("在 Zotero 中打开", "lit-link-btn", () =>
      litOpen("/api/zotero/open-item", { item_key: t.zotero_key }, status, "没能在 Zotero 中打开")));
  }
  if (t.pdf) {
    line.appendChild(mkButton("打开 PDF", "lit-link-btn", () =>
      litOpen("/api/zotero/open-attachment", { item_key: t.pdf.item_key, attachment_key: t.pdf.attachment_key }, status, "没能打开这个 PDF")));
  }
  box.appendChild(line);
  if (candidate) box.appendChild(renderLitJudge(t, status));
  return box;
}

function renderLitJudge(t, status) {
  const actions = mk("div", "lit-judge");
  const blocked = humanRecordsBlocked();
  if (t.judged) {
    actions.appendChild(mk("span", "var-chip " + (t.judged === "confirmed" ? "in-use" : "dead"),
      t.judged === "confirmed" ? "已确认" : "已否决"));
    const undo = mkButton("撤销", "btn btn-small", () => litJudge(t, "undone", status, [undo]));
    undo.disabled = !!blocked;
    actions.appendChild(undo);
  } else {
    const yes = mkButton("确认", "btn btn-small", () => litJudge(t, "confirmed", status, [yes, no]));
    const no = mkButton("否决", "btn btn-small", () => litJudge(t, "rejected", status, [yes, no]));
    yes.disabled = no.disabled = !!blocked || !(t.links || []).length;
    actions.append(yes, no);
  }
  if (blocked) actions.appendChild(mk("span", "lit-hint", blocked));
  else if (t.linked_by_identifier) {
    // The link (this section → this reference) is another citation's,
    // resolved by its DOI or the draft's one entry: a verdict here would
    // overrule it (11.4: only candidates are the researcher's to confirm).
    actions.appendChild(mk("span", "lit-hint", "同一节里另一处引用已经凭 DOI 或文末条目对上了这篇文献，这个候选不能单独确认或否决"));
  } else if (!(t.links || []).length) actions.appendChild(mk("span", "lit-hint", "这处引用在上次扫描之后有了变化，重新扫描后才能确认"));
  return actions;
}

async function litJudge(t, verdict, status, buttons) {
  const links = litLinksFor(t, verdict);
  if (!links.length) return;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(status, "", "正在记录…");
  const framing = { confirmed: "没能确认这个候选", rejected: "没能否决这个候选", undone: "没能撤销" }[verdict];
  for (const link of links) {
    let res;
    try {
      res = await postJudgement(link, verdict);
    } catch (err) {
      buttons.forEach((b) => { b.disabled = false; });
      setStatus(status, "err", framing, err);
      return;
    }
    if (res && typeof res.generation === "number") lastGeneration = res.generation;
  }
  await refreshCurrentView();
}

async function litOpen(path, body, status, framing) {
  setStatus(status, "", "");
  try {
    await apiPost(path, body);
  } catch (err) {
    setStatus(status, "err", framing, err);
  }
}
// -- end of the 文献 view ----------------------------------------------------------

// -- Notices above the views ------------------------------------------------------
// One place for what the record needs from the researcher, rebuilt from
// state.summary on every summary refresh -- but only when what it shows
// changed (a typed answer or a running migration is never wiped), and
// never while an answer is in flight.

function notice(tone) {
  return mk("div", "notice" + (tone ? " " + tone : ""));
}

function noticeHead(box, title, onClose) {
  if (onClose) {
    const close = mkButton("关闭", "notice-close", onClose);
    close.setAttribute("aria-label", "关闭");
    close.title = "关闭";
    box.appendChild(close);
  }
  box.appendChild(mk("div", "notice-title", title));
}

function renderNotices(force) {
  const host = document.getElementById("notices");
  if (!host || (state.noticeBusy && !force)) return;
  const s = state.summary;
  const sig = JSON.stringify([
    state.projectMoved, s && s.read_only, s && s.needs_migration, s && s.migration, s && s.records,
    state.migrationInfo && [state.migrationInfo.loading, !!state.migrationInfo.data, !!state.migrationInfo.error],
    state.sessionNotes.length,
  ]);
  if (!force && sig === state.noticeSig) return;
  state.noticeSig = sig;
  host.innerHTML = "";
  if (state.projectMoved) host.appendChild(movedNotice());
  if (s && s.read_only) host.appendChild(readOnlyNotice());
  if (s && s.needs_migration) host.appendChild(migrationNotice(s));
  // An unfinished migration is said once, by its own banner, not again as
  // a ledger that refuses writes (one cause, one message).
  const migrating = s && s.records && s.records.reason === "migrating" && s.needs_migration;
  if (s && s.records && s.records.state && s.records.state !== "ok" && !migrating) host.appendChild(recordsNotice(s.records));
  state.sessionNotes.forEach((n, i) => host.appendChild(sessionNotice(n, i)));
}

async function reopenProject(statusEl, buttons) {
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在重新打开…");
  try {
    await apiPost("/api/project/reopen", {});
  } catch (err) {
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能重新打开", err);
    return;
  }
  state.projectMoved = false;
  await reloadAllViews();
}

function movedNotice() {
  const box = notice("bad");
  noticeHead(box, "项目已移动或已在别处认领，请重新打开");
  box.appendChild(mk("p", null,
    "刚才的操作没有写入任何东西：这个文件夹已经不在原处，或者另一个文件夹已经认领了这个项目。重新打开后，Research OS 会重新确认它是谁。"));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  const b = mkButton("重新打开", "btn", () => reopenProject(status, [b]));
  actions.appendChild(b);
  box.append(actions, status);
  return box;
}

function readOnlyNotice() {
  const box = notice("warn");
  noticeHead(box, "只读打开");
  box.appendChild(mk("p", null, "原位置暂时无法确认，这次只浏览：不认领、不写入任何东西。原位置能访问后，点「重新检查」回答是移动还是复制。"));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  const b = mkButton("重新检查", "btn", () => reopenProject(status, [b]));
  actions.appendChild(b);
  box.append(actions, status);
  return box;
}

// -- 9.5: a pre-V5 project's migration -------------------------------------------

async function ensureMigrationInfo(summary) {
  const waiting = (summary.migration && summary.migration.waiting) || [];
  if (!waiting.length || (summary.migration && summary.migration.migrating_from)) return;
  const key = state.dataEpoch + ":" + waiting.map((w) => w.key).join(",");
  if (state.migrationInfo && state.migrationInfo.key === key) return;
  const info = { key: key, loading: true, data: null, error: null };
  state.migrationInfo = info;
  renderNotices();
  try {
    info.data = await apiGet("/api/migration");
  } catch (err) {
    info.error = err;
  }
  info.loading = false;
  if (state.migrationInfo === info) renderNotices();
}

function previewLines(p) {
  const lines = [];
  if (p.error) {
    lines.push("这个旧索引读不出来（" + p.db_path + "）");
    return lines;
  }
  if (p.recorded_path) {
    lines.push("旧索引说它来自：" + p.recorded_path +
      (p.path_exists === false ? "（这个位置现在没有文件夹）" : p.path_exists ? "（这个位置还在）" : ""));
  } else {
    lines.push("旧索引没有记下它来自哪里（" + p.db_path + "）");
  }
  lines.push("里面有 " + p.confirmed + " 条确认、" + p.rejected + " 条否决，" + p.arranged_views + " 个摆放过的关系图视图" +
    (p.mapping_links ? "；另有 " + p.mapping_links + " 条手工连线，它们本来就在 mappings.toml 里" : ""));
  if (p.judged) {
    lines.push(p.judged + " 条里有 " + p.produced + " 条的两端能在这个文件夹里扫到");
    if (p.produced / p.judged < 0.5) lines.push("匹配很低：这些连线确认可能属于另一个项目。");
    if (p.produced < p.judged && p.outside) {
      lines.push("这个文件夹里有 " + p.outside + " 个脚本读写的是文件夹以外的绝对路径——项目被移动或复制过时，匹配就会这样偏低。");
    }
  }
  if (p.scan_error) lines.push("扫描这个文件夹时出了错，能扫到的数目可能偏低。");
  return lines;
}

function migrationNotice(s) {
  const box = notice("warn");
  const waiting = (s.migration && s.migration.waiting) || [];
  const resuming = s.migration && s.migration.migrating_from;
  noticeHead(box, resuming ? "上次迁移没有完成" : waiting.length ? "旧版本的连线确认在等待迁移" : "这个项目来自旧版本");
  box.appendChild(mk("p", null, "迁移后才能记录连线确认。" + (resuming || waiting.length
    ? "迁移会把旧索引里的确认、否决和关系图位置写进项目自己的 .researchos/，核对数目对上之后才把旧索引移到一旁（不删除）。"
    : "没有找到等待迁移的旧索引；在终端运行 researchos migrate --list 可以查看本机所有旧索引。")));
  const status = mk("div", "notice-status");
  const actions = mk("div", "notice-actions");
  if (resuming) {
    box.appendChild(mk("div", "fact-line", "旧索引：" + resuming));
    const b = mkButton("继续迁移", "btn btn-primary", () => runMigration("migrate", status, [b]));
    actions.appendChild(b);
  } else if (waiting.length) {
    const info = state.migrationInfo;
    if (!info || info.loading) {
      box.appendChild(mk("p", null, "正在核对旧索引与这个文件夹…"));
    } else if (info.error) {
      const e = mk("div", "notice-status err");
      renderBlockingError(e, "没能读出等待迁移的旧索引", info.error);
      box.appendChild(e);
    } else {
      (info.data.previews || []).forEach((p) => {
        const list = mk("ul", "entry-list");
        previewLines(p).forEach((l) => list.appendChild(mk("li", null, l)));
        box.appendChild(list);
      });
      const yes = mkButton("迁移这些记录", "btn btn-primary", () => runMigration("migrate", status, [yes, no]));
      const no = mkButton("这不是这个项目的", "btn", () => runMigration("not_mine", status, [yes, no]));
      actions.append(yes, no);
    }
  }
  box.append(actions, status);
  return box;
}

function tallyLines(t) {
  if (!t) return [];
  const lines = ["旧索引里有 " + t.m + " 条确认或否决：" + t.applied + " 条已生效，" + t.review_other + " 条待复核" +
    (t.contradicted ? "（其中 " + t.contradicted + " 条记录冲突）" : "") + "，" + t.review_not_produced + " 条机器不再得出、同样待复核"];
  if (t.skipped_mappings) lines.push("手工连线 " + t.skipped_mappings + " 条本来就在 mappings.toml 里，没有重复迁移");
  if (t.stale_mirror && t.stale_mirror.length) lines.push("旧索引里有 " + t.stale_mirror.length + " 处和你的文件不一致，以文件为准");
  if (t.review_other + t.review_not_produced > 0) lines.push("待复核的可以点页面顶部的「待复核」逐条查看。");
  return lines;
}

function migrationResultNote(res) {
  if (res.declined) {
    return { tone: "", title: "已记下：这些旧记录不属于这个项目", lines: ["旧索引保持原样，没有被删除；这个文件夹以后不再提示它们。"] };
  }
  const results = res.results || [];
  const last = results[results.length - 1] || {};
  if (res.ok) {
    const lines = [];
    results.forEach((r) => {
      tallyLines(r.tally).forEach((l) => lines.push(l));
      if (r.retired_to) lines.push("旧索引已移到：" + r.retired_to);
    });
    return { tone: "", title: "迁移完成", lines: lines };
  }
  if (last.holders && last.holders.length) {
    // 8.8: the engine's own description of each holder is English -- it
    // lives behind 「详情」, never in the notice's body.
    return {
      tone: "bad", title: "记录已经写好，但旧索引还被占用，没有移走",
      lines: last.holders.map((h) => "占用旧索引的进程" + (h.pid != null ? " " + h.pid : "") + "（它是什么，见「详情」）")
        .concat(["请先退出 Research OS 与 MCP 服务（占用它的那一个），然后点「继续迁移」。"]),
      detail: last.holders.map((h) => (h.pid != null ? h.pid + ": " : "") + (h.what || ""))
        .concat([last.stopped]).filter(Boolean).join("\n"),
    };
  }
  return {
    tone: "bad", title: "核对没有对上，迁移停了下来",
    lines: ["什么都没有移走，旧索引继续使用；再试一次不会重复写入。"].concat(tallyLines(last.tally)),
    detail: [last.stopped].concat((last.tally && last.tally.unmatched) || []).filter(Boolean).join("\n"),
  };
}

async function runMigration(answer, statusEl, buttons) {
  if (answer === "not_mine" && !window.confirm(
    "确定这些旧记录不属于这个项目？\n\n旧索引保持原样，不会被删除；这个文件夹以后不再提示它们。")) return;
  state.noticeBusy = true;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", answer === "migrate" ? "正在迁移…（会重新扫描整个项目，可能要一会儿）" : "正在记下…");
  let res;
  try {
    res = await apiPost("/api/migration/run", { answer: answer });
  } catch (err) {
    state.noticeBusy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", answer === "migrate" ? "迁移没有完成" : "没能记下", err);
    return;
  }
  state.noticeBusy = false;
  // The latest outcome replaces an earlier one (a refused retire, then 继续迁移).
  state.sessionNotes = state.sessionNotes.filter((n) => n.kind !== "migration");
  state.sessionNotes.push(Object.assign(migrationResultNote(res), { kind: "migration" }));
  await reloadAllViews();
}

// -- 9.3: a ledger Research OS cannot trust, and the shrink question -----------------------

const RECORD_TROUBLE = {
  missing: ["连线确认的记录文件不见了", "项目身份文件记着这个项目有连线确认的记录（.researchos/judgements.toml），但文件不在。Research OS 不会新建一个空文件来代替它；请从备份或同步服务里把它找回来。"],
  dataless: ["连线确认的记录文件还在云端", "系统正在下载 .researchos/judgements.toml，下载完成后会自动恢复。"],
  unreadable: ["连线确认的记录文件无法读取", ".researchos/judgements.toml 读不出来。"],
  invalid: ["连线确认的记录文件有一处无法解析", ".researchos/judgements.toml 里有一处读不懂（常见于手工编辑），请修正它。"],
  empty_but_expected: ["连线确认的记录文件是空的", "这个项目记录过连线确认，但 .researchos/judgements.toml 现在没有任何条目。"],
  conflict_copy: ["连线确认的记录文件旁有同步冲突副本", "同步服务在 .researchos/ 里留下了冲突副本。Research OS 不会自行合并：请留下正确的那一份，把另一份移走。"],
  no_identity: ["项目身份文件无法读取", "没有可读的项目身份，连线确认无处记录。"],
  migrating: ["项目正在迁移", "迁移完成之前不能记录连线确认。"],
};

function recordsNotice(rec) {
  if (rec.state === "shrunk") return shrinkNotice(rec);
  const box = notice("bad");
  const trouble = RECORD_TROUBLE[rec.reason] || [rec.message || "连线确认的记录文件当前无法读取，请先恢复它", ""];
  noticeHead(box, trouble[0]);
  if (trouble[1]) box.appendChild(mk("p", null, trouble[1]));
  if (rec.reason === "invalid" && rec.line) box.appendChild(mk("div", "fact-line", "出错的位置：第 " + rec.line + " 行"));
  if (rec.conflict_copies && rec.conflict_copies.length) box.appendChild(mk("div", "fact-line", "冲突副本：" + rec.conflict_copies.join("、")));
  box.appendChild(mk("p", null, "修好之前，确认、否决、撤回都不会被记录；图谱保留着它原来知道的连线确认，没有因此改变。"));
  if (rec.detail) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", rec.detail);
    box.appendChild(d);
  }
  return box;
}

function shrinkNotice(rec) {
  const missing = rec.missing || [];
  const n = missing.length;
  const box = notice("warn");
  noticeHead(box, "记录文件比图谱少了 " + n + " 条连线确认");
  box.appendChild(mk("p", null,
    "图谱记得下面这些连线确认，但 .researchos/judgements.toml 里没有了（可能是从备份恢复、同步服务保留了另一台电脑的文件，或文件被截断）。Research OS 什么都没改，等你决定以哪一份为准。"));
  const list = mk("ul", "entry-list");
  missing.forEach((m) => {
    const li = mk("li", null, historyEntryText(m));
    li.appendChild(mk("div", "entry-sub", linkText(m) + (m.note ? " · 备注：" + m.note : "")));
    list.appendChild(li);
  });
  box.appendChild(list);
  const ids = missing.map((m) => m.id); // the answer names exactly the entries shown (9.12)
  const status = mk("div", "notice-status");
  const answers = [
    ["file", "以文件为准", "这是有意从备份恢复时要的：图谱忘掉这 " + n + " 条连线确认，以文件现在的内容为准。"],
    ["restore", "把缺少的补回文件", "把这 " + n + " 条连线确认按原样追加回文件末尾（标为补回），文件里已有的内容不动。"],
  ];
  const buttons = [];
  answers.forEach(([answer, label, help]) => {
    const row = mk("div", "answer");
    const b = mkButton(label, "btn", () => answerShrink(answer, ids, n, status, buttons));
    buttons.push(b);
    row.append(b, mk("span", "answer-help", help));
    box.appendChild(row);
  });
  box.appendChild(status);
  return box;
}

async function answerShrink(answer, ids, n, statusEl, buttons) {
  if (answer === "file" && !window.confirm("以文件为准？\n\n图谱会忘掉这 " + n + " 条连线确认，以 .researchos/judgements.toml 现在的内容为准。")) return;
  state.noticeBusy = true;
  buttons.forEach((b) => { b.disabled = true; });
  setStatus(statusEl, "", "正在处理…");
  try {
    await apiPost("/api/records/answer", { file: "judgements", answer: answer, missing: ids });
  } catch (err) {
    state.noticeBusy = false;
    buttons.forEach((b) => { b.disabled = false; });
    setStatus(statusEl, "err", "没能完成这个回答", err);
    return;
  }
  state.noticeBusy = false;
  state.sessionNotes.push(answer === "file"
    ? { tone: "", title: "已以文件为准", lines: ["图谱现在只按 .researchos/judgements.toml 里的连线确认显示。"] }
    : { tone: "", title: "已把缺少的 " + n + " 条连线确认补回文件", lines: ["它们追加在 .researchos/judgements.toml 末尾，标为补回。"] });
  await refreshCurrentView();
  renderNotices(true);
}

function sessionNotice(note, index) {
  const box = notice(note.tone);
  noticeHead(box, note.title, () => {
    state.sessionNotes.splice(state.sessionNotes.indexOf(note), 1);
    renderNotices(true);
  });
  (note.lines || []).forEach((l) => box.appendChild(mk("p", null, l)));
  if (note.detail) {
    const d = mk("div", "notice-status");
    renderBlockingError(d, "", note.detail);
    box.appendChild(d);
  }
  return box;
}
