[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos"
version = "0.1.0"
description = "Research OS -- a local record of how a research project came to be: provenance over git/LaTeX/W&B, human judgments, and the files they rest on."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["research", "provenance", "reproducibility", "latex", "mlflow", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# Zero required runtime third-party dependencies (positioning ruling
# 2026-07-22: Research OS (then RCE) is a local-first standalone tool, not an MCP product --
# MCP is one optional exit among several, not a requirement to install the
# engine). See [project.optional-dependencies] below.
dependencies = []

[project.optional-dependencies]
# "mcp" (official Model Context Protocol SDK) backs only researchos.mcp_server /
# `researchos mcp` (constitution section 0, Occam rule 1 -- official SDK over a
# hand-rolled stdio/JSON-RPC protocol); every other subcommand works without
# it. Install with: pip install "researchos[mcp]"
# Upper bound is deliberate, not laziness: mcp 2.0.0 (released 2026-08)
# removed `mcp.server.fastmcp`, which researchos.mcp_server is built on -- an
# unbounded `mcp>=1.0` silently broke CI the day 2.0 shipped. Supporting the
# 2.0 server API is a separate, testable piece of work; until then this pins
# the range the code is actually verified against.
mcp = ["mcp>=1.0,<2"]
# dev pulls in mcp too, so tests/test_mcp_server.py keeps running under the
# full test suite.
dev = ["pytest>=8", "mcp>=1.0,<2"]

[project.scripts]
researchos = "researchos.cli:main"
# The old command, kept for one release (DESIGN.md 12.8): prints
# "rce is now researchos" on stderr, then runs the same main.
rce = "researchos.cli:legacy_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: drives the installed command in subprocesses, end to end (deselect with -m 'not slow'; CI runs it)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchos = ["migrations/*.sql", "webapp/app.html", "webapp/i18n.js", "webapp/canvas.js", "webapp/desk.js", "webapp/node.js", "webapp/team.js", "webapp/routemap.js", "webapp/shell/*.swift"]
